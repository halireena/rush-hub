gies in Kenya."}, {"q": "What common thread links Kheyti's success?", "a": "Affordable hardware combined with farmer training and ongoing support."}], "for_rush": "The UAE GigaFarm example is a concrete company/project to mention when targeting UAE vertical-farming employers.", "priority": "useful"}, {"n": 4, "title": "Pathways to Enabling CEA in Developing Countries", "pdf_pages": "13-14", "minutes": 6, "summary": ["Invest in context-specific R&D, including hybrid low-tech/high-tech systems adapted to local water, energy and labour and powered by local alternative energy.", "Integrate policy across agriculture, energy and infrastructure, and put CEA into national food-security strategies.", "Use incentives - grants, training, technical help, tax breaks or input subsidies - and build consumer trust through transparency.", "Scale in steps: start with simple sunlight-based set-ups (e.g. rooftop farms) and add advanced features as capacity and budgets grow.", "Success needs collaboration between policymakers, technology providers and communities."], "terms": [{"term": "Hybrid approach", "def": "Combining simple low-tech methods with selected high-tech tools to suit local conditions."}, {"term": "Food security", "def": "Reliable access to enough safe, nutritious food."}, {"term": "Subsidy", "def": "Public money that lowers a cost, such as for crop inputs or equipment."}, {"term": "Rooftop farm", "def": "A farm on a building roof, often using natural sunlight."}], "cards": [{"q": "What is UNDP's recommended first step for scaling CEA affordably?", "a": "Start with simpler set-ups using natural sunlight, such as rooftop farms, then add advanced features gradually."}, {"q": "Name two financial incentives UNDP suggests.", "a": "Any two of grants, tax breaks, crop input subsidies (plus training and technical assistance)."}, {"q": "Which three sectors should CEA policy bridge?", "a": "Agriculture, energy and infrastructure."}, {"q": "What is meant by a hybrid low-tech/high-tech approach?", "a": "Adapting systems to local resources by mixing simple methods with selected advanced technologies."}, {"q": "Why does consumer trust matter for CEA?", "a": "Buyers must accept and pay for CEA produce; transparency builds that trust."}], "for_rush": "", "priority": "skim"}]}, {"slug": "fao_greenhouse217", "short": "FAO Greenhouse GAP 217", "emoji": "🏠", "color": "#2c7a7b", "warn": "Partial: cards cover chapters 1–3 only (the online PDF was too long to read in full). Read the rest from the PDF.", "title": "Good Agricultural Practices for greenhouse vegetable crops: Principles for Mediterranean climate areas (FAO Plant Production and Protection Paper 217)", "authors": "W. Baudoin, R. Nono-Womdim, N. Lutaladio, A. Hodder (FAO); N. Castilla, C. Leonardi, S. De Pascale (ISHS); M. Qaryouti (NCARE)", "edition": "2013", "file": "", "url": "https://www.fao.org/4/i3284e/i3284e.pdf", "licence": "FAO, free for private study", "overview": "A 21-chapter technical manual written by Mediterranean greenhouse experts, covering everything from choosing a site and designing the structure to irrigation, nutrition, soilless culture, pest management, harvest and certification. It frames 'Good Agricultural Practices' as an integrated approach to intensify greenhouse production sustainably while improving quality and safety and cutting pesticide use.", "how": "Read the site-selection and design chapters first for the climate logic (radiation and temperature thresholds), then dip into irrigation, water quality and soilless culture chapters as reference. NOTE: only chapters 1-3 are covered here because the reading tool could only see the first ~44 pages of this 600+ page PDF.", "free": true, "chapters": [{"n": 1, "title": "Regional Working Group on Greenhouse Crop Production in the Mediterranean Region: history and development", "pdf_pages": "1-20", "minutes": 15, "summary": ["The FAO Working Group on greenhouse crop production in the Mediterranean grew out of an FAO expert consultation in November 1993.", "Its members were 12 Near East and North Africa countries: Algeria, Cyprus, Egypt, Jordan, Lebanon, Libya, Malta, Morocco, the Palestinian Authority, Syria, Tunisia and Turkey.", "The book is presented as a milestone that pulls together about 20 years of the group's shared expertise.", "GAP for greenhouses is defined as an 'integrated approach' to sustainable intensification of greenhouse production, aiming at better product quality and safety while reducing pesticide use.", "The preface estimates around 405 000 ha of greenhouses worldwide and notes that Mediterranean countries have become increasingly competitive greenhouse vegetable producers."], "terms": [{"term": "GAP (Good Agricultural Practices)", "def": "A set of principles for producing food that is safe, good quality and environmentally sustainable; here applied to greenhouse vegetable production."}, {"term": "Sustainable intensification", "def": "Producing more from the same area while reducing harm to the environment and resources."}, {"term": "Protected cultivation", "def": "Growing crops under structures such as greenhouses, tunnels or net houses that modify the plants' environment."}, {"term": "Regional Working Group", "def": "An FAO-coordinated network of countries that share research, training and technical know-how on a theme."}, {"term": "ISHS", "def": "International Society for Horticultural Science, a co-publisher of this book."}], "cards": [{"q": "When did the idea for the FAO Mediterranean greenhouse working group arise?", "a": "From an FAO expert consultation meeting held in November 1993."}, {"q": "How many countries were in the Mediterranean greenhouse working group?", "a": "Twelve countries from the Near East and North Africa region."}, {"q": "Name four member countries of the working group.", "a": "Any four of: Algeria, Cyprus, Egypt, Jordan, Lebanon, Libya, Malta, Morocco, the Palestinian Authority, Syria, Tunisia, Turkey."}, {"q": "How does this book define GAP for greenhouses?", "a": "As an integrated approach to sustainable greenhouse crop intensification that improves quality and safety while reducing pesticide use."}, {"q": "Roughly how much greenhouse area exists worldwide according to the preface?", "a": "About 405 000 hectares."}, {"q": "Why is GAP linked to reducing pesticides?", "a": "Because safer products and a healthier environment depend on preventing problems (good design, hygiene, IPM) rather than relying on chemical sprays."}, {"q": "Which three organisations' experts edited this book?", "a": "FAO, ISHS and NCARE (Jordan's National Centre for Agricultural Research and Extension)."}], "for_rush": "Shows that the Middle East has an established FAO network on greenhouse vegetables, useful background when talking to UAE agri-tech or controlled-environment employers.", "priority": "skim"}, {"n": 2, "title": "Greenhouse site selection", "pdf_pages": "21-34", "minutes": 25, "summary": ["Solar radiation is the first and most important climate factor when judging whether a region suits greenhouse growing, especially its year-round availability.", "Warm-season vegetables need a minimum of about 8.5 MJ/m2/day of global radiation (2.34 kWh/m2/day) and around 6 hours of light a day (500-550 hours in total) during the three shortest months.", "These crops are adapted to average air temperatures of 17-28 C, with limits of 12 C (minimum) and 32 C (maximum); soil above 14 C and relative humidity of 70-90% are also desirable.", "Wind, rain and CO2 matter less for judging climate suitability, but topography matters: cold air sinks, so sites must let cold air drain away on calm nights.", "The ground should be nearly flat: slope on the main axes 0-0.5% and never above 1-2%.", "Enough good-quality water is essential, plus access to roads, communications (phone, internet) and energy (gas, electricity)."], "terms": [{"term": "Global radiation", "def": "Total solar energy (direct plus diffuse) reaching a horizontal surface, often given in MJ per m2 per day."}, {"term": "Climate suitability", "def": "How well an area's natural climate matches a crop's needs, so that less expensive artificial heating or cooling is required."}, {"term": "Cold-air drainage", "def": "The flow of heavy cold air downhill on calm nights; hollows where it collects are frost-prone and poor greenhouse sites."}, {"term": "Warm-season (thermophilic) vegetables", "def": "Crops such as tomato, pepper, cucumber and melon that need warm conditions to grow well."}, {"term": "Parral (Almeria-type) greenhouse", "def": "A low-cost plastic greenhouse with rigid posts and a double wire grid holding the film; very common in Mediterranean Spain."}, {"term": "Relative humidity (RH)", "def": "How much water vapour the air holds compared with the maximum it could hold at that temperature, as a percentage."}], "cards": [{"q": "What is the first climate factor to assess when choosing a greenhouse site?", "a": "Solar radiation, especially its year-round availability."}, {"q": "Minimum daily radiation for warm-season greenhouse vegetables in the darkest months?", "a": "About 8.5 MJ/m2/day (equivalent to 2.34 kWh/m2/day)."}, {"q": "How much light per day, and in total, do these crops need in the three shortest months?", "a": "Around 6 hours per day, totalling at least 500-550 hours over those three months."}, {"q": "Optimal average air temperature range and limits for warm-season greenhouse vegetables?", "a": "17-28 C on average, with a minimum limit of 12 C and a maximum of 32 C."}, {"q": "Desirable soil temperature and relative humidity for these crops?", "a": "Soil above 14 C and RH of 70-90%."}, {"q": "What ground slope is recommended along the main axes of a greenhouse site?", "a": "Between 0 and 0.5%, never more than 1-2%."}, {"q": "Why avoid hollows and low spots for greenhouses?", "a": "Cold air is heavier than warm air and drains downhill on calm nights, so low spots become cold pockets."}, {"q": "Besides climate, name three practical site requirements.", "a": "Enough water of good quality; transport links (roads, rail); communications and energy supply (internet, phone, gas, electricity)."}, {"q": "Which climate factors influence suitability only to a lesser degree?", "a": "Wind, rain and CO2."}, {"q": "Why does the book advise against sites that need expensive artificial climate control?", "a": "Because heating or cooling costs make production uncompetitive and less sustainable; a naturally suitable climate is preferred."}], "for_rush": "The UAE has plenty of radiation but exceeds the 32 C upper limit for much of the year, so cooling, not light, is the main design problem for Gulf greenhouses.", "priority": "core"}, {"n": 3, "title": "Greenhouse design and covering materials (first part only, to p. 44)", "pdf_pages": "35-44 (of 35-62)", "minutes": 25, "summary": ["The parral greenhouse is probably the most widespread type by area; in Almeria (Spain) alone it covers about 27 000 ha. Industrial multi-span arch greenhouses are usually clad with plastic film or polycarbonate, while glasshouses are under 1% of greenhouse area in countries like Spain.", "Roof slope affects winter light: raising it from 11 to 45 degrees can increase daily light transmission by nearly 10%, but most new greenhouses use 25-30 degrees as a compromise; east-west orientation transmits more light than north-south in winter.", "Ventilator area is often around 25% of the covered area in glasshouses.", "Plastic films are 80-200 micrometres thick and very light (1 m2 of 200 um LDPE weighs about 184 g, versus about 10 kg for 4 mm glass); UV stabilisers make most films last over a year.", "Additives change film behaviour: IR-absorbing (thermal) additives keep heat in on clear nights, anti-drip additives turn droplets into a thin water layer, and diffusive films spread light deeper into the canopy (cucumber yield up about 8%).", "Dirt reduced a new PE film's light transmission by about 6% after a year; NIR-blocking films cut summer temperatures by up to 4 C in Spanish trials and improved a pepper crop."], "terms": [{"term": "Multi-span greenhouse", "def": "Several greenhouse bays joined side by side under one structure, sharing gutters."}, {"term": "LDPE", "def": "Low-density polyethylene, the most common plastic greenhouse film."}, {"term": "Long-wave (thermal) IR", "def": "Heat radiated by soil and plants at night; plain PE lets much of it escape, so thermal additives are used."}, {"term": "Anti-drip additive", "def": "Changes water surface tension so condensation forms a thin film instead of drops that fall on plants and block light."}, {"term": "Diffusive film", "def": "A cover that scatters light so it reaches lower and middle leaves more evenly."}, {"term": "NIR (near-infrared)", "def": "Invisible radiation just beyond red light that heats the crop and greenhouse but is not used for photosynthesis."}, {"term": "PAR", "def": "Photosynthetically active radiation, the 400-700 nm light plants use for photosynthesis."}], "cards": [{"q": "Which greenhouse type is probably the most widespread by area, and how much is in Almeria?", "a": "The parral type; about 27 000 ha in Almeria alone."}, {"q": "What happens to winter light if roof slope rises from 11 to 45 degrees?", "a": "Daily light transmission can rise by nearly 10%."}, {"q": "What roof slope do most new greenhouses use?", "a": "25-30 degrees, a compromise between light gain and cost/structure."}, {"q": "Which orientation gives more winter light transmission?", "a": "East-west rather than north-south."}, {"q": "Typical thickness range of greenhouse plastic films?", "a": "80-200 micrometres."}, {"q": "Ventilator area relative to covered area in glasshouses?", "a": "Often about 25%."}, {"q": "Why add IR-absorbing (thermal) additives to PE film?", "a": "Plain PE is very transparent to long-wave IR, so heat escapes at night; additives keep unheated greenhouses warmer on clear nights."}, {"q": "How much did a diffusive cover increase cucumber production?", "a": "About 8%, because more light reached the middle leaf layers."}, {"q": "How much light did dust remove from a new PE film after a year in coastal Spain?", "a": "About 6%."}, {"q": "What benefit did NIR-blocking films show in Spain?", "a": "Summer temperature reductions of up to 4 C and better yield and quality of pepper."}, {"q": "Compare the weight of 1 m2 of 200 um LDPE film with 4 mm glass.", "a": "About 184 g versus about 10 kg, so plastic structures can be much lighter and cheaper."}], "for_rush": "NIR-blocking and diffusive covers are exactly the kind of low-energy cooling tools relevant to UAE greenhouses where heat load is the main limit.", "priority": "core"}]}, {"slug": "fao_greenhouse230", "short": "FAO Greenhouse GAP 230", "emoji": "🏡", "color": "#285e61", "warn": "Partial: cards cover the first parts only. Read the crop chapters (incl. leafy greens) from the PDF.", "title": "Good Agricultural Practices for greenhouse vegetable production in the South East European countries: Principles for sustainable intensification of smallholder farms (FAO Plant Production and Protection Paper 230)", "authors": "W. Baudoin, A. Nersisyan, A. Shamilov, A. Hodder, D. Gutierrez (FAO); S. De Pascale, S. Nicola (ISHS); N. Gruda (Univ. Bonn); L. Urban (Univ. Avignon); J. Tanny (Volcani Center)", "edition": "2017", "file": "", "url": "https://www.fao.org/4/i6787e/i6787e.pdf", "licence": "FAO, free for private study", "overview": "A companion to PPP 217 for South East Europe, aimed at smallholder greenhouse farmers. Part I describes the regional situation, Part II covers themes (structures, soil, irrigation, IPM, seedlings, production systems, footprint, profitability) and Part III gives crop-by-crop technology sheets from tomato to strawberry.", "how": "Much of Part II overlaps PPP 217, so focus on what is new: the practical GAP checklists for ventilation and cooling, and the Part III crop sheets (especially lettuce and leafy vegetables). NOTE: only pages up to 43 could be read by the fetch tool.", "free": true, "chapters": [{"n": 1, "title": "Part I: Working Group history and current situation of protected cultivation in South East Europe", "pdf_pages": "3-28", "minutes": 20, "summary": ["The SEE Regional Working Group held its first coordinating meeting on 20-22 October 2004 in Budapest; members include Albania, Bosnia and Herzegovina, Bulgaria, Croatia, Greece, Hungary, Kosovo, North Macedonia, Moldova, Montenegro, Romania, Serbia, Slovenia and Turkey.", "Its aim is to raise growers' scientific knowledge and technical capacity so the greenhouse sector becomes more competitive, through information sharing, capacity building and projects.", "Protected cultivation in SEE covers about 101 888 ha, roughly 5.15% of vegetable area but about 19.09% of vegetable production (around 7.96 million tonnes), showing how productive greenhouses are per hectare.", "Area ranges from 48 ha in Montenegro to 61 512 ha in Turkey; tomato covers more than double any other crop, followed by cucumber, pepper and lettuce.", "Most of the 54 585 ha of greenhouses are plastic-covered and unheated; soilless culture is still small (largest in Turkey, about 700 ha).", "Key constraints are weak knowledge of greenhouse design, covers, heating and ventilation, plus poor farmer organisation, product quality, packaging and labelling."], "terms": [{"term": "SEE", "def": "South East Europe, the Balkan and neighbouring countries covered by this book."}, {"term": "Smallholder", "def": "A small family farm with limited land and capital."}, {"term": "Soilless culture", "def": "Growing plants in nutrient solution or inert substrates instead of soil (open-loop drains to waste, closed-loop recirculates)."}, {"term": "Technification", "def": "Upgrading production with better technology, such as climate control and fertigation."}, {"term": "Save and Grow", "def": "FAO's paradigm of producing more with fewer inputs and less environmental impact, which this book follows."}], "cards": [{"q": "Total protected cultivation area in South East Europe?", "a": "About 101 888 ha."}, {"q": "What share of SEE vegetable area and production is protected cultivation?", "a": "About 5.15% of area but about 19.09% of production."}, {"q": "Why does 5% of area give nearly 19% of output?", "a": "Greenhouses give much higher yields per hectare thanks to a controlled environment and longer seasons."}, {"q": "Which SEE country has the most protected crop area, and how much?", "a": "Turkey, with about 61 512 ha."}, {"q": "Which protected crop dominates in SEE?", "a": "Tomato, with more than double the area of any other, followed by cucumber, pepper and lettuce."}, {"q": "What type of greenhouse makes up most SEE greenhouse area?", "a": "Plastic-covered greenhouses without heating."}, {"q": "Where is soilless culture largest in SEE and how big is it?", "a": "Turkey, about 700 ha, using open- and closed-loop systems."}, {"q": "Name two main constraints for SEE greenhouse growers.", "a": "Poor knowledge of design, covers, heating and ventilation; weak farmer organisation, product quality, packaging and labelling."}], "for_rush": "The 5% area / 19% output contrast is a handy statistic for explaining why controlled-environment agriculture matters for land- and water-scarce countries like the UAE.", "priority": "useful"}, {"n": 2, "title": "Part II ch. 1: Structures, design, technology and climate control (to p. 43)", "pdf_pages": "29-43 (of 29-52)", "minutes": 25, "summary": ["Warm-season greenhouse crops suit average temperatures of 17-27 C, with rough limits of 10 C and 35 C; if the average minimum outside temperature is below 10 C, heating is probably needed, especially at night.", "PE film is an affordable, efficient cover that can carry additives; UV-absorbing films reduce some fungal diseases and insect-spread viruses, NIR-reflecting films cut heat load while keeping PAR, and diffusing materials raised cucumber yield 8-10%.", "Natural ventilation GAP: total vent area 15-30% of floor area, shading factor 20-40% to keep inside temperature near outside, and about 50% more vent area when insect-proof screens are fitted.", "Mechanical ventilation GAP: fans able to work against about 30 Pa static pressure, spaced no more than 8-10 m apart.", "Evaporative cooling: high-pressure fog (40 bar) works better than low-pressure (5 bar); fan-and-pad systems need about 1 m2 of pad per 20-30 m2 of greenhouse.", "Heating can reach up to 35% of total production costs; temperature sensors should be placed at plant level, not eye level."], "terms": [{"term": "Shading factor", "def": "The percentage of incoming light a shade screen or whitewash blocks."}, {"term": "Insect-proof screen", "def": "Fine mesh over vents that keeps insects out but also slows airflow, so vents must be larger."}, {"term": "Static pressure (Pa)", "def": "The resistance a fan must push against (screens, pads); 30 Pa is about 3 mm water gauge."}, {"term": "Fog system", "def": "Nozzles spray tiny droplets that evaporate in the air, cooling and humidifying it."}, {"term": "Fan-and-pad cooling", "def": "Fans pull outside air through wet pads at one end of the greenhouse; evaporation cools the air."}, {"term": "Heat loss coefficient (U)", "def": "How quickly heat escapes through the cover per m2 per degree of temperature difference; used to size heating."}], "cards": [{"q": "Temperature range and limits for warm-season greenhouse crops in this book?", "a": "Average 17-27 C, with approximate limits of 10 C and 35 C."}, {"q": "When is heating probably necessary?", "a": "When the average minimum outside temperature is below 10 C, especially at night."}, {"q": "Recommended total ventilator area for natural ventilation?", "a": "15-30% of the floor area."}, {"q": "Recommended shading factor to keep a greenhouse close to outside temperature?", "a": "20-40%."}, {"q": "How much should vent area increase when insect screens are fitted?", "a": "By about 50%."}, {"q": "Fan specification for mechanical ventilation?", "a": "About 30 Pa static pressure, with fans no more than 8-10 m apart."}, {"q": "Which fog system is more effective?", "a": "High-pressure (40 bar) rather than low-pressure (5 bar)."}, {"q": "Pad area for a fan-and-pad system?", "a": "About 1 m2 of pad per 20-30 m2 of greenhouse floor."}, {"q": "Yield gain from diffusing covers on cucumber?", "a": "About 8-10%."}, {"q": "What share of production cost can heating reach?", "a": "Up to 35%."}, {"q": "Where should thermostats and sensors be placed?", "a": "At plant level, not at eye level, so they measure what the crop experiences."}], "for_rush": "Fan-and-pad sizing and fog pressure are directly relevant to Gulf greenhouses, though in very humid coastal UAE summers evaporative cooling works less well.", "priority": "core"}]}, {"slug": "fao_aquaponics", "short": "FAO Small-scale Aquaponics", "emoji": "🐟", "color": "#3182ce", "warn": "No cards: the PDF is too large to read online. Download it and read it as a normal book.", "title": "Small-scale aquaponic food production: Integrated fish and plant farming (FAO Fisheries and Aquaculture Technical Paper 589)", "authors": "C. Somerville, M. Cohen, E. Pantanella, A. Stankus, A. Lovatelli (FAO)", "edition": "2014", "file": "", "url": "https://www.fao.org/4/i4021e/i4021e.pdf", "licence": "FAO, free for private study", "overview": "FAO's practical handbook on small-scale aquaponics, combining recirculating fish culture with soilless vegetable growing. Chapters cover the basics, water quality, unit design (media bed, NFT, deep water culture), bacteria, plants, fish, management and troubleshooting, plus appendices with step-by-step builds.", "how": "Not yet available in the app: the source could not be read reliably.", "free": true, "chapters": []}, {"slug": "fao_saveandgrow", "short": "Save and Grow (FAO)", "emoji": "🌍", "color": "#6b8e23", "warn": "", "title": "Save and Grow: A policymaker's guide to the sustainable intensification of smallholder crop production", "authors": "FAO (lead authors L. Collette, T. Hodgkin, A. Kassam, P. Kenmore, L. Lipper, C. Nolte, K. Stamoulis, P. Steduto; technical editors M. Rai, T. Reeves, S. Pandey)", "edition": "2011", "file": "", "url": "https://www.fao.org/4/i2215e/i2215e.pdf", "licence": "FAO, free for private study", "overview": "FAO's short manifesto for 'sustainable crop production intensification' (SCPI): growing more food on the same land while protecting soil, water and biodiversity. It sets out an ecosystem approach built on healthy soil, diverse crops and good seed, smart water use and integrated pest management, then explains the policies and institutions needed to scale it up.", "how": "Read Chapter 1 for the big idea and numbers, then chapters 3-6 for the technical pillars (soil, varieties, water, pests); skim chapter 7 unless you need policy context. About 2-3 hours in total.", "free": true, "chapters": [{"n": 1, "title": "The challenge", "pdf_pages": "1-14", "minutes": 25, "summary": ["World population was projected to grow from 6.9 billion (2010) to 9.2 billion (2050), with urban share rising from 50% to 70%; food production must rise about 70% globally and nearly 100% in developing countries.", "That means roughly an extra 1 billion tonnes of cereals and 200 million tonnes of meat a year, mostly from higher yields, yet yield growth is slowing (wheat from about 5% a year in 1980 to 2% in 2005; rice and maize from about 3% to 1%).", "The Green Revolution worked but left damage: degraded land, salinisation, depleted groundwater, pest resistance and biodiversity loss; 925 million people were still undernourished in 2010.", "SCPI is defined as producing more from the same land while reducing negative environmental impacts and increasing contributions to natural capital and environmental services.", "Its ecosystem approach rests on healthy soil, wider crop diversity, good adapted seed, integrated pest management and efficient water use; a review of 57 low-income countries found such practices raised yields by an average of 79%.", "SCPI is knowledge-intensive, so it needs strong extension services, farmer field schools (begun in Southeast Asia in the late 1980s) and equal access to resources for women farmers."], "terms": [{"term": "SCPI", "def": "Sustainable crop production intensification: more output from the same land with less environmental harm and more natural capital."}, {"term": "Natural capital", "def": "The stock of natural resources (soil, water, biodiversity) that provide ecosystem services."}, {"term": "Ecosystem services", "def": "Benefits nature provides to farming, such as pollination, nutrient cycling and natural pest control."}, {"term": "Green Revolution", "def": "The spread of high-yielding varieties, fertilisers, pesticides and irrigation from the 1960s that greatly raised cereal yields."}, {"term": "Farmer field school (FFS)", "def": "Group-based, hands-on learning in the field where farmers test and adapt practices themselves."}, {"term": "Smallholder", "def": "A small-scale farmer; about 500 million smallholders produce around 80% of food in developing countries."}], "cards": [{"q": "How much must global food production rise by 2050 according to Save and Grow?", "a": "About 70% globally, and nearly 100% in developing countries."}, {"q": "Projected world population in 2050 used in the book?", "a": "About 9.2 billion (from 6.9 billion in 2010)."}, {"q": "How did wheat yield growth change between 1980 and 2005?", "a": "It fell from about 5% a year to about 2%."}, {"q": "Define SCPI.", "a": "Producing more from the same area of land while reducing negative environmental impacts and increasing natural capital and environmental services."}, {"q": "List the five technical pillars of the SCPI ecosystem approach.", "a": "Healthy soil, crop diversity, good adapted seed/varieties, integrated pest management, efficient water management."}, {"q": "What average yield increase was found across 57 low-income countries using SCPI-type practices?", "a": "About 79%."}, {"q": "How many people were undernourished in 2010?", "a": "About 925 million."}, {"q": "Name three environmental side-effects of high-input farming mentioned.", "a": "Any three of: land degradation, salinisation, groundwater depletion, pest resistance, biodiversity loss."}, {"q": "Why does SCPI need extension services and farmer field schools?", "a": "Because it is knowledge-intensive: farmers must understand and adapt ecological practices to their own fields."}], "for_rush": "SCPI is the policy language FAO and Gulf food-security strategies use, so knowing it helps frame genomics or controlled-environment work in job interviews.", "priority": "core"}, {"n": 2, "title": "Farming systems", "pdf_pages": "15-26", "minutes": 20, "summary": ["SCPI farming systems should raise productivity while enhancing natural capital, use inputs (water, nutrients, pesticides, energy, land, labour) efficiently, and use biodiversity to build resilience to stresses.", "Conservation agriculture (CA) is the foundation, based on three practices: minimal soil disturbance (little or no tillage), permanent organic soil cover (crops or residues) and diverse species in rotations or associations.", "These are complemented by good adapted varieties, balanced nutrient management, integrated pest and weed management and efficient water management.", "CA was practised on about 117 million ha, about 8% of cropland, with over 50% adoption in Australia, Canada and southern South America and growing use in Africa, Central Asia and China.", "CA can cut energy needs by up to 60% compared with conventional farming; in Karatu, Tanzania, maize yields rose from 1 to 6 t/ha without agrochemicals, and labour fell by more than half by year four of zero tillage with cover crops."], "terms": [{"term": "Conservation agriculture", "def": "Farming with minimal tillage, permanent soil cover and crop diversification."}, {"term": "Zero (no) tillage", "def": "Sowing directly into unploughed soil, protecting structure and soil life."}, {"term": "Cover crop", "def": "A crop grown mainly to cover and protect the soil, often a legume, rather than for harvest."}, {"term": "Crop rotation", "def": "Growing different crops in sequence on the same land to break pest cycles and balance nutrients."}, {"term": "Resilience", "def": "A system's ability to cope with and recover from shocks such as drought, pests or price swings."}], "cards": [{"q": "What are the three core practices of conservation agriculture?", "a": "Minimal mechanical soil disturbance, permanent organic soil cover, and species diversification through rotations/associations."}, {"q": "Global area under conservation agriculture cited in Save and Grow?", "a": "About 117 million ha, roughly 8% of cropland."}, {"q": "Where is CA adoption above 50%?", "a": "Australia, Canada and the southern part of South America."}, {"q": "By how much can CA reduce energy requirements?", "a": "Up to 60% compared with conventional farming."}, {"q": "What happened to maize yields in Karatu, Tanzania, under CA?", "a": "They rose from about 1 t/ha to 6 t/ha without agrochemicals."}, {"q": "What happened to labour needs in the Tanzanian zero-tillage example?", "a": "By the fourth year they had fallen by more than half."}, {"q": "What are the three technical principles of SCPI farming systems?", "a": "Raise productivity while enhancing natural capital; use inputs efficiently; use biodiversity to build resilience."}], "for_rush": "", "priority": "useful"}, {"n": 3, "title": "Soil health", "pdf_pages": "27-38", "minutes": 20, "summary": ["Soil health is the soil's capacity to function as a living system: diverse soil organisms control pests and disease, form symbioses with roots, recycle nutrients and improve structure and water-holding capacity.", "Two key signs of a healthy soil are rich soil biodiversity and high non-living organic matter; keeping organic matter at a satisfactory level is a reliable indicator of soil health.", "World mineral fertiliser production rose about 350% from 1961 to 2002 (33 to 146 million tonnes) and accounted for roughly 40% of the food production increase over 40 years.", "Efficiency is poor: in China nitrogen uptake efficiency is only about 26-28% for rice, wheat and maize and under 20% for vegetables; the rest is lost to the environment, and nitrogen deposition threatens about 70% of nature in the EU.", "Integrated plant nutrient management combines biological processes (nitrogen fixation by legumes, mycorrhizae, deep-rooted plants recycling subsoil nutrients) with mineral fertiliser only where needed, covering all essential nutrients.", "Policy actions include regulations for sustainable land husbandry and monitoring soil health using organic matter, nutrient balance, yield gaps, land-use intensity and biodiversity."], "terms": [{"term": "Soil health", "def": "The capacity of soil to function as a living system supporting crops without polluting the environment."}, {"term": "Soil organic matter", "def": "Decomposed plant and animal material in soil that holds water and nutrients and feeds soil life."}, {"term": "Biological nitrogen fixation", "def": "Conversion of air nitrogen into plant-usable forms by bacteria, e.g. rhizobia in legume root nodules."}, {"term": "Mycorrhizae", "def": "Fungi living in partnership with roots that help plants take up phosphorus and water."}, {"term": "Integrated plant nutrient management", "def": "Combining organic sources, biological processes and judicious mineral fertiliser to meet crop needs efficiently."}, {"term": "Nitrogen uptake efficiency", "def": "The share of applied nitrogen fertiliser actually taken up by the crop."}], "cards": [{"q": "What are the two key characteristics of a healthy soil?", "a": "A rich diversity of soil organisms and a high content of non-living organic matter."}, {"q": "What is the most reliable simple indicator of soil health in the book?", "a": "Whether soil organic matter is maintained at a satisfactory level."}, {"q": "How much did world mineral fertiliser production grow from 1961 to 2002?", "a": "About 350%, from 33 to 146 million tonnes."}, {"q": "Nitrogen uptake efficiency for cereals in China?", "a": "Only about 26-28% (under 20% for vegetables)."}, {"q": "What share of EU nature is threatened by excess nitrogen deposition?", "a": "About 70%."}, {"q": "Name two biological processes used in integrated plant nutrient management.", "a": "Legume nitrogen fixation and mycorrhizal associations (also deep roots recycling subsoil nutrients)."}, {"q": "Name three indicators suggested for monitoring soil health.", "a": "Any three of: organic matter content, nutrient balance, yield gap, land-use intensity, biodiversity."}, {"q": "Name one precise fertiliser technique listed in this chapter.", "a": "Urea deep placement in rice (Bangladesh) or site-specific nutrient management in intensive rice."}], "for_rush": "Low nitrogen-use efficiency is a major target for plant genomics (breeding for better N uptake), and in hydroponics you control nutrient delivery directly to avoid such losses.", "priority": "core"}, {"n": 4, "title": "Crops and varieties", "pdf_pages": "39-50", "minutes": 20, "summary": ["SCPI needs improved varieties adapted to diverse agro-ecosystems and low-input practices, more tolerant of drought, flood, frost and heat, and more resistant to pests and diseases.", "The system has three linked parts: conserving and distributing plant genetic resources (PGR), developing varieties, and producing and delivering seed.", "Genebanks conserve some 7.4 million accessions, yet about 75% of crop genetic diversity has already been lost and a third of today's diversity could disappear by 2050; PGR are conserved ex situ, in situ and on farm.", "Well over 70% of seed, even for major crops, is managed within farmers' own seed systems in some countries, so both formal (certified) and informal seed systems need support.", "Molecular genetics and other biotechnologies are now widely used in public and private breeding; the book calls for revitalising public breeding, training breeders, involving farmers and improving seed laws."], "terms": [{"term": "Plant genetic resources (PGR)", "def": "The genetic diversity in crops, landraces and wild relatives that breeders use."}, {"term": "Accession", "def": "A distinct sample of seed or plant material stored in a genebank."}, {"term": "Ex situ conservation", "def": "Conserving diversity outside its natural habitat, e.g. in genebanks."}, {"term": "In situ / on-farm conservation", "def": "Keeping diversity alive in wild habitats or in farmers' fields where it evolves."}, {"term": "Formal seed system", "def": "Certified seed of released varieties supplied by public services and companies."}, {"term": "Informal seed system", "def": "Farmers saving, exchanging and selling their own seed."}, {"term": "ITPGRFA", "def": "International Treaty on Plant Genetic Resources for Food and Agriculture."}], "cards": [{"q": "How many accessions do the world's genebanks conserve?", "a": "About 7.4 million."}, {"q": "How much crop genetic diversity has been lost, and what is the 2050 risk?", "a": "About 75% has been lost; a third of today's diversity could disappear by 2050."}, {"q": "What are the three linked components of the crop improvement system?", "a": "PGR conservation and distribution, variety development, and seed production and delivery."}, {"q": "Name the three ways PGR are conserved.", "a": "Ex situ (genebanks), in situ (wild populations) and on farm."}, {"q": "What share of seed comes from farmer seed systems in some countries?", "a": "Well over 70%, even for major crops."}, {"q": "Which traits do SCPI varieties need?", "a": "Resistance to pests and diseases and tolerance of drought, flood, frost and higher temperatures, suited to low-input practices."}, {"q": "What role do biotechnologies play according to the chapter?", "a": "Molecular genetics and other biotechnologies are widely used by national and private breeding programmes."}, {"q": "Why must both formal and informal seed systems be strengthened?", "a": "Most smallholders rely on farm-saved seed, while formal systems supply certified improved varieties; linking them gets good varieties to farmers."}], "for_rush": "This is the chapter closest to plant genomics careers: genebanks, breeding for heat and drought tolerance and molecular breeding are exactly where bioinformaticians are hired.", "priority": "core"}, {"n": 5, "title": "Water management", "pdf_pages": "51-64", "minutes": 20, "summary": ["About 80% of the world's roughly 1.4 billion ha of cropland is rainfed and produces about 60% of output; the irrigated 20% produces about 40%, with yields 2-3 times higher.", "Crops use less than half of the irrigation water they receive; rice paddies (about 80 million ha in Asia) emit an estimated 3-10% of global methane.", "Rainfed systems should maximise water stored in the root zone through conservation agriculture, reduced tillage and mulching, plus better seasonal forecasts, advice and crop insurance.", "Irrigated systems should adopt precision irrigation guided by soil-moisture and canopy-temperature sensors, deficit irrigation, fertigation, and drainage to prevent salinisation.", "The goal is 'more crop per drop' with less environmental impact, supported by institutions that separate irrigation service delivery from water-resource regulation."], "terms": [{"term": "Rainfed agriculture", "def": "Farming that relies only on rainfall for crop water."}, {"term": "Deficit irrigation", "def": "Deliberately supplying less water than full crop demand, with controlled stress at less sensitive stages, to save water."}, {"term": "Fertigation", "def": "Applying fertiliser dissolved in irrigation water."}, {"term": "Salinisation", "def": "Build-up of salts in soil, often from irrigation without adequate drainage."}, {"term": "Water productivity", "def": "Crop output per unit of water used ('more crop per drop')."}], "cards": [{"q": "What share of cropland is rainfed and what share of output does it produce?", "a": "About 80% of cropland, producing about 60% of output."}, {"q": "How much more do irrigated yields typically give than rainfed?", "a": "Two to three times higher."}, {"q": "What share of irrigation water do crops actually use?", "a": "Less than 50%."}, {"q": "What share of global methane do rice paddies emit?", "a": "An estimated 3-10%."}, {"q": "What is regulated deficit irrigation?", "a": "Applying controlled water stress at selected growth stages to cut water use while keeping productivity."}, {"q": "Which sensors are suggested for precision irrigation?", "a": "Soil-moisture sensors and canopy-temperature sensors."}, {"q": "Why is drainage important in irrigated systems?", "a": "To prevent salt build-up (salinisation) in the root zone."}], "for_rush": "Water productivity and salinisation are central issues for UAE farming, and recirculating hydroponics is an extreme form of 'more crop per drop'.", "priority": "core"}, {"n": 6, "title": "Plant protection", "pdf_pages": "65-76", "minutes": 15, "summary": ["Global pesticide sales were expected to exceed US$40 billion in 2010, yet crop losses to pests are still about 30-40%, similar to 50 years ago.", "Less than 1% of applied pesticide reaches the target pest; the rest ends up in air, soil and water, and overuse drives a cycle of pest resistance.", "IPM, the leading holistic strategy since the 1960s, starts from the idea that a healthy agro-ecosystem is the first line of defence; the aim is to keep pests below damaging levels, not to wipe them out, so natural enemies survive.", "IPM tools include resistant varieties, rotations, intercropping, timing of planting, weed management, natural enemies, biopesticides and selective low-risk pesticides only when needed.", "Large government IPM programmes run in over 60 countries; recommendations include farmer field schools, removing pesticide subsidies, pesticide taxes and real-time pest surveillance."], "terms": [{"term": "Integrated pest management (IPM)", "def": "Managing pests by combining ecological, biological, cultural and, only if needed, chemical methods."}, {"term": "Natural enemies", "def": "Predators, parasites and pathogens that attack crop pests."}, {"term": "Biopesticide", "def": "A pest-control product based on living organisms or natural substances."}, {"term": "Pesticide resistance", "def": "When pest populations evolve to survive pesticides that used to kill them."}, {"term": "Varietal resistance", "def": "Genetic ability of a crop variety to resist or tolerate a pest or disease."}], "cards": [{"q": "Expected global pesticide sales in 2010?", "a": "Over US$40 billion."}, {"q": "What share of crops is still lost to pests?", "a": "About 30-40%, similar to 50 years ago."}, {"q": "What fraction of applied pesticide reaches the target pest?", "a": "Less than 1%."}, {"q": "What is the first line of defence against pests in IPM?", "a": "A healthy agro-ecosystem."}, {"q": "Why does IPM not aim to eradicate pests completely?", "a": "Natural enemies need some prey; balanced predation keeps losses acceptable."}, {"q": "In how many countries do large government IPM programmes operate?", "a": "More than 60, including Brazil, China and India."}, {"q": "Name two policy recommendations on pesticides.", "a": "Remove pesticide subsidies and introduce pesticide taxes."}, {"q": "Why is crop varietal resistance important?", "a": "It is essential for managing plant diseases and many insect pests without heavy pesticide use."}], "for_rush": "Disease resistance breeding links IPM to genomics, and her late blight thesis on early detection fits the IPM idea of surveillance before spraying.", "priority": "useful"}, {"n": 7, "title": "Policies and institutions", "pdf_pages": "77-94", "minutes": 20, "summary": ["About US$209 billion a year (2009 prices) of investment is needed in primary agriculture and downstream sectors to 2050, including at least US$7 billion a year for climate-change adaptation.", "Perverse subsidies worldwide are estimated at US$500 billion to 1.5 trillion a year; New Zealand abolished farm subsidies in the 1980s and the Philippines removed fertiliser subsidies.", "Recommended pricing tools are 'market-smart' subsidies (vouchers, grants), removing environmentally harmful subsidies and stabilising output prices, plus payments for environmental services linked to farm development.", "Institutions needed: secure land and water rights (especially for women), reversing the decline in public agricultural research, rebuilding extension with farmer field schools and mobile/internet information, and better credit and index insurance.", "Smallholders face high transaction costs; contract farming, cooperatives and multi-stakeholder platforms help them reach markets."], "terms": [{"term": "Perverse subsidy", "def": "A subsidy that encourages harmful practices, such as overuse of water, fertiliser or pesticides."}, {"term": "Payments for environmental services (PES)", "def": "Paying land users to manage land in ways that provide public environmental benefits."}, {"term": "Market-smart subsidy", "def": "Targeted support (e.g. vouchers) that helps farmers buy inputs while building private input markets."}, {"term": "Index insurance", "def": "Insurance that pays out based on an index such as rainfall rather than assessed farm losses."}, {"term": "Transaction costs", "def": "Costs of finding buyers, negotiating and transporting that make market access hard for small farmers."}, {"term": "CGIAR", "def": "The global partnership of international agricultural research centres."}], "cards": [{"q": "Annual investment needed in agriculture and downstream sectors to 2050?", "a": "About US$209 billion a year (2009 prices)."}, {"q": "Minimum annual investment needed for climate-change adaptation?", "a": "About US$7 billion a year."}, {"q": "Estimated global value of perverse subsidies?", "a": "US$500 billion to 1.5 trillion a year."}, {"q": "Give one example of a country removing harmful farm subsidies.", "a": "New Zealand (all farm subsidies, 1980s) or the Philippines (fertiliser subsidies)."}, {"q": "What is a 'market-smart' subsidy?", "a": "Targeted support such as vouchers or grants that helps farmers buy inputs while supporting input markets."}, {"q": "Name three institutional needs for SCPI.", "a": "Any three of: secure land and water rights, more public research, stronger extension, credit and insurance, farmer organisations."}, {"q": "How can smallholders overcome high transaction costs?", "a": "Through contract farming, cooperatives and multi-stakeholder platforms."}], "for_rush": "", "priority": "skim"}]}, {"slug": "sare_soils", "short": "Building Soils for Better Crops", "emoji": "🪱", "color": "#8b5e34", "warn": "", "title": "Building Soils for Better Crops: Ecological Management for Healthy Soils (4th edition)", "authors": "Fred Magdoff and Harold van Es", "edition": "4th edition, 2021 (SARE Outreach)", "file": "", "url": "https://www.sare.org/resources/building-soils-for-better-crops/", "licence": "Free download/online reading from the publisher (SARE Outreach, USDA-NIFA funded); copyright SARE", "overview": "A practical, plain-language textbook on soil health: what soil organic matter is, how soil life, structure and water interact, and how tillage, cover crops, rotations, compost, irrigation and nutrient management can build or destroy soil. Written for farmers and advisers, with many farmer case studies.", "how": "Read chapters 1-6 for the science foundations, then jump to the management chapters most relevant to you (water, nutrients, soil testing). Chapters on livestock, urban soils and erosion structures can be skimmed.", "free": true, "chapters": [{"n": 1, "title": "Healthy Soils", "pdf_pages": "online", "minutes": 20, "summary": ["Soil is made of four parts: mineral particles, water, air and organic matter.", "Soil health means how well a soil works for its intended use, which is different from its fixed inherent properties.", "Healthy soils are fertile, well structured, deep enough, well drained and aerated, low in pests, free of toxins and resilient.", "Tillage and poor management have made organic matter loss outpace replenishment; much farmland is now in only fair to very poor condition.", "Organic matter improves almost every soil property, so organic matter management is the foundation of soil health."], "terms": [{"term": "Soil health", "def": "The capacity of a soil to support high yields of good-quality crops while still providing environmental services."}, {"term": "Tilth", "def": "The physical condition of a soil that lets roots grow and seedlings emerge with little resistance."}, {"term": "Soil solution", "def": "The water in soil together with the nutrients dissolved in it, which plants take up."}, {"term": "Chemical weathering", "def": "Slow dissolution of minerals by soil water (which contains carbon dioxide), releasing plant nutrients."}, {"term": "Capillary action", "def": "The way small pores hold water against gravity, letting soil act like a sponge."}], "cards": [{"q": "What four components make up soil?", "a": "Mineral particles, water, air and organic matter."}, {"q": "How is soil health different from inherent soil quality?", "a": "Inherent properties (like texture) are fixed by nature; soil health is how well the soil currently functions, which management can change."}, {"q": "Name four attributes of a healthy soil.", "a": "Any four of: good fertility, good structure/tilth, sufficient depth, good drainage and aeration, low pest populations, freedom from toxins, resilience to degradation."}, {"q": "Roughly how much topsoil is eroded from the world's croplands each year, according to the book?", "a": "About 30-40 billion tons."}, {"q": "Which single soil component positively influences almost all healthy-soil characteristics?", "a": "Soil organic matter."}, {"q": "Name three practices the chapter lists for building healthy soils.", "a": "Any three of: minimise tillage, add diverse organic materials, keep live roots growing (rotations, cover crops), keep soil covered, manage fertility/pH, reduce salts in arid regions."}], "for_rush": "The 'reduce salts in arid regions' principle is the bridge between general soil health and UAE desert farming.", "priority": "useful"}, {"n": 2, "title": "What Is Organic Matter and Why Is It So Important?", "pdf_pages": "online", "minutes": 30, "summary": ["Organic matter is usually only 1-6% of agricultural soil but affects nearly every soil property.", "It has three parts: the living (organisms and roots, roughly 15%), the dead (fresh residues, food for soil life) and the very dead (humus that can persist for hundreds of years).", "It supplies nutrients through mineralisation, holds cations (CEC), chelates micronutrients, buffers pH and builds aggregates.", "Soils store more carbon than all plants, animals and the atmosphere combined.", "A Michigan study found roughly a 12% yield increase for every 1% increase in organic matter.", "Biochar can help but needs very large application rates, so it suits small or targeted areas."], "terms": [{"term": "Soil organic matter (SOM)", "def": "All living, recently dead and well-decomposed biological material in soil."}, {"term": "Humus ('very dead')", "def": "Well-decomposed, chemically and physically protected organic matter that resists further breakdown."}, {"term": "Mineralisation", "def": "Microbial conversion of organic forms of nutrients (e.g. organic N) into inorganic forms plants can absorb."}, {"term": "Cation exchange capacity (CEC)", "def": "The soil's ability to hold positively charged nutrients such as K+, Ca2+ and Mg2+ on clay and organic surfaces."}, {"term": "Chelation", "def": "Binding of micronutrient metals by organic molecules, keeping them soluble and available."}, {"term": "pH buffering", "def": "Resistance to rapid change in soil pH, partly provided by organic matter."}], "cards": [{"q": "What percentage of a typical agricultural soil is organic matter?", "a": "About 1-6%."}, {"q": "What are the three fractions of organic matter in the book's 'living, dead, very dead' model?", "a": "Living organisms and roots; fresh dead residues (active fraction); well-decomposed humus (very dead, stable)."}, {"q": "About what share of soil organic matter is living organisms?", "a": "Roughly 15%."}, {"q": "Which fraction is the main food source for soil organisms and releases nutrients quickly?", "a": "The 'dead' fraction - fresh residues and manures."}, {"q": "What pH range gives optimal nutrient availability for most crops?", "a": "About pH 6-7."}, {"q": "What yield response per 1% organic matter was reported in Michigan studies?", "a": "About a 12% yield increase per 1% increase in organic matter."}, {"q": "Why is biochar of limited use on large farms?", "a": "It must be applied at many tons per acre to make a significant difference."}, {"q": "Compare the carbon stored in soil to that in plants, animals and atmosphere.", "a": "Soil stores more carbon than all three combined."}], "for_rush": "Hydroponics removes the soil organic matter 'buffer', which is why you must manage pH and nutrients yourself in your spinach system.", "priority": "core"}, {"n": 3, "title": "Amount of Organic Matter in Soils", "pdf_pages": "online", "minutes": 25, "summary": ["Organic matter level is a balance between additions and losses (decomposition, erosion).", "Natural factors (climate, texture, drainage, vegetation, pH) and management (tillage, rotation, amendments) set the level.", "Typical levels: sands below 1%, loams 2-3%, clays 4-5% or more.", "Midwest prairie soils lost about half their organic matter within about 40 years of cultivation.", "Raising organic matter by 1% needs roughly 50 tons of dry organic material per acre, so change is slow.", "Soils have a saturation limit linked to silt+clay content; depleted soils gain organic matter faster."], "terms": [{"term": "Soil aggregate", "def": "A cluster of soil particles glued by roots, fungal hyphae and microbial products, which protects organic matter inside."}, {"term": "Particulate organic matter", "def": "Fresh, partly decomposed residue fragments that feed soil organisms."}, {"term": "Saturation (of organic matter)", "def": "The maximum organic matter a soil can hold, set largely by its silt and clay content."}, {"term": "Decomposition rate", "def": "The yearly fraction of organic matter broken down, typically about 1-5% depending on texture and aeration."}], "cards": [{"q": "Typical organic matter in sandy, loamy and clay soils?", "a": "Sands <1%, loams 2-3%, clays 4-5%+."}, {"q": "Why do sandy desert soils hold so little organic matter?", "a": "Coarse texture gives little protection to organic matter, aeration speeds decomposition, and hot dry climates limit plant inputs."}, {"q": "How much dry organic material is needed to raise soil organic matter by 1% (per acre)?", "a": "About 100,000 lb (50 tons)."}, {"q": "How much organic matter did Midwest prairie soils lose after cultivation began?", "a": "About 50% within roughly 40 years."}, {"q": "Maximum organic matter for a soil with 20% vs 80% silt+clay?", "a": "About 3.6% vs 6.1%."}, {"q": "Which soils gain organic matter fastest when management improves?", "a": "Severely depleted soils far from saturation."}, {"q": "Name four practices that build organic matter.", "a": "Minimise tillage, keep soil covered (cover crops), include perennials/legumes in rotation, add compost or manure."}], "for_rush": "Explains why UAE sandy soils need constant organic inputs (compost, mulch) to stay productive.", "priority": "core"}, {"n": 4, "title": "The Living Soil", "pdf_pages": "online", "minutes": 30, "summary": ["Soil life in the top six inches can weigh about 1.5 tons per acre - like two dairy cows.", "Organisms form a food web: primary consumers eat residues, then secondary and tertiary consumers eat them.", "The rhizosphere around roots can host 1,000 times more organisms than bulk soil because roots exude sugars.", "Mycorrhizal fungi trade water and nutrients for plant sugars; bacteria mineralise and fix nitrogen.", "Less tillage, diverse rotations, cover crops, near-neutral pH and organic inputs support beneficial organisms."], "terms": [{"term": "Rhizosphere", "def": "The thin zone of soil around roots that is rich in root exudates and microbes."}, {"term": "Mycorrhizae", "def": "Symbiotic fungi that colonise roots and extend hyphae into soil, improving water and nutrient (especially P) uptake."}, {"term": "Nitrogen fixation", "def": "Conversion of atmospheric N2 into plant-usable forms by certain bacteria (e.g. rhizobia in legume nodules)."}, {"term": "Food web", "def": "The network of feeding relationships among soil organisms."}, {"term": "Mucigel", "def": "A sticky gel around roots that links roots, microbes and soil particles."}, {"term": "Root exudates", "def": "Sugars and other compounds released by roots that feed rhizosphere microbes."}], "cards": [{"q": "How many bacteria are in a teaspoon of agricultural soil?", "a": "From about 100 million to 1 billion."}, {"q": "How much more abundant are organisms in the rhizosphere than in distant soil?", "a": "About 1,000 times or more."}, {"q": "What proportion of the topsoil volume do roots occupy?", "a": "About 1% or less."}, {"q": "What do mycorrhizal fungi receive from the plant and give in return?", "a": "They receive sugars; they give water and nutrients."}, {"q": "How much soil can earthworms move per acre each year?", "a": "About 1 to 100 tons."}, {"q": "Why does reduced tillage favour fungi?", "a": "Tillage breaks fungal hyphal networks, including mycorrhizae."}, {"q": "Why do cover crops between cash crops help mycorrhizae?", "a": "They keep living roots present so fungal populations and spores are maintained."}], "for_rush": "Rhizosphere and microbiome biology is a growing area for plant genomics/metagenomics roles - links to your metagenomics portfolio project.", "priority": "useful"}, {"n": 5, "title": "Soil Particles, Water and Air", "pdf_pages": "online", "minutes": 25, "summary": ["Soil texture is the mix of sand, silt and clay and cannot be changed by management.", "Ideal soils have medium texture and crumb-like aggregates, roughly 50% solids and 50% pore space.", "Pores hold water (small pores) and air (large pores); good structure balances both.", "Field capacity is the water left after about two days of free drainage; sandy soils have low field capacity.", "Structure is built by organic matter, roots and fungi and destroyed by tillage and compaction."], "terms": [{"term": "Sand", "def": "Particles 0.05-2 mm in diameter."}, {"term": "Silt", "def": "Particles 0.002-0.05 mm in diameter."}, {"term": "Clay", "def": "Particles smaller than 0.002 mm."}, {"term": "Field capacity", "def": "Soil water content after about two days of free drainage from saturation."}, {"term": "Aggregation (structure)", "def": "The grouping of particles into crumbs, creating a range of pore sizes."}, {"term": "Infiltration capacity", "def": "The maximum rate at which water can enter the soil."}], "cards": [{"q": "Give the size ranges for sand, silt and clay.", "a": "Sand 0.05-2 mm; silt 0.002-0.05 mm; clay <0.002 mm."}, {"q": "Can management change soil texture?", "a": "No - texture is fixed; management changes structure."}, {"q": "What fraction of a typical soil's volume is solids?", "a": "About 50%."}, {"q": "Define field capacity.", "a": "Water remaining after about two days of free drainage following saturation."}, {"q": "Do sandy soils have high or low field capacity, and what does that mean for irrigation?", "a": "Low - they hold little water, so they need smaller, more frequent irrigations."}, {"q": "What is a plow pan and why is it a problem?", "a": "A compacted layer below the tilled zone that stops roots reaching subsoil water and nutrients."}], "for_rush": "Your hydroponic substrate choice (e.g. perlite, coco) is a designed 'pore space' problem - balancing water retention and air exactly as this chapter describes.", "priority": "core"}, {"n": 6, "title": "Soil Degradation", "pdf_pages": "online", "minutes": 30, "summary": ["Main degradation routes are erosion, compaction and chemical problems such as salts and contamination.", "Organic matter loss starts a downward spiral of weaker aggregates and more erosion.", "Working soil wetter than the plastic limit causes serious compaction; use the 'ball test'.", "Root growth stops above about 300 psi penetration resistance; soils need at least about 20% air-filled pores.", "Saline soils have EC above 4 dS/m; sodic soils have more than 15% of CEC occupied by sodium.", "Shallow groundwater (2-3 feet) can wick salts to the surface; remedies include leaching, avoiding sodic water and lowering the water table."], "terms": [{"term": "Erodibility", "def": "How easily a soil erodes, based on texture, aggregate strength and moisture."}, {"term": "Plastic limit", "def": "The moisture content dividing mouldable (plastic) soil from crumbly (friable) soil; working above it compacts soil."}, {"term": "Saline soil", "def": "Soil with electrical conductivity above 4 dS/m, where salts make water harder for plants to take up."}, {"term": "Sodic soil", "def": "Soil with more than 15% of its CEC occupied by sodium, causing clay dispersion and structural collapse."}, {"term": "Wilting point", "def": "Soil moisture at which remaining water is unavailable to plants."}, {"term": "Penetration resistance", "def": "Force needed to push into soil; above about 300 psi most roots stop growing."}], "cards": [{"q": "What EC threshold defines a saline soil?", "a": "Above 4 dS/m (decisiemens per metre)."}, {"q": "What defines a sodic soil?", "a": "Sodium occupies more than 15% of the cation exchange capacity (ESP > 15%)."}, {"q": "Why do saline soils stress plants even when wet?", "a": "Osmotic effects - dissolved salts make it harder for roots to draw water in."}, {"q": "Why are sodic soils physically damaged?", "a": "Sodium disperses clay, so aggregates collapse and infiltration and aeration drop."}, {"q": "At what depth can shallow groundwater cause salt build-up by capillary rise?", "a": "About 2-3 feet."}, {"q": "Above what penetration resistance does root growth stop for most crops?", "a": "About 300 psi."}, {"q": "What minimum air-filled pore space is needed for adequate aeration?", "a": "About 20%."}, {"q": "How do you remediate saline soil?", "a": "Leach salts with excess good-quality water (with drainage), avoid sodium-rich water, and keep the water table deep."}], "for_rush": "The EC > 4 dS/m and ESP > 15% definitions are the standard vocabulary for UAE soil salinity work.", "priority": "core"}, {"n": 7, "title": "Carbon and Nutrient Cycles and Flows", "pdf_pages": "online", "minutes": 20, "summary": ["Nutrient cycling (returning residues and manure to soil) has broken down as food production and consumption have separated geographically.", "Farms can export more than they import (depleting soil), balance flows, or import more than they export (causing pollution).", "A nitrogen balance of 0 to +50 lb/acre (inputs minus harvested outputs) is considered good.", "Cover crops like cereal rye catch excess nitrogen; timing N close to crop demand cuts losses.", "Global grain trade moves nutrients from exporting to importing regions, depleting one and polluting the other."], "terms": [{"term": "Nutrient cycling", "def": "Return of nutrients to the soil via crop residues and manure on the same farm."}, {"term": "Nutrient flow", "def": "Movement of nutrients onto or off a farm through purchased inputs and sold products."}, {"term": "N balance", "def": "Nitrogen inputs minus nitrogen removed in harvest."}, {"term": "Hypoxia", "def": "Low-oxygen 'dead zones' in water bodies caused by nutrient pollution."}], "cards": [{"q": "What are the three farm nutrient-flow scenarios?", "a": "Exports > imports (depletion), balanced flows, imports > exports (accumulation and pollution risk)."}, {"q": "What N balance range does the book suggest as optimal?", "a": "0 to +50 lb N per acre."}, {"q": "Which type of farm often imports more nutrients than it exports?", "a": "Animal farms that buy in feed but lack land to spread manure."}, {"q": "Which cover crop is cited for catching excess nitrogen?", "a": "Cereal rye."}, {"q": "How does global grain trade affect nutrients?", "a": "Exporting regions lose nutrients and organic matter; importing regions accumulate excess nutrients and pollution."}], "for_rush": "", "priority": "skim"}, {"n": 8, "title": "Soil Health, Plant Health and Pests", "pdf_pages": "online", "minutes": 25, "summary": ["Healthy soil supports healthy plants that defend themselves better against pests.", "Three strategies: grow plants with strong defences, suppress pests, and enhance beneficial organisms.", "Plants can switch on defence genes through systemic acquired resistance (SAR) and induced systemic resistance (ISR).", "Excess inorganic nitrogen increases insect damage; calcium and potassium can reduce some diseases.", "The East African 'push-pull' system uses Desmodium to repel stem borers and border grasses to attract them."], "terms": [{"term": "Induced resistance", "def": "Activation of plant defence genes in response to pathogens or beneficial microbes."}, {"term": "Systemic acquired resistance (SAR)", "def": "Whole-plant defence triggered by pathogen attack."}, {"term": "Induced systemic resistance (ISR)", "def": "Whole-plant defence triggered by beneficial root microbes."}, {"term": "Push-pull", "def": "Repelling pests from the crop with one plant while luring them to trap plants at the edge."}, {"term": "Resilience", "def": "A system's ability to recover quickly from disturbance."}], "cards": [{"q": "What are the three overarching pest-management strategies in this chapter?", "a": "Grow healthy plants with strong defences, suppress pests, enhance beneficial organisms."}, {"q": "What is the difference between SAR and ISR?", "a": "SAR is triggered by pathogens; ISR is triggered by beneficial root-associated microbes."}, {"q": "How does excess inorganic nitrogen affect insect pests?", "a": "It tends to increase insect damage."}, {"q": "How does the push-pull system work?", "a": "Desmodium in the crop repels stem borer moths ('push') while border grasses attract them ('pull'); Desmodium also adds N and suppresses weeds."}, {"q": "Name two nutrients the chapter links to reduced disease.", "a": "Calcium and potassium."}, {"q": "Which pest is noted as thriving in organic-rich soils?", "a": "Symphylans."}], "for_rush": "SAR/ISR defence genes are a classic target in plant genomics - and relevant to your late blight thesis on pathogen detection.", "priority": "useful"}, {"n": 9, "title": "Managing for High-Quality Soils: Focusing on Organic Matter Management", "pdf_pages": "online", "minutes": 25, "summary": ["Five soil health principles: minimise disturbance, keep soil covered, maximise biodiversity, manage water, keep pH and nutrients in range.", "Only about 10-20% of decomposed crop residue becomes stable humus.", "C:N ratio controls decomposition: young plants around 15:1, sawdust over 100:1, soil organic matter about 10-12:1.", "Materials above about 40:1 can temporarily lock up (immobilise) nitrogen.", "Use a variety of organic inputs regularly but avoid overloading nutrients; monitor with soil tests."], "terms": [{"term": "C:N ratio", "def": "The ratio of carbon to nitrogen in a material, which predicts how fast it decomposes and whether it releases or ties up N."}, {"term": "N immobilisation", "def": "Microbes using soil nitrogen to decompose high-carbon material, temporarily making it unavailable to crops."}, {"term": "Organic matter saturation", "def": "The maximum organic matter a soil can hold, set by its silt and clay content."}, {"term": "Root residue", "def": "Organic matter added by dead roots; prairie grasses add far more than annual crops."}], "cards": [{"q": "List the five soil health management principles.", "a": "Minimise disturbance, keep soil covered, maximise biodiversity, manage water, maintain pH/nutrients in range."}, {"q": "What share of decomposed residue becomes stable humus?", "a": "About 10-20%."}, {"q": "Typical C:N of soil organic matter?", "a": "About 10:1 to 12:1."}, {"q": "Above what C:N ratio can a material immobilise nitrogen?", "a": "Above about 40:1."}, {"q": "C:N of young plants vs sawdust?", "a": "About 15:1 vs over 100:1."}, {"q": "Root residue per acre per year: native prairie vs corn?", "a": "15,000-30,000 lb vs 3,000-4,000 lb."}], "for_rush": "", "priority": "useful"}, {"n": 10, "title": "Cover Crops", "pdf_pages": "online", "minutes": 30, "summary": ["Cover crops are unharvested plants grown to protect and improve soil; used for over 3,000 years.", "They reduce erosion, build structure and biology, supply or catch nutrients, suppress weeds and keep mycorrhizae alive.", "Legumes fix nitrogen with Rhizobium and can supply 70-150+ lb N/acre if grown to flowering.", "Grasses such as cereal rye add lots of residue (3-5 tons at maturity) and scavenge nitrogen.", "Choose species by goal; in dry regions end winter covers before they use too much soil water."], "terms": [{"term": "Cover crop", "def": "A crop grown mainly to protect and improve soil rather than for harvest."}, {"term": "Green manure", "def": "A cover crop killed before maturity and worked into the soil."}, {"term": "Inoculation", "def": "Coating legume seed with the correct strain of nitrogen-fixing bacteria before sowing."}, {"term": "Allelopathy", "def": "Chemical suppression of other plants (e.g. weed germination) by residues, notably from rye."}, {"term": "Planting green", "def": "Sowing the cash crop directly into a standing cover crop and terminating it soon after."}], "cards": [{"q": "How much nitrogen can a legume cover crop supply if grown to flowering?", "a": "About 70-150+ lb N per acre."}, {"q": "How much residue can cereal rye produce at maturity?", "a": "About 3-5 tons per acre."}, {"q": "Why must legume seed be inoculated?", "a": "Each legume needs its specific Rhizobium strain to nodulate and fix N."}, {"q": "Which cover crop type is best for scavenging nutrients and adding organic matter?", "a": "Grasses (e.g. cereal rye)."}, {"q": "What caution applies to cover crops in dry regions?", "a": "Terminate them before they deplete too much soil water."}, {"q": "How much did infiltration improve on Gabe Brown's farm after 20+ years of cover cropping?", "a": "From about 0.5 inch/hour to over 30 inches/hour."}, {"q": "What is 'planting green'?", "a": "Seeding the cash crop into a living cover crop and terminating the cover shortly after."}], "for_rush": "", "priority": "useful"}, {"n": 11, "title": "Diversifying Cropping Systems", "pdf_pages": "online", "minutes": 25, "summary": ["Diversity brings stability: rotated crops yield about 10% more normally and up to 25% more in droughts than monocultures.", "Rotations break pest and disease cycles; some diseases need 1-2 years out, clubroot up to 7.", "Adding crops raises the time living roots are in the soil (corn-soybean 32%; adding wheat 57%).", "Perennial forages (alfalfa, clover) for 3-4 years build organic matter fastest.", "Agroforestry integrates trees with crops or livestock."], "terms": [{"term": "Crop rotation", "def": "Growing different crops in sequence on the same field."}, {"term": "Rotation effect", "def": "The yield boost from growing a crop in rotation rather than continuously."}, {"term": "Active rooting period", "def": "Percentage of time living roots occupy the soil during a rotation."}, {"term": "Agroforestry", "def": "Combining trees with crops or livestock on the same land."}], "cards": [{"q": "How much higher do rotated crops yield than monocultures, normally and in drought?", "a": "About 10% normally and up to 25% in drought."}, {"q": "Active rooting time for corn-soybean vs adding winter wheat?", "a": "32% vs 57%."}, {"q": "How long may clubroot need between susceptible crops?", "a": "Up to seven years."}, {"q": "Organic matter gain: corn/alfalfa rotation vs continuous corn?", "a": "About 500 lb/acre/year vs about 100 lb/acre/year."}, {"q": "Why follow a legume forage with corn?", "a": "Corn is N-hungry and benefits from the legume's nitrogen."}, {"q": "Minimum number of crop species the chapter suggests for a rotation?", "a": "At least three."}], "for_rush": "Date palm agroforestry with understorey crops is the UAE version of diversified systems.", "priority": "skim"}, {"n": 12, "title": "Integrating Crops and Livestock", "pdf_pages": "online", "minutes": 20, "summary": ["Mixed crop-livestock farms recycle nutrients through manure and diversify income.", "Manure value is high; dairy solid manure has about 10 lb N per ton, poultry manure much more.", "Unincorporated manure loses about 25% of its N after one day and 45% after four days as ammonia.", "Spring application is generally more efficient than autumn in wet climates.", "Leave about three months between manure incorporation and harvest of vegetables (food safety)."], "terms": [{"term": "Solid manure", "def": "Manure with 20% or more dry matter, usually from bedded systems."}, {"term": "Liquid manure", "def": "Manure with about 2-12% dry matter."}, {"term": "Ammonia volatilisation", "def": "Loss of nitrogen as ammonia gas from manure left on the surface."}, {"term": "Management-intensive grazing", "def": "Frequent rotation of livestock between paddocks so plants recover before regrazing."}], "cards": [{"q": "How much N does unincorporated manure lose after one day and after four days?", "a": "About 25% and 45%."}, {"q": "Roughly how much N is in a ton of solid dairy manure?", "a": "About 10 lb."}, {"q": "Dry matter of solid vs liquid manure?", "a": "Solid 20%+; liquid about 2-12%."}, {"q": "Recommended gap between manure incorporation and vegetable harvest?", "a": "About three months."}, {"q": "Why is rotational grazing better than continuous grazing?", "a": "Plants get time to recover before being grazed again."}], "for_rush": "", "priority": "skim"}, {"n": 13, "title": "Making and Using Composts", "pdf_pages": "online", "minutes": 30, "summary": ["Composting is controlled decomposition that produces a stable amendment and can kill pathogens and weed seeds.", "Aim for a C:N ratio of 25-40:1 and moisture of 40-60% (like a wrung-out sponge).", "Thermophilic phase: 110-160°F (most efficient 104-140°F); above 160°F harms microbes and risks fire.", "EPA pathogen standard: 131-170°F for 3 days in vessels, or 15 days with five turnings in windrows.", "Cure for 1-3 months; apply about 10-12 tons/acre every three years, guided by soil tests.", "Alternatives include vermicomposting (worms) and bokashi (anaerobic fermentation)."], "terms": [{"term": "Thermophilic", "def": "The hot phase of composting dominated by heat-loving microbes."}, {"term": "Bulking agent", "def": "Coarse material (wood chips, straw, leaves) that keeps a pile porous."}, {"term": "Curing", "def": "The slow final stage where compost stabilises and beneficial organisms recolonise."}, {"term": "Vermicomposting", "def": "Composting with earthworms to produce castings."}, {"term": "Bokashi", "def": "Anaerobic fermentation of organic waste with lactic acid bacteria."}], "cards": [{"q": "Ideal C:N ratio for a compost mix?", "a": "About 25-40:1."}, {"q": "Ideal compost moisture?", "a": "40-60%, like a wrung-out sponge."}, {"q": "What happens below 35% moisture?", "a": "Ammonia is lost and microbial activity slows; moulds may dominate."}, {"q": "What is the EPA windrow standard for pathogen kill?", "a": "131-170°F for 15 days with five turnings."}, {"q": "Why avoid temperatures above 160°F?", "a": "Beneficial organisms die and spontaneous combustion becomes possible."}, {"q": "Recommended pile size?", "a": "About 3-5 ft high and 6-10 ft wide at the base."}, {"q": "How long should compost cure?", "a": "About 1-3 months."}, {"q": "Suggested application rate?", "a": "About 10-12 tons per acre every three years, adjusted by soil testing."}], "for_rush": "Composting kitchen and spinach waste is an easy way to close the loop at home and is widely promoted for UAE sandy soils.", "priority": "useful"}, {"n": 14, "title": "Reducing Runoff and Erosion", "pdf_pages": "online", "minutes": 20, "summary": ["Accelerated erosion from bare, tilled soil far exceeds natural geological erosion (e.g. the 1930s Dust Bowl).", "Tolerable soil loss (T) for deep soils is about 5 tons/acre/year (11 t/ha), about 0.03 inch of soil.", "100% cover nearly eliminates erosion; even 30% cover reduces it by about 70%.", "No-till leaves 90%+ residue cover vs about 5% after moldboard ploughing.", "Agronomic methods (cover, residue, no-till) are preferred over structures; shelterbelts reduce wind erosion."], "terms": [{"term": "T value", "def": "Maximum tolerable annual soil loss, about 5 tons/acre for deep soils."}, {"term": "Accelerated erosion", "def": "Human-caused erosion much faster than natural rates."}, {"term": "Conservation agriculture", "def": "Systems combining cover crops, mulch and no-till."}, {"term": "Shelterbelt", "def": "Rows of trees or shrubs that reduce wind speed and wind erosion."}], "cards": [{"q": "What is the soil loss tolerance (T) for deep soils?", "a": "About 5 tons/acre/year (11 t/ha)."}, {"q": "How much does 30% soil cover reduce erosion?", "a": "By about 70%."}, {"q": "Residue cover after no-till vs moldboard plough?", "a": "90%+ vs about 5%."}, {"q": "Runoff in an Ohio study: no-till vs conventional tillage?", "a": "Under 0.1 inch vs about 7 inches per year."}, {"q": "What portion of 30-year erosion damage often comes from one extreme storm?", "a": "About one-third."}, {"q": "Which structure reduces wind erosion in dry areas?", "a": "Shelterbelts (windbreaks)."}], "for_rush": "Wind erosion and shelterbelts matter for UAE desert farms more than water erosion.", "priority": "skim"}, {"n": 15, "title": "Addressing Compaction", "pdf_pages": "online", "minutes": 20, "summary": ["Compaction caused a median 21% yield loss for corn and soybeans in cited research.", "Three types: surface crusting, surface-layer compaction and subsoil compaction.", "Most compaction comes from working soil when too wet.", "Use tracks, low-pressure tyres and controlled traffic lanes; keep at least 30% residue cover.", "Deep-rooted covers and occasional subsoiling help, but benefits take 2-5 years and need better management."], "terms": [{"term": "Surface crusting", "def": "A dense surface seal formed when raindrops break aggregates."}, {"term": "Subsoil compaction", "def": "Dense layers below the tilled zone, often detected with a penetrometer."}, {"term": "Controlled traffic", "def": "Confining wheels to permanent lanes so the rest of the field is not compacted."}, {"term": "Penetrometer", "def": "A tool measuring soil resistance to penetration."}], "cards": [{"q": "Median yield loss from compaction cited for corn and soybean?", "a": "About 21%."}, {"q": "What is the main cause of compaction?", "a": "Field operations when soil is too wet."}, {"q": "Name the three types of compaction.", "a": "Surface crusting/sealing, surface-layer compaction, subsoil compaction."}, {"q": "Name two equipment strategies to reduce compaction.", "a": "Tracks or low-pressure flotation tyres; controlled traffic lanes (also dual wheels)."}, {"q": "How long do compaction-fixing benefits typically take?", "a": "About 2-5 years."}], "for_rush": "", "priority": "skim"}, {"n": 16, "title": "Minimising Tillage", "pdf_pages": "online", "minutes": 20, "summary": ["Conservation tillage leaves more than 30% of the surface covered, cutting erosion by over half.", "Moldboard ploughing leaves 0-10% residue and is the most damaging.", "No-till, strip-till and ridge-till disturb less soil; lo
