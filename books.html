<style>
:root{--bg:#fbf6ef;--bg2:#f1e8dc;--card:#fffdf9;--fg:#3a3140;--muted:#6d6471;--line:#eadfd2;--leaf:#5cb85c;--sun:#ffc857;--pink:#ff8fab;--lilac:#a99bf0;--coral:#ff7b6b;--sky:#6fc3df;--shadow:0 6px 0 rgba(110,80,60,.07),0 12px 26px rgba(110,80,60,.08);--scrim:rgba(40,30,40,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1824;--bg2:#252133;--card:#2a2638;--fg:#f3ecf5;--muted:#a89fb4;--line:#3a3449;--leaf:#7bd389;--sun:#ffd27a;--pink:#ff9fb8;--lilac:#c0b2ff;--coral:#ff8f80;--sky:#8fd3ea;--shadow:0 6px 0 rgba(0,0,0,.25),0 12px 26px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1824;--bg2:#252133;--card:#2a2638;--fg:#f3ecf5;--muted:#a89fb4;--line:#3a3449;--leaf:#7bd389;--sun:#ffd27a;--pink:#ff9fb8;--lilac:#c0b2ff;--coral:#ff8f80;--sky:#8fd3ea;--shadow:0 6px 0 rgba(0,0,0,.25),0 12px 26px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 Nunito,ui-rounded,system-ui,sans-serif;margin:0}
.wrap{max-width:740px;margin:0 auto;padding-inline:16px;padding-block:16px 60px}
h1,h2,h3,.fr{font-family:Fredoka,Nunito,sans-serif;text-wrap:balance}
h1{font-size:1.6rem;margin:0}h2{font-size:1.15rem;margin:18px 4px 10px}
.muted{color:var(--muted)}.tnum{font-variant-numeric:tabular-nums}
.top{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}.top .g{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.badge.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:pulse 2s infinite}
.ibtn{border:0;background:var(--bg2);color:var(--fg);border-radius:12px;min-width:38px;height:38px;font-size:1.05rem;cursor:pointer}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:14px;padding:9px 14px;font:800 .85rem Nunito;cursor:pointer;background:var(--leaf);color:#fff;transition:transform .15s;display:inline-flex;gap:6px;align-items:center}
.btn:active{transform:scale(.95)}.btn.ghost{background:var(--bg2);color:var(--fg)}.btn.sm{padding:6px 10px;font-size:.78rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font-family:Fredoka;font-size:2rem;font-weight:700;line-height:1}
.hero{border-color:var(--sun)}
.hero .row{display:flex;gap:12px;align-items:center}
.hero .e{font-size:2.3rem;animation:bob 2.6s ease-in-out infinite}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.book{position:relative;border:0;text-align:left;font:inherit;color:#fff;border-radius:6px 16px 16px 6px;padding:14px 12px 12px 18px;min-height:150px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s cubic-bezier(.2,1.6,.4,1);opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards;overflow:hidden}
.book::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:3px;background:rgba(255,255,255,.35)}
.book:hover{transform:translateY(-4px) rotate(-1deg)}.book:active{transform:scale(.97)}
.book b{font-family:Fredoka;font-size:.95rem;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.book .m{font-size:.72rem;opacity:.95}
.book .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden;margin-top:8px}
.book .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.tag{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--fg)}
.t-core{background:var(--leaf);color:#fff}.t-useful{background:var(--sun);color:#3a3140}.t-skim{background:var(--line);color:var(--muted)}
.ch{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:2px solid var(--line);margin-bottom:8px;cursor:pointer;animation:rise .35s both}
.ch .n{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 .95rem Fredoka;background:var(--bg2);flex:none}
.ch.done .n{background:var(--leaf);color:#fff}
.ch .tx{flex:1;min-width:0}.ch b{display:block;line-height:1.3}.ch .s{font-size:.76rem;color:var(--muted)}
.listhead{display:flex;gap:10px;align-items:center;margin:4px 0 10px}.listhead .g{flex:1;min-width:0}
.seg{display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 10px;font:800 .75rem Nunito;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .25s}.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,1.1,.3,1);max-width:740px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}.grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.lbl{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:14px;display:block}
.terms{display:grid;gap:6px;margin-top:6px}.terms div{background:var(--bg2);border-radius:12px;padding:8px 10px;font-size:.88rem}
.note{background:var(--bg2);border-radius:14px;padding:10px 12px;font-size:.88rem;margin-top:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
/* flashcard */
.fc-wrap{perspective:1200px;margin:10px 0}
.fc{position:relative;min-height:240px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,1,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center;border:2px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
.fc .back{transform:rotateY(180deg);background:color-mix(in srgb,var(--leaf) 10%,var(--card))}
.fc .q{font-family:Fredoka;font-size:1.15rem;line-height:1.35}
.fc .src{font-size:.72rem;color:var(--muted);margin-bottom:8px;font-weight:800}
.fc .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:0;border-radius:14px;padding:12px 6px;font:800 .9rem Nunito;cursor:pointer;color:#fff}
.r1{background:var(--coral)}.r2{background:var(--sun);color:#3a3140!important}.r3{background:var(--leaf)}
.prog{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--leaf);transition:width .4s}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:800;opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;pointer-events:none;z-index:50;font-size:18px}
.foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:20px}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:12px;font-weight:800;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
a.homebtn{display:inline-grid;place-items:center;text-decoration:none;flex:none}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.book{opacity:1}}
</style>

<script type="application/json" id="data">{"books": [{"slug": "cornell_spinach", "short": "Hydroponic Spinach (Cornell)", "emoji": "🥬", "color": "#2f855a", "warn": "", "title": "Hydroponic Spinach Production Handbook", "authors": "Melissa Brechner and David de Villiers (Cornell University CEA Program)", "edition": "2013", "file": "", "url": "https://cea.cals.cornell.edu/crops/greens/ (PDF: https://cea.cals.cornell.edu/files/2019/06/Cornell-CEA-baby-spinach-handbook.pdf)", "licence": "Free from Cornell CEA (publisher-hosted PDF)", "overview": "A practical grower's manual for producing baby spinach in floating (deep-water raft) ponds in a greenhouse, based on Cornell's controlled environment agriculture research. It covers the hardware, the environmental set-points (temperature, humidity, CO2, light, dissolved oxygen, pH, EC), a 14-day crop schedule, post-harvest storage and, above all, how to keep the root disease Pythium out of the system.", "how": "Read Chapter 3 (set-points) and Chapter 4 (production) closely and turn the set-point table into a checklist for your own system; skim the hardware and equipment chapters unless you are designing a commercial pond.", "free": true, "chapters": [{"n": 1, "title": "Greenhouse Hardware: germination area, pond area, lighting and the aspirated box", "pdf_pages": "6-12", "minutes": 20, "summary": ["The germination area exists to give uniform germination in a predictable time: keep it at 22-26 °C with humidity as close to 100% as possible, out of direct sun.", "Flats are stacked and covered with plastic for the first 24 hours; all flats should start at the same temperature so germination is even (no warm and cool layers in the stack).", "Spinach does not need light to germinate, but it stretches without it, so give at least 50 µmol/m²/s PAR during the first 24 hours and at least 200 µmol/m²/s for the rest of the crop.", "Do not float trays on the pond before germination is complete - the extra moisture stops further germination.", "The pond is about 10-11 inches deep, lined with heavy polyethylene (about 0.5 mm) over sand, and filled with RO water plus equal parts of Stock A and Stock B to an EC of about 1300 µS/cm above the source water.", "Aim for a daily light integral of at least 17 mol/m²/d from sun plus supplemental HPS or metal halide lamps; an aspirated box shields temperature and humidity sensors so they read the air, not the sun."], "terms": [{"term": "PAR", "def": "Photosynthetically active radiation: light between 400 and 700 nm that plants use for photosynthesis, measured in µmol/m²/s."}, {"term": "DLI (daily light integral)", "def": "The total amount of PAR a plant receives in one day, in mol/m²/d."}, {"term": "Pond / deep-water culture", "def": "A shallow tank of aerated nutrient solution on which plants grow in floating polystyrene trays."}, {"term": "RO water", "def": "Reverse-osmosis water: very pure water with almost no dissolved salts, which makes pH and nutrient control easier."}, {"term": "HPS lamp", "def": "High-pressure sodium lamp: a common greenhouse supplemental light lasting about 25,000 hours and losing about 1% output per 1,000 hours."}, {"term": "Aspirated box", "def": "A shaded housing with a small fan that draws air over sensors so they measure true air conditions near the canopy."}], "cards": [{"q": "What temperature range does the Cornell handbook give for spinach germination?", "a": "22-26 °C (72-79 °F), with humidity as close to 100% as possible."}, {"q": "Why must you not float spinach trays before germination is complete?", "a": "The extra moisture inhibits further germination, giving an uneven crop."}, {"q": "Spinach is not a light-dependent germinator. Why give it light in the first 24 hours anyway?", "a": "Without light the seedlings stretch (become leggy); at least 50 µmol/m²/s PAR prevents this."}, {"q": "What minimum light intensity does the pond crop need after the first day?", "a": "At least 200 µmol/m²/s PAR."}, {"q": "What is the minimum daily light integral target for the spinach crop?", "a": "At least 17 mol/m²/d (sun plus supplemental light)."}, {"q": "What EC is the spinach pond solution kept at?", "a": "About 1300 (±100) µS/cm above the EC of the source water."}, {"q": "How deep is the spinach pond and why?", "a": "About 10-11 inches, deep enough that roots do not drag and tear on the bottom."}, {"q": "Why is RO water preferred for filling the pond?", "a": "Untreated water carries salts and alkalinity that make pH and nutrient management harder."}, {"q": "Can a longer photoperiod with lower intensity replace a shorter, brighter one?", "a": "Yes - what matters is the daily total (DLI); photoperiods up to 24 h are acceptable, and shorter days work if intensity is raised to give the same DLI."}, {"q": "What does an aspirated box do?", "a": "It shades sensors and pulls air past them with a fan so they read the real air temperature and humidity at canopy level."}], "for_rush": "Even at home, a cheap PAR app or meter and a DLI target of about 17 mol/m²/d tells you whether your grow light or window is enough for spinach.", "priority": "useful"}, {"n": 2, "title": "System Components: dissolved oxygen sensor and flow meters", "pdf_pages": "13", "minutes": 5, "summary": ["A hand-held dissolved oxygen (DO) meter is essential for troubleshooting; Cornell used an Orion 820 (about US$600 in 2013), with YSI, Oakton and Extech as alternatives.", "DO meters should be calibrated regularly (the handbook suggests daily) because the data are only as good as the calibration.", "In-line DO sensors become worthwhile for larger facilities (around 1 acre or more).", "Variable-area flow meters are used to control how much pure oxygen is bubbled into the pond."], "terms": [{"term": "Dissolved oxygen (DO)", "def": "The amount of oxygen gas dissolved in the nutrient solution, measured in mg/L (ppm); roots need it to respire."}, {"term": "Calibration", "def": "Checking and adjusting a sensor against a known standard so its readings are accurate."}, {"term": "Flow meter", "def": "A device that shows and controls the rate of gas or liquid flowing through a line."}, {"term": "In-line sensor", "def": "A sensor fitted permanently in the system that reads continuously, rather than a hand-held probe."}], "cards": [{"q": "Why does the handbook call a hand-held DO meter essential?", "a": "Low oxygen quickly harms roots, and a portable meter lets you check and troubleshoot any pond on the spot."}, {"q": "How often does the handbook recommend calibrating a DO sensor?", "a": "Daily."}, {"q": "When are in-line DO sensors worth the cost?", "a": "For larger facilities of roughly 1 acre or more."}, {"q": "What is a flow meter used for in the spinach pond?", "a": "Controlling the rate at which pure oxygen is delivered into the solution."}, {"q": "Name two alternative DO meter brands mentioned besides Orion.", "a": "Any two of YSI, Oakton and Extech."}, {"q": "What is the unit for dissolved oxygen?", "a": "mg/L, which in water is the same as ppm."}], "for_rush": "", "priority": "skim"}, {"n": 3, "title": "Computer Technology and Monitoring: why each parameter matters, and the set-points", "pdf_pages": "14-17", "minutes": 25, "summary": ["A climate computer (e.g. Argus, Hortimax, Priva) should monitor air and water temperature, humidity, CO2, light, DO, pH and EC.", "Air set-points are 24 °C day and 19 °C night; nutrient water should be no higher than 25 °C (cool at 26 °C, heat at 24 °C). Humidity should be kept between 50% and 70%.", "CO2 is about 390 ppm outdoors but can fall to about 100 ppm in a closed greenhouse; enriching to 1000-1500 ppm with liquid CO2 speeds growth when there is light. DLI target is 17-22 mol/m²/d, measured with a quantum (PAR) sensor, not lux or foot-candle meters.", "Dissolved oxygen: spinach grows satisfactorily above 4 ppm, shows stress at 3 ppm and fails below 3 ppm; the set-point is 7 mg/L (7-10 ppm range, no benefit at 20 ppm), supplied with pure oxygen.", "pH controls whether nutrients are available: optimum 5.8, acceptable 5.6-6.0, otherwise deficiencies appear even when nutrients are present.", "EC falls as plants take up nutrients and rises as water evaporates/transpires; lower it with RO water, raise it with stock solution, always subtracting the source-water EC. Set-point: 1300 (±100) µS/cm above source water."], "terms": [{"term": "Set-point", "def": "The target value a control system tries to hold, such as 24 °C air temperature or pH 5.8."}, {"term": "Electrical conductivity (EC)", "def": "A measure of how much dissolved salt (fertiliser) is in the solution; units µS/cm or dS/m."}, {"term": "pH", "def": "A 0-14 scale of acidity; below 7 is acidic, above 7 alkaline. It controls which nutrients roots can take up."}, {"term": "Transpiration", "def": "Loss of water vapour from leaves, which pulls water and nutrients up from the roots and cools the leaf."}, {"term": "Quantum sensor", "def": "A light sensor that measures PAR in µmol/m²/s; the correct tool for plant lighting, unlike lux meters."}, {"term": "CO2 enrichment", "def": "Raising greenhouse carbon dioxide above outdoor levels (to 1000-1500 ppm) to increase photosynthesis."}, {"term": "Background EC", "def": "The EC of the source water before fertiliser is added; it must be subtracted to know the true nutrient level."}], "cards": [{"q": "What are the Cornell day and night air temperature set-points for spinach?", "a": "24 °C (75 °F) day and 19 °C (65 °F) night."}, {"q": "What is the maximum nutrient water temperature set-point, and when does cooling switch on?", "a": "No higher than 25 °C; cool at 26 °C and heat at 24 °C."}, {"q": "What relative humidity range is recommended?", "a": "Minimum 50%, maximum 70%."}, {"q": "What is the optimum pH for hydroponic spinach, and the acceptable range?", "a": "Optimum 5.8; acceptable 5.6-6.0."}, {"q": "Why can a plant show deficiency even when a lab test shows enough nutrients in the solution?", "a": "If pH is wrong, the nutrients become chemically unavailable to the roots."}, {"q": "At what DO level does spinach show stress, and what is the set-point?", "a": "Stress at about 3 ppm (failure below 3 ppm); set-point 7 mg/L, with 4 ppm the minimum for satisfactory growth."}, {"q": "Does pushing DO to 20 ppm help?", "a": "No - the handbook found no advantage above the 7-10 ppm range."}, {"q": "Your EC has risen overnight. What probably happened and how do you fix it?", "a": "Water was lost by evaporation/transpiration, concentrating the salts; add RO (pure) water to bring it down."}, {"q": "Your EC has dropped. What do you do?", "a": "Plants have taken up nutrients; add concentrated stock solution (equal parts A and B)."}, {"q": "Why should you not use a lux meter to judge light for plants?", "a": "Lux and foot-candles are based on human vision, not the 400-700 nm PAR plants use; use a quantum sensor in µmol/m²/s."}, {"q": "What CO2 level does the handbook recommend when light is available, and what if it isn't?", "a": "1000-1500 ppm with light; leave at ambient (about 390 ppm) without light."}, {"q": "Why does very high humidity matter?", "a": "It reduces transpiration, so less nutrient transport and leaf cooling, and it can favour disease."}], "for_rush": "This set-point table (pH 5.6-6.0, EC ~1300 µS/cm above tap/RO, DO above 4 ppm, water at or below 25 °C) is the core checklist for your home spinach - and warm Dubai water temperatures are the one most likely to go wrong.", "priority": "core"}, {"n": 4, "title": "Spinach Production: the 14-day crop schedule", "pdf_pages": "18-21", "minutes": 20, "summary": ["Each crop is harvested 14 days after planting: about 2 days in the germination area, then the rest floating in the pond.", "Use fresh peat/perlite mix (e.g. Cornell mix) every crop, pre-moistened to the right level (about 3:1 water to media for peat-based mixes); it cannot be reused or autoclaved.", "Baby spinach is sown in expanded polystyrene plug trays; densities of 1000-3000 plants/m² were tested, with 1500 plants/m² the best. Seed at least ½ inch deep so the media rubs off the seed coat as the shoot emerges.", "Avoid spot-watering - uneven moisture and air in the media gives uneven germination. Float the trays once cotyledons appear (around day 2).", "Cornell recommends a two-pond system so the crop grows faster than Pythium can build up; check pH and EC daily and DO at least weekly.", "Harvest by cutting above the media with scissors or a knife, and never attempt a second harvest from the same plants - pathogens build to lethal levels in the solution."], "terms": [{"term": "Plug tray", "def": "A tray of many small cells, each holding growing media and one or more seeds."}, {"term": "Cotyledons", "def": "The first 'seed leaves' that appear after germination, before the true leaves."}, {"term": "Pericarp / seed coat", "def": "The outer covering of the spinach seed; sowing deep enough lets the media rub it off as the seedling emerges."}, {"term": "Hypocotyl", "def": "The seedling stem below the cotyledons that pushes up through the media."}, {"term": "Two-pond system", "def": "Using separate ponds so young and older plants do not share solution for long, limiting pathogen build-up."}, {"term": "Baby spinach", "def": "Spinach harvested young (here at 14 days) as small tender leaves, grown at high density."}], "cards": [{"q": "How many days from planting to harvest in the Cornell spinach system?", "a": "14 days."}, {"q": "What plant density gave the best results in the tested range of 1000-3000 plants/m²?", "a": "1500 plants/m²."}, {"q": "How deep should spinach seed be sown and why?", "a": "At least ½ inch, so friction with the media strips the seed coat off as the seedling emerges."}, {"q": "Why can't the germination media be reused?", "a": "Reuse risks carrying disease; autoclaving to sterilise it damages its physical properties."}, {"q": "When are the trays floated on the pond?", "a": "Once the cotyledons appear, around day 2."}, {"q": "How often should pH and EC be checked during the pond stage? And DO?", "a": "pH and EC daily; DO at least once a week."}, {"q": "Why is a second harvest from the same plants forbidden?", "a": "Keeping plants longer lets pathogens in the solution build to a lethal level, destroying this crop and future crops in the same solution."}, {"q": "What is the logic of the two-pond system?", "a": "Plant growth must outpace pathogen reproduction; separate ponds stop Pythium spreading from older to younger plants."}, {"q": "Why avoid spot-watering germination trays?", "a": "It makes moisture and air content uneven, which gives uneven, inconsistent germination."}], "for_rush": "For your home spinach, the key transferable rules are short cycles, fresh media each time, no regrowing from the same roots, and daily pH/EC checks.", "priority": "core"}, {"n": 5, "title": "Packaging, Post-Harvest Storage and Crop Health (Pythium and pests)", "pdf_pages": "22-23", "minutes": 15, "summary": ["Spinach is packed in clamshells or cheaper resealable bags and stored at 4 °C (40 °F); packaging choice affects shelf life.", "The main threat is Pythium aphanidermatum, a water-borne oomycete that attacks roots; it is everywhere and can arrive on seed or dust, and without prevention it will eventually destroy the crop.", "Prevention combines keeping pond water at 15-20 °C, short crop durations, never reusing plants, fast growth (good light and nutrients) and the two-pond rotation.", "If disease appears: drain ponds and tanks, sacrifice the crop, and clean ponds, tanks, benches and the germination area with 2% bleach; wash floats and trays in 2% bleach between every use.", "Keep soil and other plants out of the greenhouse, limit visitors, and shade tanks and pipes to stop algae, which can weaken plants.", "Pests have not been a major problem because the crop grows so fast; screen vents and clear vegetation outside the greenhouse."], "terms": [{"term": "Pythium aphanidermatum", "def": "A water-borne oomycete (water mould) that rots roots in hydroponic systems, especially in warm water."}, {"term": "Oomycete", "def": "A fungus-like organism that spreads by swimming spores in water; not a true fungus."}, {"term": "Sodium hypochlorite (bleach)", "def": "A disinfectant; a 2% solution is used to clean ponds, tanks, floats and trays."}, {"term": "Post-harvest cold chain", "def": "Keeping produce cold (about 4 °C for spinach) from harvest to sale to extend shelf life."}, {"term": "Algae", "def": "Simple photosynthetic organisms that grow in lit nutrient solution; they don't attack the crop directly but can weaken it."}], "cards": [{"q": "What is the main disease threat in hydroponic spinach according to Cornell?", "a": "Pythium aphanidermatum, a water-borne oomycete root pathogen."}, {"q": "What water temperature does the handbook give for limiting Pythium?", "a": "15-20 °C (50-68 °F)."}, {"q": "What concentration of bleach is used to clean ponds, tanks and floats?", "a": "2% bleach (sodium hypochlorite) solution."}, {"q": "List the four parts of the Pythium prevention strategy.", "a": "Cool pond water (15-20 °C), short crop duration, no reuse of plants, and fast growth (good light/nutrients/environment), with a two-pond rotation."}, {"q": "What should you do if root disease breaks out?", "a": "Drain ponds and tanks, sacrifice the crop, clean everything (including the germination area) with 2% bleach."}, {"q": "Why shade solution tanks and pipes?", "a": "To stop algae growth, which can weaken plants and make them more vulnerable to pathogens."}, {"q": "At what temperature should packed spinach be stored?", "a": "4 °C (40 °F)."}, {"q": "Why are pests rarely a problem in hydroponic spinach?", "a": "The crop grows so fast that pest populations cannot establish."}], "for_rush": "Keeping nutrient water cool is hard in Dubai summers, so Pythium is a real risk for your home system - shading the reservoir and short cycles are your cheapest defences.", "priority": "core"}, {"n": 6, "title": "Appendix: Nutrient stock solutions and final concentrations", "pdf_pages": "25", "minutes": 10, "summary": ["Nutrients are made as two concentrated stocks (A and B) so calcium does not precipitate with phosphate and sulphate.", "Stock A holds calcium nitrate, potassium nitrate, ammonium nitrate and iron-DTPA; Stock B holds potassium nitrate, monopotassium phosphate, potassium sulphate, magnesium sulphate and the micronutrients (Mn, Zn, B, Cu, Mo).", "Final macronutrient levels: N 125 ppm, P 31 ppm, K 215 ppm, Ca 84 ppm, Mg 24 ppm, S 35 ppm.", "Final micronutrient levels: Fe 0.94 ppm, Mn 0.14 ppm, B 0.16 ppm, Zn 0.13 ppm, Cu 0.03 ppm, Mo 0.03 ppm."], "terms": [{"term": "Stock solution", "def": "A concentrated fertiliser solution that is diluted into the pond water."}, {"term": "A/B split", "def": "Keeping calcium (A) separate from phosphate and sulphate (B) in concentrated form to avoid insoluble precipitates."}, {"term": "Chelated iron (Fe-DTPA)", "def": "Iron bound to an organic molecule so it stays soluble and available at hydroponic pH."}, {"term": "Macronutrients", "def": "Nutrients needed in large amounts: N, P, K, Ca, Mg, S."}, {"term": "Micronutrients", "def": "Nutrients needed in tiny amounts: Fe, Mn, B, Zn, Cu, Mo."}], "cards": [{"q": "Why are nutrients split into Stock A and Stock B?", "a": "Concentrated calcium would react with phosphate and sulphate to form insoluble precipitates; keeping them apart avoids this."}, {"q": "Which tank holds calcium nitrate?", "a": "Stock A."}, {"q": "What is the final nitrogen concentration in the Cornell spinach solution?", "a": "125 ppm N (8.9 mmol/L)."}, {"q": "What is the final potassium concentration?", "a": "215 ppm K."}, {"q": "What is the final calcium concentration?", "a": "84 ppm Ca."}, {"q": "What form of iron is used and at what final level?", "a": "Iron-DTPA chelate, giving about 0.94 ppm Fe."}, {"q": "Name the six micronutrients in Stock B and Stock A combined.", "a": "Fe (in A), and Mn, Zn, B, Cu, Mo (in B)."}], "for_rush": "Comparing these ppm targets with the label of your home two-part nutrient is a good way to check whether it suits leafy greens.", "priority": "useful"}]}, {"slug": "cornell_lettuce", "short": "Hydroponic Lettuce (Cornell)", "emoji": "🥗", "color": "#38a169", "warn": "", "title": "Cornell CEA Hydroponic Lettuce Handbook", "authors": "Melissa Brechner, A.J. Both and CEA staff (Cornell University CEA Program)", "edition": "2013", "file": "", "url": "https://cea.cals.cornell.edu/files/2019/06/Cornell-CEA-Lettuce-Handbook-.pdf", "licence": "Free from Cornell CEA (publisher-hosted PDF)", "overview": "The companion to the spinach handbook: a step-by-step manual for growing butterhead (bibb) lettuce in a deep-water pond system, from rockwool seedlings to a 150 g head in 35 days. It explains seedling ebb-and-flood benches, pond design, the environmental set-points, respacing, tipburn control with airflow, and crop health.", "how": "Focus on Chapter 3 (set-points) and Chapter 4 (day-by-day production); compare each number with the spinach handbook to see what changes between crops.", "free": true, "chapters": [{"n": 1, "title": "Greenhouse Hardware: nursery area and pond area", "pdf_pages": "6-15", "minutes": 20, "summary": ["Seedlings (days 0-11) grow on ebb-and-flood benches (about 2.5 × 1.3 m) fed from a tank of at least 250 L by a small 1/50 hp pump.", "Nursery light is 50 µmol/m²/s PAR for the first 24 hours, then 250 µmol/m²/s with a 24-hour photoperiod; fluorescent light gives compact seedlings, incandescent causes stretching.", "The example pond area is 660 m² to produce 1,245 heads per day; plants spend 24 days in the pond at 97 plants/m², respaced to 38 plants/m².", "Ponds are lined with 0.5 mm polyethylene over sand and filled with RO water plus equal parts Stock A and B to an EC of 1200 µS/cm (1.2 dS/m).", "Target DLI is 17 mol/m²/d, using 100-200 µmol/m²/s supplemental HPS (preferred) or metal halide light.", "Downward airflow from paddle fans (140 cubic feet per minute per square foot of pond) is essential: without it, the maximum safe DLI drops from 17 to 12 mol/m²/d because of tipburn."], "terms": [{"term": "Ebb-and-flood bench", "def": "A bench that is periodically flooded with nutrient solution then drained, watering trays from below."}, {"term": "Tipburn", "def": "Browning of young leaf edges caused by poor calcium delivery to fast-growing leaves."}, {"term": "Respacing", "def": "Moving plants further apart as they grow so they have room and light."}, {"term": "Photoperiod", "def": "The number of hours of light per day."}, {"term": "Paddle fan", "def": "A fan that pushes air down onto the crop to increase transpiration."}, {"term": "Plant density", "def": "Number of plants per square metre of growing area."}], "cards": [{"q": "What EC is the lettuce pond solution kept at?", "a": "1200 µS/cm (1.2 dS/m) above the source water."}, {"q": "What DLI target does Cornell use for pond lettuce?", "a": "17 mol/m²/d."}, {"q": "What happens to the safe DLI if there is no downward airflow?", "a": "It drops from 17 to about 12 mol/m²/d, otherwise tipburn develops."}, {"q": "How does airflow prevent tipburn?", "a": "It increases transpiration, which speeds nutrient transport and delivers enough calcium to the leaves."}, {"q": "What light intensity do lettuce seedlings get after the first 24 hours?", "a": "250 µmol/m²/s PAR, 24 hours a day."}, {"q": "Why avoid incandescent lamps for seedlings?", "a": "They cause seedling stretching."}, {"q": "What are the initial and final pond plant densities?", "a": "97 plants/m², respaced to 38 plants/m²."}, {"q": "How much pond area does Cornell's example need for 1,245 heads per day?", "a": "660 m²."}], "for_rush": "Tipburn on your home lettuce or spinach is often an airflow/calcium problem rather than a nutrient shortage - a small fan can fix it.", "priority": "useful"}, {"n": 2, "title": "System Components: DO sensor, pump and flow meters", "pdf_pages": "16", "minutes": 5, "summary": ["The same hand-held Orion 820 DO meter as the spinach handbook is recommended (YSI, Oakton, Extech as alternatives).", "Lettuce grows satisfactorily above 4 ppm DO, shows stress at 3 ppm, and is normally run at 7-10 ppm; 20 ppm gives no extra benefit.", "The nursery uses a small submersible centrifugal pump (about 0.02 hp, 75 W).", "Variable-area flow meters control pure oxygen delivery to the pond."], "terms": [{"term": "Submersible centrifugal pump", "def": "A pump that sits under water and moves solution using a spinning impeller."}, {"term": "Dissolved oxygen", "def": "Oxygen dissolved in the solution, needed for root respiration (mg/L or ppm)."}, {"term": "Variable-area flow meter", "def": "A tube with a float that rises with flow, used to set gas flow rate."}, {"term": "Pure oxygen injection", "def": "Bubbling bottled oxygen rather than air into the pond to reach higher DO levels."}], "cards": [{"q": "What is the minimum DO for satisfactory lettuce growth?", "a": "4 ppm."}, {"q": "At what DO level does lettuce show visible stress?", "a": "About 3 ppm."}, {"q": "What DO range is lettuce normally kept at?", "a": "7-10 ppm."}, {"q": "Why does Cornell use pure oxygen rather than an air pump?", "a": "Pure oxygen reaches higher DO levels than air pumps and air stones."}, {"q": "What size pump drives the nursery ebb-and-flood bench?", "a": "A small submersible pump of about 1/50 hp (0.02 hp, 75 W)."}, {"q": "Is there any advantage to 20 ppm DO?", "a": "No, there is no advantage above the 7-10 ppm range."}], "for_rush": "", "priority": "skim"}, {"n": 3, "title": "Computer Technology and Monitoring: parameters and set-points", "pdf_pages": "17-19", "minutes": 20, "summary": ["Temperature controls enzyme activity and growth rate; air set-points are 24 °C day / 19 °C night, water no higher than 25 °C (cool at 26 °C, heat at 24 °C).", "Humidity is kept between 50% and 70%; high humidity encourages Botrytis and mildew.", "CO2 can drop from about 390 ppm outdoors to 100 ppm in a closed greenhouse; enrich to 1500 ppm (liquid CO2) when there is light.", "Measure light as PAR with a quantum sensor; foot-candle meters overestimate usable light by around 25%.", "pH optimum 5.8 (range 5.6-6.0); DO set-point 7 mg/L, crop failure below 3 ppm.", "EC set-point 1150-1250 µS/cm above source water; EC falls as plants feed and rises with evaporation, so dilute with RO water or add stock as needed."], "terms": [{"term": "Botrytis", "def": "Grey mould, a fungal disease favoured by high humidity."}, {"term": "Set-point", "def": "The target value an automated control system maintains."}, {"term": "Foot-candle", "def": "A human-vision light unit; unsuitable for judging plant light."}, {"term": "Enzyme", "def": "A protein that speeds up a chemical reaction in the plant; its activity depends strongly on temperature."}, {"term": "EC above source water", "def": "The fertiliser contribution to EC after subtracting the EC of the raw water."}], "cards": [{"q": "What EC set-point range is used for pond lettuce?", "a": "1150-1250 µS/cm above the source water EC."}, {"q": "What CO2 set-point does the lettuce handbook give when light is available?", "a": "1500 ppm."}, {"q": "Why is high humidity a problem for lettuce?", "a": "It cuts transpiration and encourages diseases such as Botrytis and mildew."}, {"q": "By roughly how much do foot-candle sensors overestimate PAR?", "a": "About 25%."}, {"q": "What is the pH optimum and range for hydroponic lettuce?", "a": "Optimum 5.8, range 5.6-6.0."}, {"q": "Below what DO level does the crop fail?", "a": "Below 3 ppm."}, {"q": "How do lettuce set-points compare with spinach set-points?", "a": "Almost identical: same temperatures, humidity, pH and DO; lettuce EC is slightly lower (about 1200 vs 1300 µS/cm)."}, {"q": "How low can CO2 fall in a closed greenhouse on a bright day?", "a": "To about 100 ppm, which severely reduces photosynthesis."}], "for_rush": "Lettuce and spinach share nearly the same targets, so one home system can grow both - just run spinach slightly stronger (about 1300 vs 1200 µS/cm).", "priority": "core"}, {"n": 4, "title": "Lettuce Production: the 35-day schedule", "pdf_pages": "20-25", "minutes": 25, "summary": ["Day 0: sow one seed per 1-inch rockwool cube (7 trays × 200 cells), cover to keep humidity, 20 °C, 50 µmol/m²/s light for 24 h, sub-irrigate with RO water for 15 minutes every 12 hours.", "Day 1: switch to nutrient solution at EC 1200 µS/cm and pH 5.8 (adjust with potassium hydroxide or nitric acid), raise to 25 °C and 250 µmol/m²/s. Day 2: remove covers.", "Days 3-4: remove double or oversized seedlings and check germination percentage; days 5-6: increase watering to four 15-minute floods per day.", "Day 11: water thoroughly and transplant plugs into hand-drilled polystyrene floats on the pond (97 plants/m²).", "Day 21: respace to 38 plants/m² in a second pond; keep 24/19 °C, DLI 17 mol/m²/d, DO 7 ppm, pH 5.6-6.0, airflow on.", "Day 35: harvest a head of about 150 g (5 oz) fresh weight; shorter photoperiods are fine if intensity rises to give the same daily light."], "terms": [{"term": "Rockwool", "def": "A spun-mineral-fibre growing medium that holds water and air, used for seedling plugs."}, {"term": "Sub-irrigation", "def": "Watering from below by flooding the tray base."}, {"term": "Germination percentage", "def": "The proportion of sown seeds that successfully sprout."}, {"term": "Transplant", "def": "Moving seedlings from the nursery to the main growing system."}, {"term": "Fresh weight", "def": "The weight of the harvested plant including its water."}, {"term": "Butterhead (bibb) lettuce", "def": "A soft, loose-headed lettuce type; Cornell used the cultivar 'Ostinata'."}], "cards": [{"q": "How long is the Cornell lettuce cycle from seed to harvest?", "a": "35 days: 11 days in the nursery and 24 days in the pond."}, {"q": "What is the target harvest weight per head?", "a": "About 150 g (5 oz) fresh weight."}, {"q": "On which day are plants respaced, and to what density?", "a": "Day 21, from 97 to 38 plants/m²."}, {"q": "What pH is the nursery solution adjusted to on Day 1, and with what?", "a": "pH 5.8, using potassium hydroxide (to raise) or nitric acid (to lower)."}, {"q": "Why are seedlings watered thoroughly just before transplanting?", "a": "To prevent the plugs and exposed roots drying out during transport."}, {"q": "Why remove doubled or oversized seedlings on days 3-4?", "a": "To keep the crop uniform."}, {"q": "How often are seedlings sub-irrigated on days 0-4 and from day 5?", "a": "15 minutes every 12 hours at first, then four times a day (every 6 hours)."}, {"q": "If you shorten the photoperiod, what must you change?", "a": "Increase light intensity so the total daily light (DLI) stays the same."}, {"q": "What is the nursery temperature on Day 0 versus from Day 1?", "a": "20 °C on Day 0, raised to 25 °C from Day 1."}], "for_rush": "This day-by-day timeline is a ready template for a home lettuce or spinach batch log - perfect for documenting your hydroponics as a mini-project.", "priority": "core"}, {"n": 5, "title": "Packaging, Post-Harvest Storage and Crop Health", "pdf_pages": "26-27", "minutes": 10, "summary": ["Lettuce can be sold in clamshells or as a 'bouquet' bag, with or without roots; packaging can be a significant cost. Store at about 4 °C (40 °F).", "Powdery mildew can be a problem in winter production; root disease can also occur.", "Prevention: keep growth fast, shade tanks against algae, clean floats, trays and equipment with 2% bleach between cycles, ban outside plants and soil, and limit visitors.", "If root disease appears, drain ponds and tanks, sacrifice the crop and disinfect everything including the germination area.", "Possible pests include shore flies, fungus gnats, thrips and aphids; screen vents, mow outside vegetation, and consider biological control (nicotine was tested and tainted the lettuce)."], "terms": [{"term": "Powdery mildew", "def": "A fungal disease producing white powdery patches on leaves."}, {"term": "Fungus gnats", "def": "Small flies whose larvae live in moist media and can damage roots."}, {"term": "Thrips", "def": "Tiny insects that rasp leaf surfaces and can spread viruses."}, {"term": "Biological control", "def": "Using natural enemies (predators, parasites) to control pests instead of chemicals."}, {"term": "Living lettuce", "def": "Lettuce sold with roots attached, which extends shelf life."}], "cards": [{"q": "At what temperature should harvested lettuce be stored?", "a": "About 4 °C (40 °F)."}, {"q": "Which disease is mentioned as a winter problem for lettuce?", "a": "Powdery mildew."}, {"q": "Name three pests listed for hydroponic lettuce.", "a": "Any three of shore flies, fungus gnats, thrips and aphids."}, {"q": "Why was nicotine rejected as a pest control?", "a": "It was ineffective and gave the lettuce an off taste."}, {"q": "What is used to clean floats and trays between cycles?", "a": "A 2% bleach solution (or a commercial disinfectant)."}, {"q": "What is the first response to root disease in the pond?", "a": "Drain ponds and tanks, sacrifice the crop and disinfect everything."}], "for_rush": "", "priority": "useful"}]}, {"slug": "ifas_kratky", "short": "Kratky Lettuce (UF/IFAS)", "emoji": "🫙", "color": "#319795", "warn": "", "title": "\"Set It and Forget It\" Hydroponic Lettuce (HS1488)", "authors": "Hannah Eason (UF/IFAS Extension)", "edition": "2025", "file": "", "url": "https://ask.ifas.ufl.edu/publication/HS1488", "licence": "Free from UF/IFAS Extension (publisher-hosted)", "overview": "A short extension guide to the Kratky method: a passive, non-circulating hydroponic system in a 5-gallon bucket that needs no pumps, air stones or electricity. It gives a materials list and step-by-step instructions from seed starting to harvest, with nutrient, EC and pH targets.", "how": "Read it in one sitting and follow it as a recipe; it is the simplest possible home setup and a good baseline to compare with deep-water systems.", "free": true, "chapters": [{"n": 1, "title": "Introduction: what the Kratky method is and what to grow", "pdf_pages": "online", "minutes": 5, "summary": ["The Kratky method is a non-circulating hydroponic system: the whole crop is grown with only the initial water and nutrients, with no pumps, aerators or electricity.", "Lettuce is ideal - low maintenance, low profile and short-cycle; baby bok choy also works, while tomatoes and cucumbers need more advanced systems.", "Each lettuce plant uses about 1-1.5 gallons of water from seed to harvest.", "Wider containers are better than tall ones so roots can reach the water, and food-grade plastic should be used.", "In Florida it is a cool-season (October-March) outdoor project; it can run year-round indoors with lights and a fan, and it suits classroom experiments."], "terms": [{"term": "Kratky method", "def": "Passive hydroponics where plants sit above a still nutrient solution that is never topped up or circulated; an air gap forms as the level drops."}, {"term": "Non-circulating hydroponics", "def": "A system where the nutrient solution does not move or get pumped."}, {"term": "Air gap", "def": "The space between the lid and the falling water level where upper roots get oxygen from the air."}, {"term": "Food-grade plastic", "def": "Plastic considered safe for contact with food and water."}, {"term": "Net cup/net pot", "def": "A slotted plastic cup that holds a seedling while letting roots grow through into the solution."}], "cards": [{"q": "What makes the Kratky method different from deep-water culture?", "a": "No pump or aeration: the solution is still and is added only once at the start."}, {"q": "How much water does one lettuce plant use from seed to harvest in this system?", "a": "About 1-1.5 gallons."}, {"q": "Why are wide containers better than tall ones for Kratky?", "a": "As the water level drops, roots in a shallow wide container can still reach it."}, {"q": "Which crops does the guide say need more advanced hydroponics than Kratky?", "a": "Tomatoes and cucumbers."}, {"q": "How do roots get oxygen without an air pump?", "a": "Upper roots in the growing air gap take oxygen from the air as the water level falls."}, {"q": "What season is recommended for outdoor Kratky lettuce in Florida?", "a": "The cool season, October to March."}], "for_rush": "Kratky is a no-electricity backup or extra unit for your home spinach, but in hot UAE conditions still water warms and loses oxygen fast, so keep it indoors or shaded.", "priority": "core"}, {"n": 2, "title": "Step-by-step guide: materials, setup, nutrient solution, planting and harvest", "pdf_pages": "online", "minutes": 10, "summary": ["Start seeds (1-2 per cube) in soaked rockwool or Oasis cubes under a humid cover; seedlings are ready in 1-3 weeks.", "Drill three 2-inch holes in the lid of a 5-gallon bucket and fit 2-inch net cups.", "Fill with water leaving about 1 inch at the top, add hydroponic fertiliser at about 1 teaspoon per gallon (5 tsp per bucket), labelled for leafy/vegetative or all-purpose growth.", "Target EC about 1250 µS/cm (TDS about 800 ppm) and pH 5.5-6.0, lowering pH with white vinegar (often about 2 tsp per gallon); stir and retest.", "Set the water level about halfway up the net cups, insert seedlings so they touch the solution, and place in good light.", "Leave for 3-4 weeks with no further intervention, then cut the lettuce at the base with scissors."], "terms": [{"term": "EC (µS/cm)", "def": "Electrical conductivity of the solution, showing fertiliser strength; 1250 µS/cm equals 1.25 dS/m."}, {"term": "TDS (ppm)", "def": "Total dissolved solids, an estimate of dissolved salts calculated from EC by the meter."}, {"term": "pH down", "def": "Any acid added to lower pH; here household white vinegar."}, {"term": "Grow cube", "def": "A small block of rockwool or foam (e.g. Oasis) used to germinate seeds."}, {"term": "Two-part fertiliser", "def": "A hydroponic nutrient sold as separate A and B concentrates to avoid precipitation."}], "cards": [{"q": "What EC does the IFAS Kratky guide target?", "a": "About 1250 µS/cm (roughly 800 ppm TDS)."}, {"q": "What pH range is targeted and how is it lowered?", "a": "pH 5.5-6.0, lowered with white distilled vinegar."}, {"q": "How much fertiliser goes into a 5-gallon bucket?", "a": "About 1 teaspoon per gallon, so about 5 teaspoons."}, {"q": "How high should the solution be when seedlings go in?", "a": "About halfway up the net cups, so the seedling touches the solution."}, {"q": "How long from transplant to harvest?", "a": "About 3-4 weeks."}, {"q": "How many plants per 5-gallon bucket in this guide?", "a": "Three, in 2-inch net cups."}, {"q": "Why stir and retest after adding vinegar?", "a": "To mix the acid evenly and confirm pH is really in the 5.5-6.0 range."}, {"q": "What fertiliser label should you look for?", "a": "One for leafy/vegetative growth or all-purpose; liquid, granular or two-part are all acceptable."}], "for_rush": "EC 1250 µS/cm and pH 5.5-6.0 here match the Cornell numbers closely - a good sign your home targets are consistent across sources.", "priority": "core"}]}, {"slug": "ifas_nutrients", "short": "Hydroponic Water & Nutrients (UF/IFAS)", "emoji": "💧", "color": "#2b6cb0", "warn": "", "title": "Water and Nutrient Management Guidelines for Greenhouse Hydroponic Vegetable Production in Florida (HS1274)", "authors": "Robert C. Hochmuth, Natalie B. Parkell, Wanda L. Laughlin, Sean C. Rider (UF/IFAS Extension)", "edition": "2016 (revised 2025)", "file": "", "url": "https://ask.ifas.ufl.edu/publication/HS1274", "licence": "Free from UF/IFAS Extension (publisher-hosted)", "overview": "An extension guide for small greenhouse growers using soilless media (coconut fibre, perlite, pine bark) and drip irrigation in a hot climate. It explains how to judge media water-holding capacity, when and how long to irrigate, how to target 10-20% leachate, and how to read leachate EC to adjust the nutrient solution.", "how": "Concentrate on the leachate and EC sections - the '10-20% leachate' and '±1 EC unit' rules are the practical takeaways; skim the controller and sensor sections.", "free": true, "chapters": [{"n": 1, "title": "Knowing your media and when to irrigate", "pdf_pages": "online", "minutes": 10, "summary": ["Media differ hugely in water-holding capacity: coconut fibre > pine bark > perlite. A 3-gallon upright bag of fine coconut fibre holds about 1 gallon of water; coarse coir, perlite and pine bark hold about half that.", "Measure your own media: weigh it dry, saturate it, weigh again, and divide the water weight by 8.34 lb per gallon.", "Plants in soilless media usually need irrigating several times a day; young transplants may need only 1-2 short events of 1-2 ounces.", "Mature tomato or cucumber plants can use 2-2.5 quarts of water a day at peak harvest.", "Start irrigating within 1-2 hours after sunrise; night irrigation is rarely needed because transpiration is low.", "Fine coir typically needs 6-8 events per day, while low-holding media like perlite may need a dozen or more shorter events."], "terms": [{"term": "Soilless media", "def": "Growing substrates such as coconut fibre (coir), perlite or pine bark that hold roots but supply no nutrients themselves."}, {"term": "Water-holding capacity", "def": "How much water a medium can hold after saturation and drainage."}, {"term": "Coconut fibre (coir)", "def": "A medium made from coconut husk with high water-holding capacity."}, {"term": "Perlite", "def": "Expanded volcanic glass; very free-draining and holds little water."}, {"term": "Irrigation event", "def": "One watering cycle delivered by the timer."}], "cards": [{"q": "Rank coconut fibre, perlite and pine bark by water-holding capacity.", "a": "Coconut fibre > pine bark > perlite."}, {"q": "How do you measure a medium's water-holding capacity?", "a": "Weigh it dry, saturate it, weigh again; the weight gain divided by 8.34 lb/gal gives gallons of water held."}, {"q": "How many irrigation events per day does fine coir usually need?", "a": "About 6-8."}, {"q": "Why does perlite need more, shorter events?", "a": "It holds little water, so it dries quickly between events."}, {"q": "When should the first irrigation of the day start in warm seasons?", "a": "About 1-2 hours after sunrise."}, {"q": "Why is night irrigation usually unnecessary?", "a": "Transpiration is low at night, so plants use little water."}, {"q": "How much water can a mature tomato plant use daily at peak harvest?", "a": "About 2-2.5 quarts."}], "for_rush": "Hot-climate media irrigation logic like this transfers directly to UAE greenhouse drip systems.", "priority": "useful"}, {"n": 2, "title": "Duration of irrigation and the 10-20% leachate rule", "pdf_pages": "online", "minutes": 8, "summary": ["Each irrigation should bring media to 100% water-holding capacity and produce some drainage (leachate).", "Aim for leachate of about 10%, and no more than 20%, of the total irrigation volume.", "Leaching stops soluble salts building up, evens out nutrient distribution and compensates for uneven emitters.", "Too much salt dehydrates and damages roots and causes marginal leaf necrosis (brown leaf edges).", "Tomatoes tolerate higher salt levels than cucumbers, peppers or lettuce."], "terms": [{"term": "Leachate", "def": "The nutrient solution that drains out of the bottom of the medium after irrigation."}, {"term": "Leaching fraction", "def": "Leachate volume as a percentage of the volume applied."}, {"term": "Soluble salts", "def": "Dissolved fertiliser and water salts measured by EC; excess harms roots."}, {"term": "Marginal leaf necrosis", "def": "Death and browning of leaf edges, a typical salt-injury symptom."}], "cards": [{"q": "What leachate percentage should you aim for?", "a": "About 10%, and no more than 20%, of the volume applied."}, {"q": "Why produce any leachate at all?", "a": "To flush excess salts, even out nutrient distribution and cover irrigation unevenness."}, {"q": "What leaf symptom suggests salt build-up?", "a": "Marginal leaf necrosis (brown, dead leaf edges)."}, {"q": "Which is more salt-tolerant: tomato or lettuce?", "a": "Tomato; lettuce, cucumber and pepper are more sensitive."}, {"q": "How does excess salt damage roots?", "a": "It dehydrates them by drawing water out."}, {"q": "What happens if leachate is far above 20%?", "a": "Water and fertiliser are wasted for no extra benefit."}], "for_rush": "Salt accumulation is the central problem in UAE agriculture, where source water is often saline - the leaching logic here is the same idea at field scale.", "priority": "core"}, {"n": 3, "title": "Concentration of the nutrient solution: EC targets and reading leachate EC", "pdf_pages": "online", "minutes": 8, "summary": ["Typical Florida irrigation water has an EC of 0.5 dS/m or less; the delivered nutrient solution is usually 1.5-3.5 dS/m, starting low for young crops.", "Leachate EC should stay within 1.0 dS/m above or below the applied solution EC.", "If leachate EC is 1.0 unit lower than applied, plants are short of nutrients - adjust the fertiliser.", "If leachate EC is 1.0 unit higher, the incoming solution is too strong; if it is 3-4 units higher, flush the media with water and then resume the correct strength.", "Hot southern climates need weaker solutions applied more often; northern recipes and leachate rules should not be copied directly."], "terms": [{"term": "dS/m", "def": "Decisiemens per metre, a unit of EC; 1 dS/m = 1000 µS/cm = 1 mS/cm."}, {"term": "Applied (inflow) EC", "def": "The EC of the solution delivered by the drippers."}, {"term": "Leachate EC", "def": "The EC of drainage water, revealing salt build-up or depletion in the root zone."}, {"term": "Flushing", "def": "Irrigating with plain water to wash accumulated salts out of the media."}], "cards": [{"q": "What EC range is typical for the final delivered nutrient solution in Florida greenhouses?", "a": "1.5-3.5 dS/m."}, {"q": "What is the typical EC of Florida irrigation water?", "a": "0.5 dS/m or less."}, {"q": "How far may leachate EC differ from applied EC?", "a": "No more than 1.0 dS/m above or below."}, {"q": "Leachate EC is 1 unit below the applied EC. What does it mean?", "a": "Plants are taking up more than is supplied - the solution is too weak; adjust fertiliser."}, {"q": "Leachate EC is 3-4 units above applied. What do you do?", "a": "Flush the media with water, then resume the correct concentration."}, {"q": "Convert 1.25 dS/m to µS/cm.", "a": "1250 µS/cm."}, {"q": "Why shouldn't Florida growers copy northern nutrient recipes?", "a": "Hot climates need lower concentrations applied more frequently because plants use more water."}], "for_rush": "Reading drainage EC against input EC is exactly how you would spot salt build-up in a Dubai substrate system using brackish or desalinated water.", "priority": "core"}, {"n": 4, "title": "Leachate collection, automated controllers and moisture sensors", "pdf_pages": "online", "minutes": 6, "summary": ["Collect leachate from one or more representative plant positions (troughs or half PVC pipes under slabs; drain pans under bags), never using edge rows alone.", "The plant container must never sit in a pool of its own leachate.", "Measure both the volume delivered (e.g. an emitter dripping into an empty gallon jug) and the volume drained.", "Most small farms do not recirculate leachate because of sanitising and rebalancing costs; it can be reused for other environmentally sound purposes.", "A simple timer controller should have battery backup, minute/second intervals, multiple zones and programs, a master valve and surge protection.", "UF/IFAS is testing capacitance moisture sensors, which work in fine coir but not in coarse media such as perlite or pine bark."], "terms": [{"term": "Recirculating system", "def": "A system that collects, treats and reuses drainage solution."}, {"term": "Solenoid/master valve", "def": "An electrically operated valve opened by the irrigation controller."}, {"term": "Capacitance sensor", "def": "A sensor that estimates volumetric water content of a medium from its electrical properties."}, {"term": "Volumetric water content", "def": "The fraction of a medium's volume that is water."}], "cards": [{"q": "What is the one critical rule when collecting leachate?", "a": "The plant container must never sit in a pool of leachate."}, {"q": "Why are edge rows poor monitoring positions?", "a": "Outside rows are often unrepresentative of interior plants."}, {"q": "Why do most small growers not recirculate leachate?", "a": "Sanitising and replenishing nutrients adds cost and complexity."}, {"q": "In which medium did capacitance moisture sensors work?", "a": "Fine coconut fibre (not perlite or pine bark)."}, {"q": "Name three features a simple irrigation controller should have.", "a": "Any three of battery backup, minute/second timing, multiple zones, multiple programs, master valve connection, surge protection."}, {"q": "What two volumes must you measure to calculate leachate %?", "a": "The volume delivered and the volume drained."}], "for_rush": "", "priority": "skim"}]}, {"slug": "iucn_soilless", "short": "Soilless Agriculture (IUCN West Asia)", "emoji": "🏜️", "color": "#c05621", "warn": "", "title": "Soilless Agriculture Guidelines: Raft and Drip Hydroponics", "authors": "Mohammad Abu Tarboush and Razan Baqain (IUCN Regional Office for West Asia)", "edition": "2023", "file": "", "url": "https://portals.iucn.org/library/sites/library/files/documents/2023-026-En.pdf", "licence": "Free from IUCN Library (publisher-hosted PDF)", "overview": "A practical farmer manual from IUCN West Asia (Jordan) describing two water-saving soilless systems for arid regions: floating raft hydroponics and drip irrigation in volcanic tuff. It covers basin construction, air and irrigation networks, nutrient tank recipes, daily monitoring checklists and solar power for the pumps.", "how": "Read the introduction, nutrient solution and daily monitoring chapters closely; skim construction dimensions and the solar chapter unless you are planning a real farm.", "free": true, "chapters": [{"n": 1, "title": "Introduction and the Raft Hydroponic System", "pdf_pages": "1-4", "minutes": 10, "summary": ["Soilless agriculture grows crops in nutrient solutions instead of soil (hydroponics and aquaponics) and can save 40-90% of water, making it suited to arid and semi-arid regions.", "In the raft system, plants float on perforated polystyrene boards on aerated nutrient basins (internal size about 10.1 × 1.85 m, lined with at least 300-micron polyethylene).", "Seedlings are raised in 84-hole nursery trays (0.7 × 0.4 m) in a 3:1 peat moss:perlite mix.", "Suitable crops include lettuce, leafy greens and green onions (60-70 days in summer, 70-80 in winter).", "Advantages: easy planting, about double the plants per square metre, no weeds, and up to 5 production cycles per year."], "terms": [{"term": "Soilless agriculture", "def": "Growing crops without soil, using nutrient solutions and inert media."}, {"term": "Raft system", "def": "Plants held in floating boards over an aerated nutrient basin (deep-water culture)."}, {"term": "Aquaponics", "def": "A system combining fish farming with hydroponics, where fish waste supplies nutrients."}, {"term": "Polyethylene liner", "def": "A waterproof plastic sheet lining the basin; at least 300 microns thick here."}, {"term": "Arid / semi-arid", "def": "Regions with very low or low rainfall, such as much of West Asia."}], "cards": [{"q": "How much water can soilless agriculture save according to IUCN?", "a": "About 40-90% compared with traditional farming."}, {"q": "What are the main advantages of the raft system?", "a": "Easy planting, about double the plant density, no weeds, and up to 5 cycles a year."}, {"q": "What nursery mix is used for raft seedlings?", "a": "Peat moss and perlite at 3:1."}, {"q": "How long do green onions take in the raft system?", "a": "60-70 days in summer, 70-80 days in winter."}, {"q": "What minimum liner thickness is specified?", "a": "300 microns of polyethylene."}, {"q": "What does the raft floating board hold?", "a": "Seedlings in holes in perforated polystyrene."}], "for_rush": "This is a West Asian, arid-region view of the same raft system you run at home - useful framing for UAE agri-tech interviews.", "priority": "core"}, {"n": 2, "title": "The Drip Irrigation (substrate) System", "pdf_pages": "5-7", "minutes": 8, "summary": ["Plants grow in basins filled with layers of coarse and fine volcanic tuff, fed by drip lines; drainage is collected and recycled.", "Basins are about 10.1 × 1.85 m with a 1-2% slope towards the drain.", "The network uses 63 mm HDPE main pipes and 16 mm LDPE drip lines with 2 L/h drippers every 30 cm, six 10 m lines per basin.", "Crops include thyme (lives 5+ years, peaks in years 3-4), sage (cut every 2 months), mint, basil and Swiss chard (cut every 2 weeks) and lettuce (25-30 days summer, 30-35 winter).", "The system saves about 50-70% of water for herb and medicinal crops."], "terms": [{"term": "Volcanic tuff", "def": "A porous rock made from volcanic ash, used locally as a growing medium."}, {"term": "Dripper/emitter", "def": "A device that releases water at a fixed slow rate, here 2 L/h."}, {"term": "HDPE / LDPE", "def": "High- and low-density polyethylene pipe; HDPE for mains, LDPE for drip lines."}, {"term": "Slope gradient", "def": "The fall of the basin floor (1-2%) so drainage flows to the outlet."}], "cards": [{"q": "What medium fills the drip-system basins?", "a": "Layers of coarse and fine volcanic tuff."}, {"q": "What dripper flow rate and spacing are used?", "a": "2 L/h every 30 cm."}, {"q": "How long does drip-grown lettuce take?", "a": "25-30 days in summer, 30-35 days in winter."}, {"q": "Why do basins have a 1-2% slope?", "a": "So drainage water flows to the outlet for collection and recycling."}, {"q": "How much water does the drip system save for medicinal crops?", "a": "About 50-70%."}, {"q": "How often are mint, basil and Swiss chard harvested?", "a": "Every 2 weeks."}], "for_rush": "", "priority": "useful"}, {"n": 3, "title": "Managing the raft and drip systems", "pdf_pages": "8-11", "minutes": 8, "summary": ["Raft basins are filled through 5 cm UPVC pipes from the fertigation unit to a water depth of about 17 cm; refill after liner damage, heavy evaporation in heat, or for crops longer than 30 days.", "Aeration uses a 1.5 hp turbine pump, PVC distribution pipes, 16 mm LDPE lines and 60 cm air stones.", "In summer the air pump runs in cycles of at most 30 minutes, about 8 times a day, adjusted by dissolved oxygen readings and root colour.", "Drip systems run 5-10 cycles a day of 3-5 minutes, aiming for 20-30% drainage, adjusted for temperature.", "Drainage flows through PVC drains to a lower tank with a submersible pump; check dripper flow rates regularly."], "terms": [{"term": "Fertigation unit", "def": "Equipment that injects and mixes fertiliser into irrigation water automatically."}, {"term": "Air stone", "def": "A porous diffuser that releases fine air bubbles into the solution."}, {"term": "Drainage ratio", "def": "Percentage of applied water that drains out; 20-30% in these drip systems."}, {"term": "Root colour", "def": "A visual health indicator: healthy hydroponic roots are white; brown roots suggest low oxygen or disease."}], "cards": [{"q": "What water depth is recommended in raft basins?", "a": "About 17 cm."}, {"q": "How is aeration scheduled in summer?", "a": "Cycles of up to 30 minutes, about 8 times per day, adjusted by DO and root colour."}, {"q": "What drainage percentage is targeted in the IUCN drip system?", "a": "20-30% of the irrigation water."}, {"q": "How many drip cycles per day and how long each?", "a": "5-10 cycles of 3-5 minutes, depending on temperature."}, {"q": "When must raft basins be refilled?", "a": "After liner rupture, high evaporation in heat, or for crops longer than 30 days."}, {"q": "Compare IUCN drip drainage with the IFAS leachate target.", "a": "IUCN aims for 20-30%; IFAS (Florida) aims for 10-20%."}], "for_rush": "Watching root colour and evaporation-driven top-ups are exactly the checks a hot Dubai balcony system needs.", "priority": "useful"}, {"n": 4, "title": "Nutrient solution and fertigation unit use", "pdf_pages": "12-17", "minutes": 12, "summary": ["A nutrient solution contains all essential nutrients in balanced proportions: N, P, K, S, Ca, Mg, Mn, Zn, Cu, B, Mo and Fe (carbon comes from the air).", "Targets: EC 1.8-2.0 dS/m, pH 5.5-6.5, and source water with as low TDS as possible.", "A three-tank system keeps calcium nitrate and iron in Tank A, the 12:12:36 urea-free compound fertiliser (plus magnesium sulphate for green onion) in Tank B, and nitric acid for pH control in Tank C.", "Mix by half-filling tanks (50 L), dissolving fertiliser fully, topping up to 100 L, and adding acid to Tank C with care.", "Keep filters clean, ensure Tanks A and B are drawn at equal rates, and cross-check the unit's readings with hand-held meters.", "Typical lifespans: greenhouse 15 years, plastic and nets 3 years, cement basins 10 years, polystyrene 5 years, air pump 5 years, fertigation unit 10 years."], "terms": [{"term": "Essential nutrients", "def": "The elements a plant must obtain to complete its life cycle."}, {"term": "Urea-free fertiliser", "def": "A compound fertiliser with nitrogen as nitrate/ammonium rather than urea, better suited to hydroponics."}, {"term": "Nitric acid", "def": "A strong acid used to lower solution pH while also supplying nitrogen."}, {"term": "TDS", "def": "Total dissolved solids - the amount of dissolved salts in water."}, {"term": "12:12:36", "def": "A compound fertiliser grade giving the percentages of N, P (as P2O5) and K (as K2O)."}], "cards": [{"q": "What EC and pH targets does IUCN give?", "a": "EC 1.8-2.0 dS/m and pH 5.5-6.5."}, {"q": "Why is calcium nitrate kept in a separate tank from the compound fertiliser?", "a": "To stop calcium reacting with phosphate/sulphate and precipitating in concentrated form."}, {"q": "What is in Tank C and why?", "a": "Nitric acid, to lower pH."}, {"q": "Why should Tanks A and B be drawn at equal rates?", "a": "So the nutrients stay in the intended balance."}, {"q": "Why must the source water have low TDS?", "a": "High dissolved salts raise EC before any fertiliser is added and can be toxic or unbalance nutrition."}, {"q": "How does the IUCN EC target compare with Cornell's leafy-green target?", "a": "IUCN is higher (1.8-2.0 dS/m) than Cornell's ~1.2-1.3 dS/m for lettuce and spinach."}, {"q": "Where do plants get carbon?", "a": "From CO2 in the air."}, {"q": "What is the stated lifespan of a fertigation unit?", "a": "About 10 years."}], "for_rush": "Low-TDS source water matters most in the UAE, where groundwater is saline - which is why many Gulf hydroponic farms rely on RO or desalinated water.", "priority": "core"}, {"n": 5, "title": "Daily monitoring checklists (raft and drip)", "pdf_pages": "18-20", "minutes": 6, "summary": ["Raft daily checks: greenhouse condition, air pump working, water level in every basin, EC and pH of each basin (pH 5.5-6.5), water temperature, plant health and production records.", "Drip daily checks: media moisture, drainage working, leaks in the irrigation network, pump and tank levels, nutrient tank levels, filter cleanliness, drainage return, pests and diseases, and harvest records.", "Recording readings basin by basin lets problems be spotted early."], "terms": [{"term": "Monitoring log", "def": "A daily record of readings like EC, pH and temperature for each basin."}, {"term": "Water temperature", "def": "Temperature of the nutrient solution, affecting oxygen and disease risk."}, {"term": "Leak detection", "def": "Checking pipes and drippers for losses that waste water and nutrients."}], "cards": [{"q": "List four things checked daily in a raft system.", "a": "Any four of greenhouse condition, air pump, water levels, EC, pH, water temperature, plant health, production."}, {"q": "What pH range is checked for during raft monitoring?", "a": "5.5-6.5."}, {"q": "Why record EC for each basin separately?", "a": "Basins drift differently, so per-basin records reveal problems early."}, {"q": "Name three drip-system daily checks not needed in rafts.", "a": "Media moisture, dripper/network leaks, filter cleanliness, drainage return (any three)."}, {"q": "Why is water temperature in the raft checklist?", "a": "Warm water holds less oxygen and favours root disease."}, {"q": "What is the benefit of harvest records?", "a": "They track productivity over time and show the effect of management changes."}], "for_rush": "Turning this checklist into a simple daily spreadsheet for your spinach gives you real data you could analyse like a bioinformatics mini-project.", "priority": "core"}, {"n": 6, "title": "Solar photovoltaic system and system drawings", "pdf_pages": "21-30", "minutes": 6, "summary": ["Pumps can be powered by on-grid (connected to mains) or off-grid (battery-backed) solar systems.", "Components: PV modules make DC electricity, an inverter converts it to AC, batteries store energy (off-grid only), plus wiring and breakers.", "Clean panels weekly with soapy water and a soft brush, then rinse and dry; avoid steam or corrosive chemicals.", "Weekly checks: ground erosion, restricted access, corrosion, site cleanliness and wiring; never shade, stand on or dismantle panels, and leave installation to professionals.", "An annex gives construction drawings of the systems."], "terms": [{"term": "Photovoltaic (PV) module", "def": "A solar panel that converts sunlight into DC electricity."}, {"term": "Inverter", "def": "A device converting DC electricity into AC for pumps and appliances."}, {"term": "On-grid system", "def": "A solar system connected to the mains electricity network."}, {"term": "Off-grid system", "def": "A stand-alone solar system with battery storage."}], "cards": [{"q": "What does an inverter do?", "a": "Converts DC from the panels to AC power."}, {"q": "Which solar system type needs batteries?", "a": "Off-grid."}, {"q": "How often should panels be cleaned?", "a": "Weekly."}, {"q": "Name two things you must never do to PV panels.", "a": "Any two of shading them, standing on them, dropping objects on them, dismantling them, cleaning with steam/corrosive chemicals."}, {"q": "Why does dust matter in desert regions?", "a": "Dust on panels blocks sunlight and reduces output, so frequent cleaning is needed."}, {"q": "Who should install the solar system?", "a": "Qualified professionals only."}], "for_rush": "", "priority": "skim"}]}, {"slug": "undp_cea", "short": "CEA for Sustainable Development (UNDP)", "emoji": "🏙️", "color": "#4a5568", "warn": "", "title": "Controlled Environment Agriculture for Sustainable Development", "authors": "UNDP Global Centre for Technology, Innovation and Sustainable Development (Jack Ellis, Carla Gomez, Rinkle Dang, Ng Li Wen, Joe Hooper)", "edition": "2025", "file": "", "url": "https://www.undp.org/sites/g/files/zskgke326/files/2025-01/controlled_environment_agriculture_for_sustainable_development.pdf", "licence": "Free from UNDP (publisher-hosted PDF)", "overview": "A short policy brief explaining what controlled environment agriculture (CEA) is, its advantages and challenges, four company case studies (including a UAE vertical farm project), and pathways for developing countries to adopt it. It is a big-picture, industry-and-policy view rather than a growing manual.", "how": "Read it in one go for context and interview talking points; memorise the water, yield and food-miles comparison table.", "free": true, "chapters": [{"n": 1, "title": "Introduction and What is CEA?", "pdf_pages": "2-5", "minutes": 8, "summary": ["The world population is projected to reach 9.7 billion and food production must rise by over 50%; about one-third of food is wasted.", "CEA grows crops in facilities such as greenhouses and vertical farms using enabling technologies, outside conventional field conditions; it can cut water use by 53-98% and chemical use by up to 100%.", "CEA can be described on three axes: formats (greenhouses, vertical farms, plant factories, container farms), growing systems (hydroponics, aeroponics, aquaponics, soil) and enabling technologies (AI, machine learning, IoT sensors, LEDs, robotics).", "It reduces exposure to bad weather and allows year-round production with higher yield per area, but has higher overhead and energy costs."], "terms": [{"term": "Controlled environment agriculture (CEA)", "def": "Growing crops in enclosed facilities where light, temperature, water and nutrients are controlled."}, {"term": "Vertical farm", "def": "An indoor farm with crops stacked in layers under artificial light."}, {"term": "Aeroponics", "def": "A soilless system where roots hang in air and are misted with nutrient solution."}, {"term": "Container farm", "def": "A CEA unit built inside a shipping container."}, {"term": "IoT", "def": "Internet of Things: networked sensors and devices that collect and share data automatically."}], "cards": [{"q": "What are the three axes UNDP uses to classify CEA?", "a": "Formats, growing systems and enabling technologies."}, {"q": "Give the water-saving range UNDP cites for CEA.", "a": "53-98% less water."}, {"q": "Name four CEA formats.", "a": "Greenhouses, vertical farms, plant factories and container farms."}, {"q": "Name three enabling technologies in CEA.", "a": "Any three of AI, machine learning, IoT sensors, LEDs, robotics."}, {"q": "What is CEA's main economic downside?", "a": "Higher overhead and energy costs than conventional farming."}, {"q": "What share of food grown is wasted, according to the brief?", "a": "About one-third."}], "for_rush": "The AI/ML and sensor axis is where a bioinformatician's data skills fit into UAE agri-tech companies.", "priority": "core"}, {"n": 2, "title": "CEA: Advantages and Challenges", "pdf_pages": "7-9", "minutes": 8, "summary": ["For lettuce, water per kg is about 250 L in conventional fields, 20 L in greenhouses and 1 L in vertical farms.", "Yield per m² per year rises from about 3.9 kg (conventional) to 41 kg (greenhouse) and 80-120 kg (vertical farm); food miles fall from about 2,000 to 43 miles.", "Benefits: fresher produce with longer shelf life, fewer transport emissions, less supply-chain waste, lower pest and disease risk, and predictable yields.", "Challenges: large investment, high energy costs (unless renewables are used), limited investment and few local suppliers in lower-income regions, and infrastructure gaps."], "terms": [{"term": "Food miles", "def": "The distance food travels from farm to consumer."}, {"term": "Resource-use efficiency", "def": "Output produced per unit of water, land, energy or inputs."}, {"term": "Capital expenditure (capex)", "def": "Up-front investment in buildings and equipment."}, {"term": "Shelf life", "def": "How long produce stays saleable after harvest."}], "cards": [{"q": "How much water per kg of lettuce in conventional, greenhouse and vertical farming?", "a": "About 250 L, 20 L and 1 L respectively."}, {"q": "What lettuce yield per m² per year does a vertical farm achieve versus conventional?", "a": "80-120 kg versus about 3.9 kg."}, {"q": "What greenhouse lettuce yield per m² per year is given?", "a": "About 41 kg."}, {"q": "How can CEA's energy problem be reduced?", "a": "By using renewable energy."}, {"q": "Why is CEA adoption slower in lower-income regions?", "a": "High investment costs, limited finance, few local solution providers and weak infrastructure."}, {"q": "List three benefits of CEA beyond water saving.", "a": "Any three of fresher produce, longer shelf life, lower transport emissions, less waste, fewer pests/diseases, predictable yields."}], "for_rush": "These numbers are strong interview talking points for UAE food-security roles, where water scarcity and imported food are national priorities.", "priority": "core"}, {"n": 3, "title": "Models for Scaling CEA: Case Studies", "pdf_pages": "10-12", "minutes": 8, "summary": ["Kheyti (India): a low-cost modular 'Greenhouse-in-a-Box' with training and support; farmers grow up to seven times more food with 90% less water (Earthshot Prize winner).", "LLEAF (Australia): light-shifting films that absorb green light and re-emit red light that plants use more efficiently, used from glasshouses to bamboo-frame polytunnels in Indonesia.", "Neruva Technologies (Kenya): aquaponic container 'Ecocapsules' in Nairobi producing up to 20,000 fish and 30,000 lettuce heads a year.", "Intelligent Growth Solutions (UK): pre-built vertical farming towers with integrated controls; its GigaFarm project in the UAE could produce 3 million kg of food, and it supports rather than competes with conventional farmers."], "terms": [{"term": "Modular greenhouse", "def": "A kit-style protected structure that can be assembled and scaled cheaply."}, {"term": "Spectrum-shifting film", "def": "A cover film that converts less useful light wavelengths into ones plants use better."}, {"term": "Closed-loop system", "def": "A system that recycles water and nutrients internally, as in aquaponics."}, {"term": "Vertical growing tower", "def": "A stacked, automated growing unit used in vertical farms."}], "cards": [{"q": "What does Kheyti's Greenhouse-in-a-Box achieve?", "a": "Up to seven times more food using 90% less water."}, {"q": "How does LLEAF's film help plants?", "a": "It absorbs low-value green light and re-emits red light that plants use more efficiently."}, {"q": "What does a Neruva Ecocapsule produce per year?", "a": "Up to 20,000 fish and 30,000 lettuce heads."}, {"q": "Which case study involves a UAE project, and what is its scale?", "a": "Intelligent Growth Solutions' GigaFarm, which could produce 3 million kg of food."}, {"q": "Which case study uses aquaponics?", "a": "Neruva Technolo
