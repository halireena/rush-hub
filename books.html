ional bias and justify statistical tests."}, {"q": "Memory aid for population/sample terms?", "a": "Population-parameter (p); sample-statistic (s)."}, {"q": "Conventional significance threshold?", "a": "P < 0.05."}], "for_rush": "These design basics apply directly to comparing nutrient solutions in her spinach hydroponics.", "priority": "core"}, {"n": 2, "title": "Distributions and Probability", "pdf_pages": "online", "minutes": 50, "summary": ["A sample should be random; even experts pick biased 'representative' plants (taller wheat plants chosen 35 of 36 times).", "Histograms and percentiles describe distributions; quartiles split at 25, 50 and 75%.", "Probability rules: add for mutually exclusive events, multiply for independent events; conditional P(A|B) = P(A and B)/P(B).", "The normal distribution: about 68% within 1 SD and 95% within 2 SD of the mean.", "Z = (x - mu)/sigma converts values to standard units to find probabilities.", "Poisson describes counts of rare events, e.g. yeast cells per grid square."], "terms": [{"term": "Population", "def": "Complete set of units about which inferences are made."}, {"term": "Percentile", "def": "Value below which a given percentage of data lie."}, {"term": "Joint probability", "def": "Probability two independent events both occur."}, {"term": "Conditional probability", "def": "Probability of A given B has occurred."}, {"term": "Z-score", "def": "Number of SDs a value is from the mean."}, {"term": "Poisson distribution", "def": "Discrete distribution of counts of rare events."}], "cards": [{"q": "June high 85.6 F, mean 81.6, SD 3.75. Z?", "a": "(85.6 - 81.6)/3.75 = 1.07."}, {"q": "About what share of a normal distribution lies within 2 SD of the mean?", "a": "About 95%."}, {"q": "Two independent events each with P = 0.6. P(both)?", "a": "0.36."}, {"q": "What lesson came from expert samplers choosing wheat plants?", "a": "Even experts are biased (they chose taller plants); use random sampling."}, {"q": "Excel function for the first quartile?", "a": "=QUARTILE(range, 1)."}, {"q": "Why is the normal distribution so widely used?", "a": "Many variables are near normal and sample means become normal with large samples."}, {"q": "Write the Poisson probability formula.", "a": "P(k) = mu^k e^(-mu) / k!."}], "for_rush": "Random sampling of plants matters for any phenotyping she does, from UAV plots to hydroponic trays.", "priority": "core"}, {"n": 3, "title": "Central Limit Theorem, Confidence Intervals, and Hypothesis Tests", "pdf_pages": "online", "minutes": 45, "summary": ["Means of samples are less variable than individual values; SE = sqrt(S^2/n).", "The central limit theorem: means of large samples are approximately normal even from non-normal populations.", "With known sigma, a 95% CI is mean +/- 1.96 sigma/sqrt(n); a 99% CI uses 2.58.", "A test sets a null (no difference) and an alternative hypothesis.", "Type I error (alpha) rejects a true null; Type II (beta) accepts a false null.", "5% is the usual alpha in agronomy, but other levels (e.g. 20%) can suit low-risk decisions."], "terms": [{"term": "Standard error", "def": "SD of a sample mean, sqrt(S^2/n)."}, {"term": "Central limit theorem", "def": "Sample means tend towards a normal distribution as n grows."}, {"term": "Confidence interval", "def": "Range likely to contain the population mean at a stated confidence."}, {"term": "Null hypothesis", "def": "Statement of no effect or no difference."}, {"term": "Type I error", "def": "Rejecting a true null; probability alpha."}, {"term": "Type II error", "def": "Failing to reject a false null; probability beta."}], "cards": [{"q": "How does the SE change if n increases fourfold?", "a": "It halves (SE proportional to 1/sqrt(n))."}, {"q": "Formula for a 95% CI with known sigma?", "a": "Mean +/- 1.96 x sigma/sqrt(n)."}, {"q": "What multiplier gives a 99% CI?", "a": "2.58."}, {"q": "Why does the CLT matter in practice?", "a": "It lets us use normal-based tests on means even if raw data are not normal."}, {"q": "Define alpha.", "a": "The probability of a Type I error (rejecting a true null)."}, {"q": "Why might a researcher choose alpha = 0.20?", "a": "When missing a real effect costs more than a false alarm and consequences of error are minor."}], "for_rush": "", "priority": "useful"}, {"n": 4, "title": "Categorical Data: Binary", "pdf_pages": "online", "minutes": 45, "summary": ["A binomial setting has fixed trials, two outcomes, independence and constant p.", "P(k successes) = [n!/(k!(n - k)!)] p^k q^(n - k).", "Mean number of successes = np, variance = npq; for a proportion mean = p, variance = pq/n.", "Normal approximation is fine when np >= 5 and nq >= 5; use a continuity correction.", "95% CI for a proportion: p-hat +/- 1.96 sqrt(p-hat q-hat/n).", "Sample size: n = pq/v (or 0.25/v if p is unknown)."], "terms": [{"term": "Binomial distribution", "def": "Number of successes in n independent trials with probability p."}, {"term": "Proportion", "def": "Successes divided by trials."}, {"term": "Continuity correction", "def": "Adding or subtracting 0.5 when approximating a discrete distribution by the normal."}, {"term": "BINOM.DIST", "def": "Excel function for binomial probabilities."}, {"term": "Two-proportion test", "def": "Compares proportions from two independent samples."}], "cards": [{"q": "60 plants per plot, p(lodging) = 0.08. Expected lodged plants and variance?", "a": "Mean 4.8; variance 60 x 0.08 x 0.92 = about 4.4."}, {"q": "When can you use the normal approximation to the binomial?", "a": "When np >= 5 and nq >= 5."}, {"q": "10 plants, p = 0.25 of carrying a gene. P(exactly 2)?", "a": "About 0.28."}, {"q": "Formula for 95% CI of a proportion?", "a": "p-hat +/- 1.96 sqrt(p-hat (1 - p-hat)/n)."}, {"q": "Test statistic for a proportion against p0?", "a": "(p-hat - p0)/sqrt(p0 q0/n)."}, {"q": "Why use 0.25 in n = 0.25/v when p is unknown?", "a": "pq is largest (0.25) at p = 0.5, giving a safe sample size."}], "for_rush": "Germination or disease-incidence percentages in her trials are binomial data.", "priority": "core"}, {"n": 5, "title": "Categorical Data: Multivariate (Chi-square)", "pdf_pages": "online", "minutes": 45, "summary": ["Chi-squared = sum (observed - expected)^2 / expected tests count data against expectations.", "With 1 df, Yates' correction subtracts 0.5 from each absolute difference.", "Testing a 3:1 ratio: 100 green and 100 yellow vs expected 150:50 strongly rejects the ratio.", "Contingency tables: expected = row total x column total / grand total; df = (r - 1)(c - 1).", "Tests of independence ask whether two categorical variables are related.", "Heterogeneity tests check whether several samples can be pooled."], "terms": [{"term": "Chi-squared statistic", "def": "Sum of (O - E)^2/E over categories."}, {"term": "Contingency table", "def": "Cross-tabulation of counts by two classifications."}, {"term": "Yates' correction", "def": "Continuity correction for 1 df chi-squared tests."}, {"term": "Test of independence", "def": "Tests whether row and column classifications are associated."}, {"term": "Heterogeneity chi-squared", "def": "Sum of individual chi-squares minus pooled chi-square."}], "cards": [{"q": "Critical chi-squared at alpha 0.05 with 1 df?", "a": "3.84."}, {"q": "Expected count in a contingency table cell?", "a": "Row total x column total / grand total."}, {"q": "df for a 4 x 2 table?", "a": "(4 - 1)(2 - 1) = 3."}, {"q": "Critical chi-squared at 0.05 with 3 df?", "a": "About 7.81."}, {"q": "Minimum expected count per category usually recommended?", "a": "About 5."}, {"q": "What does a non-significant heterogeneity chi-squared allow?", "a": "Pooling the samples."}, {"q": "200 F2 plants, expected 3:1. Expected counts?", "a": "150 and 50."}], "for_rush": "Chi-squared segregation tests are used to check marker ratios before mapping.", "priority": "core"}, {"n": 6, "title": "Continuous Data: t-tests", "pdf_pages": "online", "minutes": 50, "summary": ["The t distribution is used when the variance is estimated from the sample; it depends on df.", "t = (sample mean - mu)/SE; the same difference gives different t depending on variability.", "Paired t-tests analyse differences within pairs; independent t-tests use SE = sqrt(S1^2/n1 + S2^2/n2).", "Two-tailed tests have no expected direction; one-tailed tests do and have lower critical values.", "Linear additive model: Yij = mu + Ti + error.", "LSD = t x SE of difference gives the smallest significant difference."], "terms": [{"term": "t distribution", "def": "Like the normal but with heavier tails; used when variance is estimated."}, {"term": "Paired t-test", "def": "Test on differences between naturally paired observations."}, {"term": "Independent t-test", "def": "Compares means of two separate groups."}, {"term": "One-tailed test", "def": "Alternative hypothesis specifies a direction."}, {"term": "LSD", "def": "Least significant difference between two means."}], "cards": [{"q": "Difference 250 kg/ha, SE 120, 8 df. Two-tailed critical t = 2.306. Significant?", "a": "No; t = 2.08 < 2.306."}, {"q": "Same data, one-tailed critical t = 1.860. Significant?", "a": "Yes; 2.08 > 1.86."}, {"q": "When should you use a paired t-test?", "a": "When observations are naturally linked, e.g. two treatments in the same block."}, {"q": "SE of difference 3.57, t = 2.571. LSD?", "a": "About 9.18."}, {"q": "Why does a corn trial with SE 750 give t = 0.34 for a 500 kg difference?", "a": "High variability makes the same difference small relative to its error."}, {"q": "How is df defined for a single sample?", "a": "n - 1."}], "for_rush": "Comparing two spinach varieties or two nutrient recipes is a t-test problem.", "priority": "core"}, {"n": 7, "title": "Linear Correlation, Regression and Prediction", "pdf_pages": "online", "minutes": 55, "summary": ["Correlation r (-1 to +1) measures strength and direction of a linear relationship, not cause.", "Regression predicts Y from X: slope b = Sxy/Sxx, intercept a = y-bar - b x-bar.", "Least squares minimises vertical squared distances.", "r^2 is the share of Y variance explained; an F-test checks whether the slope differs from zero.", "Confidence limits for the slope: b +/- t x SE.", "With replicated X values, split residual into pure error and lack of fit to test linearity."], "terms": [{"term": "Pearson r", "def": "Measure of linear association between two variables."}, {"term": "Slope", "def": "Change in Y per unit change in X."}, {"term": "r squared", "def": "Proportion of variation explained by the regression."}, {"term": "Residual", "def": "Observed minus predicted value."}, {"term": "Lack of fit", "def": "Deviation of group means from the fitted line."}], "cards": [{"q": "Correlation vs regression: what is the key difference?", "a": "Correlation measures association; regression gives a predictive equation for Y from X."}, {"q": "Sxy = 218.2, Sxx = 196.4. Slope?", "a": "About 1.11."}, {"q": "r = 0.79. What share of variance is explained?", "a": "r^2 = about 0.62 (62%)."}, {"q": "What is the null hypothesis in regression ANOVA?", "a": "The slope is zero."}, {"q": "df for regression and residual with n = 10?", "a": "1 and 8."}, {"q": "Does a high r prove causation?", "a": "No; it shows linear association only."}], "for_rush": "Regressing yield on EC or nitrate concentration in her hydroponics uses exactly this.", "priority": "core"}, {"n": 8, "title": "The Analysis of Variance (ANOVA)", "pdf_pages": "online", "minutes": 55, "summary": ["ANOVA splits total variation into treatment and error (unexplained) variation.", "Correction factor CF = (sum x)^2/n; treatment SS = sum(T^2/r) - CF; total SS = sum x^2 - CF.", "MS = SS/df and F = treatment MS / error MS.", "In a completely randomised design, df treatment = t - 1, error = T - t, total = T - 1.", "Corn density trial: F = 19.2 > critical 5.14, so densities differ.", "In R: aov(yield ~ factor) then summary()."], "terms": [{"term": "ANOVA", "def": "Method partitioning variation to test treatment effects."}, {"term": "Sum of squares", "def": "Sum of squared deviations."}, {"term": "Mean square", "def": "SS divided by its df."}, {"term": "F-ratio", "def": "Treatment MS divided by error MS."}, {"term": "CRD", "def": "Completely randomised design."}], "cards": [{"q": "Write the correction factor.", "a": "CF = (sum of all observations)^2 / n."}, {"q": "3 treatments x 3 reps in a CRD. df for treatment, error, total?", "a": "2, 6, 8."}, {"q": "What does a large F mean?", "a": "Treatment variation is large relative to background error, suggesting real differences."}, {"q": "Is 'error' a mistake?", "a": "No, it is natural unexplained variation among experimental units."}, {"q": "Write the CRD linear model.", "a": "Yij = mu + Ti + e(i)j."}, {"q": "Which R function fits an ANOVA?", "a": "aov()."}], "for_rush": "ANOVA is the standard test for her variety or nutrient trials.", "priority": "core"}, {"n": 9, "title": "Two Factor ANOVAs", "pdf_pages": "online", "minutes": 50, "summary": ["Factorial experiments test two factors together and reveal interactions using the same number of plots.", "An interaction is a different response to one factor at different levels of another; crossover interaction changes rankings.", "Model: Yijk = mu + Ai + Bj + ABij + error.", "df: A = a - 1, B = b - 1, AB = (a - 1)(b - 1), error = ab(r - 1).", "If the interaction is significant, analyse simple effects rather than main effects.", "interaction.plot() in R visualises interactions."], "terms": [{"term": "Factorial experiment", "def": "All combinations of levels of two or more factors."}, {"term": "Main effect", "def": "Average effect of one factor across levels of others."}, {"term": "Interaction", "def": "Effect of one factor depends on the level of another."}, {"term": "Crossover interaction", "def": "Interaction where rankings reverse."}, {"term": "Simple effect", "def": "Effect of one factor at a single level of another."}], "cards": [{"q": "3 hybrids x 3 locations x 3 reps. df for interaction and error?", "a": "Interaction 4; error 18."}, {"q": "Why prefer a factorial over separate single-factor trials?", "a": "Same plots give information on both factors and their interaction."}, {"q": "Interaction significant (p = 0.03) but main effects not. What next?", "a": "Test simple effects, e.g. location effect within each hybrid."}, {"q": "What is a crossover interaction?", "a": "Treatment rankings change between levels of the other factor."}, {"q": "Write the two-factor model.", "a": "Yijk = mu + Ai + Bj + ABij + e(ij)k."}, {"q": "Why randomise within a factorial CRD?", "a": "So every unit has an equal chance of any treatment combination, avoiding bias."}], "for_rush": "Variety x salinity interactions are the core question for UAE saline agriculture trials.", "priority": "core"}, {"n": 10, "title": "Mean Comparisons", "pdf_pages": "online", "minutes": 55, "summary": ["After a significant F, compare means with LSD, Tukey's HSD, planned contrasts or trend analysis.", "LSD = t x sqrt(2 S^2/r); use only for planned or adjacent comparisons.", "Using LSD on the extreme pair inflates Type I error: about 90% with 20 varieties.", "Tukey's HSD is more conservative and controls experiment-wise error.", "Contrasts are weighted sums of means whose coefficients sum to zero; orthogonal contrasts are independent.", "For quantitative factors, use linear (-1, 0, 1) and quadratic (-1, 2, -1) trend contrasts."], "terms": [{"term": "LSD", "def": "Least significant difference between two means."}, {"term": "Tukey's HSD", "def": "Honestly significant difference controlling experiment-wise error."}, {"term": "Contrast", "def": "Linear combination of means with coefficients summing to zero."}, {"term": "Orthogonal contrasts", "def": "Contrasts whose coefficient products sum to zero."}, {"term": "Trend analysis", "def": "Testing linear or curved responses to a quantitative factor."}], "cards": [{"q": "Formula for LSD in an RCBD?", "a": "t x sqrt(2 x error MS / r)."}, {"q": "Why is comparing the best and worst of 20 varieties with LSD risky?", "a": "Type I error rises to about 90%."}, {"q": "Which is more conservative, LSD or HSD?", "a": "Tukey's HSD."}, {"q": "Coefficients for linear and quadratic trends with 3 equally spaced levels?", "a": "Linear -1, 0, +1; quadratic -1, +2, -1."}, {"q": "Two rules for contrast coefficients?", "a": "They sum to zero; for orthogonality, products of paired coefficients sum to zero."}, {"q": "Means 70, 57, 64; contrast mean1 vs average of others. L?", "a": "70 - 0.5(57) - 0.5(64) = 5.5."}], "for_rush": "Choosing the best nutrient dose is a trend-analysis question rather than pairwise LSD.", "priority": "core"}, {"n": 11, "title": "Randomized Complete Block Design", "pdf_pages": "online", "minutes": 55, "summary": ["Field gradients (soil, slope) inflate error; blocking groups similar plots.", "Each treatment appears once per block, randomised separately within each block.", "RCBD ANOVA: block df = b - 1, treatment df = t - 1, error df = (t - 1)(b - 1).", "Block SS = sum(B^2/t) - CF; the block x treatment interaction serves as error.", "Relative efficiency compares RCBD with a CRD; >100% means blocking helped (corn example 115%).", "Red clover trial: 10 cultivars in 4 blocks; LSD separated three yield groups."], "terms": [{"term": "Block", "def": "Group of homogeneous experimental units containing every treatment."}, {"term": "RCBD", "def": "Randomised complete block design."}, {"term": "Restriction on randomisation", "def": "Every treatment must appear in every block."}, {"term": "Blocking efficiency", "def": "Precision of RCBD relative to CRD."}, {"term": "Production gradient", "def": "Systematic change in yield potential across a field."}], "cards": [{"q": "How should blocks be laid out relative to a gradient?", "a": "Perpendicular to the gradient so each block is uniform within."}, {"q": "3 treatments in 3 blocks: error df?", "a": "(3 - 1)(3 - 1) = 4."}, {"q": "What serves as the error term in an RCBD?", "a": "The block x treatment interaction."}, {"q": "Blocking efficiency of 115% means what?", "a": "Blocking gave about 15% more precision than a CRD."}, {"q": "Cost of blocking?", "a": "Fewer error degrees of freedom."}, {"q": "How is randomisation done in an RCBD?", "a": "Separately within each block."}], "for_rush": "Blocking for light or temperature gradients in a greenhouse or hydroponic rack follows the same logic.", "priority": "core"}, {"n": 12, "title": "Data Transformation", "pdf_pages": "online", "minutes": 45, "summary": ["ANOVA assumes normal, independent errors, equal variances and additivity.", "Bartlett's test checks equal variances across treatments.", "Log transformation when SD is proportional to the mean (multiplicative effects).", "Square-root transformation for Poisson counts where variance equals the mean.", "Arcsine square-root transformation for percentages and proportions.", "Back-transform means for reporting; germination example became valid after arcsine transformation."], "terms": [{"term": "Homogeneity of variance", "def": "Equal error variance across treatments."}, {"term": "Bartlett's test", "def": "Chi-squared test for equal variances."}, {"term": "Log transformation", "def": "ln(y), for multiplicative effects."}, {"term": "Square-root transformation", "def": "sqrt(y), for counts."}, {"term": "Arcsine transformation", "def": "arcsin(sqrt(p)), for proportions."}], "cards": [{"q": "Which transformation suits insect counts per plant?", "a": "Square root."}, {"q": "Which transformation suits percentage germination?", "a": "Arcsine square root."}, {"q": "Which suits data where SD rises in proportion to the mean?", "a": "Natural log."}, {"q": "Name the three ANOVA assumptions.", "a": "Normal independent errors, homogeneous variance, additivity."}, {"q": "What does Bartlett's test check?", "a": "Whether treatment variances are equal."}, {"q": "Why back-transform means?", "a": "To report results in original units."}], "for_rush": "Germination and disease percentages from her trials need arcsine or similar handling.", "priority": "core"}, {"n": 13, "title": "Multiple Regression", "pdf_pages": "online", "minutes": 55, "summary": ["Multiple regression models one Y from several X variables: Y = a + b1x1 + b2x2 + ... + e.", "Partial correlation shows the X-Y relationship with other variables held constant and can reveal hidden effects.", "R^2 always rises when terms are added; adjusted R^2 penalises extra terms.", "Polynomial terms (x^2, x^3) capture curved responses; test each higher order with an F-test.", "Watch for autocorrelation, heteroscedasticity and multicollinearity.", "Treating factors as categorical can fit non-linear responses much better than linear terms."], "terms": [{"term": "Partial regression coefficient", "def": "Effect of one X on Y holding other Xs constant."}, {"term": "Partial correlation", "def": "Correlation of two variables with others held constant."}, {"term": "Adjusted R squared", "def": "R squared corrected for number of terms."}, {"term": "Multicollinearity", "def": "Strong correlation among predictors."}, {"term": "Autocorrelation", "def": "Correlation of residuals over time or space."}], "cards": [{"q": "Why use adjusted R^2 to compare models?", "a": "It penalises extra terms, so it doesn't automatically rise as predictors are added."}, {"q": "Symptom of multicollinearity?", "a": "High R^2 but non-significant individual coefficients."}, {"q": "Rainfall-runoff: linear R^2 0.65, quadratic 0.92, cubic term p = 0.28. Best model?", "a": "Quadratic."}, {"q": "Barley: yield vs days to maturity looked weak (r = -0.23) but partial r = -0.70. Why?", "a": "Holding infection constant removed noise and revealed the maturity effect."}, {"q": "How can autocorrelation be fixed in time series?", "a": "Differencing or modelling the correlation."}, {"q": "Should replicate or line IDs be numeric or factors?", "a": "Factors."}], "for_rush": "Modelling yield from EC, pH and temperature together is a multiple regression.", "priority": "useful"}, {"n": 14, "title": "Nonlinear Regression", "pdf_pages": "online", "minutes": 45, "summary": ["Many crop responses are curvilinear; polynomials fit but often lack biological meaning.", "Some models can be linearised: Y = ax^b becomes log Y = log a + b log x.", "Monomolecular Y = a(1 - b e^(-cx)) gives diminishing returns, e.g. fertiliser response.", "Logistic and Gompertz curves describe growth over time with an asymptote.", "Fit with non-linear least squares (nls in R), which iterates from starting values.", "Choose models by error MS or R^2 and by biological justification."], "terms": [{"term": "Asymptote", "def": "Value approached but never reached."}, {"term": "Linearisation", "def": "Transforming a non-linear model into linear form."}, {"term": "Monomolecular model", "def": "Diminishing-returns curve."}, {"term": "Logistic model", "def": "S-shaped growth curve with upper limit a."}, {"term": "nls", "def": "R function for non-linear least squares."}], "cards": [{"q": "Which model suits fertiliser response with diminishing returns?", "a": "Monomolecular."}, {"q": "Which models suit growth over time?", "a": "Logistic or Gompertz."}, {"q": "How do you linearise Y = ax^b?", "a": "Take logs: log Y = log a + b log x."}, {"q": "What do residual plots showing a pattern after a linear fit suggest?", "a": "The relationship is non-linear; try a transformation or curve."}, {"q": "Why are biologically meaningful models preferred over polynomials?", "a": "Their parameters (asymptote, rate) can be interpreted."}, {"q": "What does nls need to start?", "a": "Starting values for the parameters."}], "for_rush": "Spinach biomass growth curves in hydroponics are a natural fit for logistic models.", "priority": "useful"}]}, {"slug": "isu_quantgenetics", "short": "Quantitative Genetics for Plant Breeding", "emoji": "📊", "color": "#805ad5", "warn": "Pairs with your GWAS work.", "title": "Quantitative Genetics for Plant Breeding", "authors": "Walter Suza and Kendall Lamkey (eds.); chapters by William Beavis, Kendall Lamkey, Anthony Assibi Mahama and others", "edition": "2023, Iowa State University Digital Press", "file": "", "url": "https://iastate.pressbooks.pub/quantitativegenetics/", "licence": "CC BY-NC 4.0", "overview": "A graduate-level open text linking population genetics to plant breeding decisions: gene frequencies, linkage disequilibrium, relationships, gene effects, variance components, heritability, mating designs, selection response, GxE, index selection, mixed models (BLUP) and simulation.", "how": "Read chapters 1, 5, 6, 9 and 12 closely (frequencies, gene effects, variance, selection response, mixed models); they underpin GWAS and genomic selection. Rework each formula with the worked numbers.", "free": true, "chapters": [{"n": 1, "title": "Gene Frequencies", "pdf_pages": "online", "minutes": 70, "summary": ["The Ideal Population is infinitely large, randomly mating, with no migration, mutation or selection.", "p = P(AA) + 1/2 P(Aa); under HWE genotypes are p^2, 2pq, q^2, reached after one generation of random mating.", "Sampling variance of allele frequency is p0q0/2N, so small populations drift more.", "Migration: q1 = m qm + (1 - m) q0; recurrent mutation equilibrium q = u/(u + v).", "Selection against recessives: delta q = s q^2 (1 - q)/(1 - s q^2).", "Inbreeding: Ft = 1/2N + (1 - 1/2N)Ft-1; genotype frequencies AA = p^2(1 - F) + pF."], "terms": [{"term": "Ideal population", "def": "Theoretical large random-mating population without disturbing forces."}, {"term": "Disequilibrium coefficient", "def": "D = P(AA) - p^2, deviation from HWE."}, {"term": "Fitness", "def": "Relative ability to survive and reproduce."}, {"term": "Selection coefficient (s)", "def": "Proportional reduction in gametic contribution of a genotype."}, {"term": "Identical by descent", "def": "Alleles copied from one ancestral allele."}, {"term": "Delta F", "def": "Rate of inbreeding, 1/2N per generation."}], "cards": [{"q": "SD of allele frequency after one generation with q = 0.5 and N = 50?", "a": "sqrt(0.25/100) = 0.05."}, {"q": "Same with N = 4?", "a": "sqrt(0.25/8) = about 0.18, showing much more drift."}, {"q": "How many generations of random mating restore HWE at one locus?", "a": "One."}, {"q": "Write the inbreeding recurrence.", "a": "Ft = 1/2N + (1 - 1/2N) Ft-1."}, {"q": "Probability a single new mutant is lost if its carrier has k offspring?", "a": "(1/2)^k."}, {"q": "Systematic vs dispersive forces?", "a": "Systematic (migration, mutation, selection) are predictable in direction and size; drift is predictable only in size."}, {"q": "Assortative mating raises which genotypes?", "a": "Homozygotes."}], "for_rush": "These are the population models behind allele frequency filters and inbreeding in breeding datasets.", "priority": "core"}, {"n": 2, "title": "Linkage", "pdf_pages": "online", "minutes": 45, "summary": ["Linkage and linkage disequilibrium are properties of populations, not individuals.", "Gametic disequilibrium is multi-locus disequilibrium when chromosome positions are unknown; linkage disequilibrium when loci are on the same chromosome.", "D-hat AB = p-hat AB - p-hat A p-hat B; test with chi-squared = 2nD^2 / [pA(1 - pA)pB(1 - pB)].", "Disequilibrium decays as Dt = D0(1 - c)^t, slowly for tightly linked loci.", "Selfing, drift, selection, mixing and migration create disequilibrium.", "Selection creates negative covariance between unlinked favourable alleles (the Bulmer effect)."], "terms": [{"term": "Linkage disequilibrium", "def": "Non-random association of alleles at linked loci."}, {"term": "Gametic disequilibrium", "def": "Non-random multi-locus association regardless of position."}, {"term": "Recombination frequency (c)", "def": "Probability of a recombinant gamete between two loci."}, {"term": "Bulmer effect", "def": "Reduction in genetic variance from selection-induced negative covariance."}, {"term": "Marker", "def": "Detectable DNA variant used to track nearby loci."}], "cards": [{"q": "For unlinked loci, how fast does D decay?", "a": "It halves each generation (c = 0.5)."}, {"q": "Why can markers help select hard-to-measure traits?", "a": "Markers in LD with QTL can predict the trait cheaply (Sax 1923 idea)."}, {"q": "Why is LD a population property?", "a": "It describes allele associations across many gametes in a population, not within one plant."}, {"q": "Name two forces that create LD.", "a": "Drift, selection, mixing of populations, migration or selfing."}, {"q": "How does LD at one locus pair differ from HWE recovery?", "a": "HWE is restored in one generation; LD needs many generations of recombination."}, {"q": "Write the estimator of D for two loci.", "a": "D = pAB - pA x pB."}], "for_rush": "LD extent sets SNP density and interpretation in her GWAS projects.", "priority": "core"}, {"n": 3, "title": "Resemblance Between Relatives", "pdf_pages": "online", "minutes": 50, "summary": ["The coefficient of inbreeding measures reduction in heterozygosity relative to a defined reference population.", "Coefficient of parentage (coancestry) is the probability that random alleles from X and Y are identical by descent.", "Selfing: F of offspring = 1/2(1 + F of parent).", "The panmictic index P = 1 - F halves with each selfing generation.", "Full-sib mating raises F more slowly than selfing.", "All coefficients are meaningless without a stated base population."], "terms": [{"term": "Coefficient of coancestry", "def": "Probability that alleles drawn at random from two individuals are IBD."}, {"term": "Panmictic index", "def": "P = 1 - F."}, {"term": "Base population", "def": "Reference population assumed non-inbred and unrelated."}, {"term": "IBD", "def": "Identical by descent."}, {"term": "Full sibs", "def": "Offspring sharing both parents."}], "cards": [{"q": "F of the selfed progeny of a non-inbred plant?", "a": "0.5."}, {"q": "F of the selfed progeny of a plant with F = 0.5?", "a": "0.75."}, {"q": "Coancestry of an individual with itself (non-inbred)?", "a": "0.5 (equal to 1/2(1 + F))."}, {"q": "Why must a reference population be defined?", "a": "Coefficients measure IBD relative to it; without one they have no meaning."}, {"q": "Which raises inbreeding faster, selfing or full-sib mating?", "a": "Selfing."}, {"q": "Coancestry of F1 offspring from unrelated parents A1A2 x A3A4 with itself (F1 non-inbred)?", "a": "0.5."}], "for_rush": "Pedigree relationships feed the A-matrix used in BLUP genomic prediction.", "priority": "core"}, {"n": 4, "title": "Measures of Similarity", "pdf_pages": "online", "minutes": 50, "summary": ["The numerator relationship matrix (A matrix) holds twice the coancestry for every pair from pedigrees.", "The tabular method fills the A matrix in order, parents before offspring.", "Realised kinship from markers scores shared alleles (2, 1, 0) and averages across loci.", "Genetic distances (Nei, Cavalli-Sforza, Reynolds) rest on different evolutionary assumptions.", "PCA on markers reveals population structure; in 1,816 barley lines PC1 and PC2 separated 2-row/6-row and spring/winter types.", "k-means and hierarchical clustering (e.g. Ward's) group genotypes."], "terms": [{"term": "A matrix", "def": "Numerator relationship matrix from pedigree; A(x,y) = 2 x coancestry."}, {"term": "Realised kinship", "def": "Relationship estimated from marker data."}, {"term": "Identical in state", "def": "Alleles alike regardless of ancestry."}, {"term": "Nei's distance", "def": "Genetic distance assuming neutral mutation-drift equilibrium."}, {"term": "Population structure", "def": "Subgroups within a breeding population."}], "cards": [{"q": "Relationship between A matrix and coancestry?", "a": "A(x,y) = 2 x coancestry(x,y)."}, {"q": "How is marker similarity scored per locus?", "a": "2 if both alleles shared, 1 if one, 0 if none."}, {"q": "Pedigree vs marker relationships: IBD or IBS?", "a": "Pedigree gives expected IBD; markers measure identity in state (realised)."}, {"q": "Why check population structure before a GWAS?", "a": "Structure causes false associations unless modelled."}, {"q": "What did PCA reveal in barley lines?", "a": "Clusters matching row type (2-row/6-row) and growth habit (spring/winter)."}, {"q": "Hierarchical clustering method that minimises within-cluster variance?", "a": "Ward's method."}], "for_rush": "Kinship and PCA covariates are what she fits in mixed-model GWAS (e.g. GAPIT).", "priority": "core"}, {"n": 5, "title": "Gene Effects", "pdf_pages": "online", "minutes": 70, "summary": ["P = G + E; genotypic values coded AA = +a, Aa = d, aa = -a around the mid-homozygote.", "Population mean = mh + a(p - q) + 2pqd.", "Parents pass alleles, not genotypes, so we use average allele effects.", "Average effect of substitution alpha = a + d(q - p); it depends on allele frequency.", "Breeding values: AA = 2q alpha, Aa = (q - p) alpha, aa = -2p alpha.", "Dominance deviation = genotypic value - breeding value; epistasis adds interlocus deviations."], "terms": [{"term": "a", "def": "Half the difference between homozygotes."}, {"term": "d", "def": "Heterozygote deviation from the mid-homozygote."}, {"term": "Average effect", "def": "Mean deviation of offspring receiving a given allele."}, {"term": "Allele substitution effect (alpha)", "def": "a + d(q - p)."}, {"term": "Breeding value", "def": "Value judged by mean of progeny; sum of average effects."}, {"term": "Dominance deviation", "def": "Genotypic value minus breeding value."}], "cards": [{"q": "p = 0.8, a = 8, d = 4, mh = 8. Population mean?", "a": "8 + 8(0.6) + 2(0.8)(0.2)(4) = 14.08."}, {"q": "Allele substitution effect with a = 8, d = 4, p = 0.8, q = 0.2?", "a": "alpha = 8 + 4(0.2 - 0.8) = 5.6."}, {"q": "Breeding value of AA with q = 0.2 and alpha = 5.6?", "a": "2 x 0.2 x 5.6 = 2.24."}, {"q": "When is dominance deviation zero?", "a": "When d = 0 (purely additive locus)."}, {"q": "Why are average effects not fixed properties of a gene?", "a": "They depend on allele frequencies and so on the population."}, {"q": "Mean breeding value in a random-mating population?", "a": "Zero."}, {"q": "d > a in magnitude indicates what?", "a": "Overdominance."}], "for_rush": "SNP effect estimates in GWAS are allele substitution effects as defined here.", "priority": "core"}, {"n": 6, "title": "Components of Variance", "pdf_pages": "online", "minutes": 60, "summary": ["VP = VG + VE (+ 2Cov(G,E) if not independent); VG = VA + VD + VI.", "Broad-sense H = VG/VP; narrow-sense h^2 = VA/VP.", "VA is the variance of breeding values; for a single locus VA = 2pq alpha^2 and VD = (2pqd)^2.", "All variance components depend on allele frequencies, so estimates are population-specific.", "Additive variance does not imply additive gene action: dominance and epistasis contribute to VA.", "Even a purely epistatic two-locus example produced substantial additive variance."], "terms": [{"term": "Additive variance (VA)", "def": "Variance of breeding values."}, {"term": "Dominance variance (VD)", "def": "Variance of dominance deviations."}, {"term": "Epistatic variance (VI)", "def": "Variance from interactions between loci."}, {"term": "Broad-sense heritability", "def": "VG/VP."}, {"term": "Narrow-sense heritability", "def": "VA/VP."}], "cards": [{"q": "Write VA for one locus.", "a": "VA = 2pq alpha^2."}, {"q": "Write VD for one locus.", "a": "VD = (2pqd)^2."}, {"q": "Why can't you transfer a heritability estimate between populations?", "a": "Variance components depend on allele frequencies in each population."}, {"q": "Does high VA prove additive gene action?", "a": "No; dominance and epistasis also generate additive variance."}, {"q": "Partition VP fully.", "a": "VP = VA + VD + VI + VE."}, {"q": "Narrow-sense vs broad-sense heritability formulas?", "a": "h^2 = VA/VP; H = VG/VP."}], "for_rush": "SNP-based heritability from GWAS models estimates VA in this sense.", "priority": "core"}, {"n": 7, "title": "Estimates of Variance", "pdf_pages": "online", "minutes": 70, "summary": ["Covariance among relatives equals the variance among their group means, which lets ANOVA estimate genetic variances.", "Half-sib covariance = 1/4 VA; full-sib = 1/2 VA + 1/4 VD.", "F2 genetic variance = 1/2 a^2 + 1/4 d^2 per locus (VA + VD).", "Expected mean squares (EMS) link ANOVA lines to variance components; a five-step algorithm derives them.", "Entry-mean heritability divides error and GxE variance by reps and environments.", "Assumptions: diploid, no environmental correlation, linkage equilibrium, non-inbred random relatives."], "terms": [{"term": "Expected mean square", "def": "Variance components that a mean square estimates."}, {"term": "Half-sib family", "def": "Progeny sharing one parent."}, {"term": "Entry-mean heritability", "def": "Heritability of genotype means over reps and environments."}, {"term": "Method of moments", "def": "Equating observed mean squares to EMS to solve for components."}, {"term": "Random vs fixed factor", "def": "Levels sampled from a population vs chosen levels of interest."}], "cards": [{"q": "Covariance of half sibs?", "a": "1/4 VA."}, {"q": "Covariance of full sibs?", "a": "1/2 VA + 1/4 VD."}, {"q": "Genotype EMS in a single-environment trial with r reps?", "a": "sigma^2 e + r sigma^2 g."}, {"q": "How do you estimate sigma^2 g from that ANOVA?", "a": "(MS genotype - MS error)/r."}, {"q": "Why does entry-mean heritability rise with more reps?", "a": "Error variance is divided by the number of reps (and environments)."}, {"q": "EMS for GxE in a multi-environment trial with R reps?", "a": "sigma^2 + R sigma^2 GE."}], "for_rush": "Variance component estimation from trial ANOVA is a core skill for breeding data analyst jobs.", "priority": "core"}, {"n": 8, "title": "Mating Designs", "pdf_pages": "online", "minutes": 60, "summary": ["Mating designs estimate genetic variances or combining abilities in a reference population.", "A diallel crosses all parents: n(n - 1)/2 crosses without reciprocals (45 for 10 parents).", "GCA is a parent's average performance in crosses; SCA is a cross's deviation from what GCA predicts.", "NC Design I nests females within males; male variance = 1/4 VA (non-inbred).", "NC Design II is factorial; male x female interaction = 1/4 VD (non-inbred).", "NC Design III backcrosses F2 plants to both parents to test the degree of dominance."], "terms": [{"term": "Diallel", "def": "All possible crosses among a set of parents."}, {"term": "GCA", "def": "General combining ability; average performance of a parent in crosses."}, {"term": "SCA", "def": "Specific combining ability; deviation of a particular cross."}, {"term": "NC Design I", "def": "Nested design: different females per male."}, {"term": "NC Design II", "def": "Factorial design: each male crossed to the same females."}], "cards": [{"q": "Crosses in a 10-parent diallel without reciprocals?", "a": "45."}, {"q": "With reciprocals?", "a": "90."}, {"q": "GCA vs SCA: which reflects mostly additive effects?", "a": "GCA."}, {"q": "In NC II with non-inbred parents, how is VD estimated?", "a": "VD = 4 x sigma^2 (male x female)."}, {"q": "In NC I with non-inbred parents, VA = ?", "a": "4 x sigma^2 male."}, {"q": "Purpose of NC Design III?", "a": "Estimating the average degree of dominance in an F2."}], "for_rush": "GCA/SCA testing underlies hybrid seed development in vegetable companies.", "priority": "core"}, {"n": 9, "title": "Selection Response", "pdf_pages": "online", "minutes": 70, "summary": ["Selection differential S = mean of selected - population mean; standardised i = S/sigma_P.", "Breeder's equation (Lush 1940): R = h^2 S = i h^2 sigma_P.", "Plant breeders use entry-mean heritability H = VG/(VG + VGE/E + Ve/rE), which grows with reps and environments.", "Hanson's view: heritability is the fraction of the selection differential gained for a defined selection and response unit.", "Realised gains are usually smaller than predicted (epistatic bias, environment, relationships).", "Method of moments works for balanced data; REML is preferred for unbalanced trials."], "terms": [{"term": "Selection intensity (i)", "def": "Selection differential in SD units."}, {"term": "Realised heritability", "def": "Observed response divided by selection differential."}, {"term": "Selection unit", "def": "What is selected (plant, plot, family mean)."}, {"term": "Response unit", "def": "What the gain is measured on (e.g. outbred progeny)."}, {"term": "REML", "def": "Restricted maximum likelihood estimation of variance components."}], "cards": [{"q": "Write the breeder's equation in terms of i.", "a": "R = i h^2 sigma_P."}, {"q": "How can a breeder raise entry-mean heritability?", "a": "Add replications and especially environments."}, {"q": "Why are realised gains smaller than predicted?", "a": "Bias from epistasis and environment, and imperfect relationships between selection and response units."}, {"q": "When should REML replace method of moments?", "a": "When data are unbalanced (missing plots, unequal replication)."}, {"q": "What four things should accompany a heritability estimate?", "a": "Reference genotypes, target environments, selection units and response units."}, {"q": "Write the standardised selection differential.", "a": "i = S/sigma_P."}], "for_rush": "Genetic gain calculations are central to genomic selection and breeding analytics jobs.", "priority": "core"}, {"n": 10, "title": "G x E", "pdf_pages": "online", "minutes": 55, "summary": ["P = mu + G + E + GE; environments include micro (plot) and macro (site-year) effects.", "Allard and Bradshaw classed two-genotype, two-environment responses, from no interaction to crossover and 'racehorse' patterns.", "GxE splits into heterogeneous genotypic variance and lack of correlation (rank changes); in a realistic example rank changes explained 82%.", "Pattern analysis (cluster analysis, PCA, AMMI) handles many genotypes and environments.", "Variation flux: narrowing target environments raises genetic variance but reduces breadth of adaptation.", "REML mixed models handle unbalanced multi-environment data."], "terms": [{"term": "GxE interaction", "def": "Genotypes respond differently across environments."}, {"term": "Crossover interaction", "def": "Genotype rankings change between environments."}, {"term": "Racehorse genotype", "def": "Excels in good conditions, fails under stress."}, {"term": "AMMI", "def": "Additive main effects and multiplicative interaction model."}, {"term": "Macro-environment", "def": "General environment of a site over a period."}], "cards": [{"q": "Which GxE component matters more to breeders: scale changes or rank changes?", "a": "Rank changes (lack of correlation), because they alter which genotype is best."}, {"q": "Write the model with interaction.", "a": "Pij = mu + Gi + Ej + GEij."}, {"q": "What is a 'racehorse' response?", "a": "High yield in favourable conditions but poor under stress."}, {"q": "Name two pattern analysis methods for GxE.", "a": "Cluster analysis, PCA or AMMI."}, {"q": "What is the trade-off in variation flux?", "a": "Homogeneous target environments raise genetic variance but narrow adaptation."}, {"q": "Phenotypic variance of entry means across e environments and r reps?", "a": "sigma^2 g + sigma^2 ge/e + sigma^2 error/(e r)."}], "for_rush": "Cultivars for UAE heat and salinity must be judged under GxE, not from temperate trials alone.", "priority": "core"}, {"n": 11, "title": "Multiple Trait Selection", "pdf_pages": "online", "minutes": 50, "summary": ["Breeders select several traits via multistage, tandem, independent culling or index selection.", "Tandem selection improves one trait at a time; independent culling sets minimum thresholds for each trait.", "A selection index I = sum biPi predicts net merit H = sum aiGi using economic weights.", "Smith-Hazel index weights solve Pb = Ga; expected gain = k r_IH sigma_H.", "Alternatives: base index (b = a), desired gains index, restricted index, multiplicative and rank-summation indices.", "Maximising the index-merit correlation maximises gain."], "terms": [{"term": "Tandem selection", "def": "Selecting traits one after another."}, {"term": "Independent culling", "def": "Rejecting individuals below a threshold for any trait."}, {"term": "Selection index", "def": "Weighted combination of trait values."}, {"term": "Economic weight", "def": "Relative value of a unit change in a trait."}, {"term": "Restricted index", "def": "Index holding gain in one trait at zero."}], "cards": [{"q": "Smith-Hazel normal equations?", "a": "P b = G a (phenotypic covariance x weights = genetic covariance x economic values)."}, {"q": "Expected gain in merit from index selection?", "a": "Delta H = k r_IH sigma_H."}, {"q": "What is the downside of independent culling?", "a": "A plant excellent in one trait is lost if slightly below threshold in another."}, {"q": "What does a rank-summation index avoid?", "a": "Estimating genetic parameters; it sums trait ranks."}, {"q": "When is a desired-gains index used?", "a": "When breeders know target gains but not economic weights."}, {"q": "What is tandem selection?", "a": "Improving one trait to the target, then moving to the next."}], "for_rush": "Combining yield, salt tolerance and quality is a multi-trait index problem for desert crops.", "priority": "useful"}, {"n": 12, "title": "Multi Environment Trials: Linear Mixed Models", "pdf_pages": "online", "minutes": 65, "summary": ["Mixed models handle unbalanced multi-environment trials better than general linear models.", "Henderson's shrinkage pulls genotype predictions towards the mean by a factor related to heritability.", "Fixed effects are estimated as BLUEs; random effects are predicted as BLUPs.", "Model: Y = X beta + Z u + e, solved via Henderson's mixed model equations.", "Relationship (A) matrices let relatives share information.", "Variance components (usually by REML) must be estimated first, so BLUPs are approximations."], "terms": [{"term": "Fixed effect", "def": "Effect whose levels are of direct interest (e.g. environments, treatments)."}, {"term": "Random effect", "def": "Effect with levels drawn from a distribution, with a covariance structure."}, {"term": "BLUE", "def": "Best linear unbiased estimator of fixed effects."}, {"term": "BLUP", "def": "Best linear unbiased predictor of random effects."}, {"term": "Shrinkage", "def": "Pulling noisy estimates towards the population mean."}], "cards": [{"q": "BLUE vs BLUP?", "a": "BLUEs estimate fixed effects; BLUPs predict random effects such as breeding values."}, {"q": "Why are BLUPs shrunk towards the mean?", "a": "Genotypes with less or noisier data are less trustworthy, so they are pulled more."}, {"q": "Write the mixed model.", "a": "Y = X beta + Z u + e."}, {"q": "Why are BLUPs only approximations in practice?", "a": "The variance components needed are themselves estimated."}, {"q": "Shrinkage factor for a genotype mean over r reps?", "a": "sigma^2 g / (sigma^2 g + sigma^2 e/r)."}, {"q": "Are environments usually fixed or random in Henderson-style MET models?", "a": "Often fixed; genotypes are treated as random."}], "for_rush": "BLUP and mixed models are the engine of genomic selection jobs in seed companies.", "priority": "core"}, {"n": 13, "title": "Simulation Modeling", "pdf_pages": "online", "minutes": 55, "summary": ["Simulation lets breeders test analyses and strategies before costly experiments.", "Core elements: genetic architecture, structure of segregating generations, genome organisation.", "Assign genotypes with uniform random numbers and HWE frequencies (p(g) = 0.3 gives gg 0.09, tg 0.42, tt 0.49).", "Phenotype = mu + G + e, with e drawn from N(0, sigma_e); choose a from VA = 2pq a^2.", "Recombinant inbred lines (F5, F = 0.875) and testcrosses change the variance formulas.", "'All models are wrong; some are useful' (Box)."], "terms": [{"term": "In silico simulation", "def": "Computer model of a breeding population."}, {"term": "Genetic architecture", "def": "Number, effects and frequencies of loci affecting a trait."}, {"term": "RIL", "def": "Recombinant inbred line from repeated selfing."}, {"term": "Testcross", "def": "Cross of lines to a common tester."}, {"term": "NORMINV(RAND())", "def": "Excel draw from a normal distribution."}], "cards": [{"q": "Allele frequency 0.3 for g. HWE genotype frequencies?", "a": "gg 0.09, gt 0.42, tt 0.49."}, {"q": "VG = 49 in an F2 (p = q = 0.5). Value of a?", "a": "sqrt(49/0.5) = 9.9."}, {"q": "Inbreeding coefficient of F5 RILs?", "a": "0.875."}, {"q": "Why simulate before field trials?", "a": "To compare strategies cheaply and check analysis methods."}, {"q": "How is environmental noise simulated in Excel?", "a": "=NORMINV(RAND(), 0, sigma_e)."}, {"q": "Why simulate several loci rather than one?", "a": "Quantitative traits are polygenic; effects are split across QTL."}], "for_rush": "Simulating breeding populations in R/Python is a strong portfolio project for her.", "priority": "useful"}]}, {"slug": "msmb", "short": "Modern Statistics for Modern Biology", "emoji": "📉", "color": "#2c5282", "warn": "", "title": "Modern Statistics for Modern Biology", "authors": "Susan Holmes and Wolfgang Huber", "edition": "Online edition (Cambridge University Press, 2019)", "file": "", "url": "https://www.huber.embl.de/msmb/", "licence": "Free online (publisher-hosted)", "overview": "A hands-on statistics book for biologists that teaches probability, modelling, testing, clustering, multivariate methods and machine learning using real biological data in R and Bioconductor. Every idea is shown with runnable code, from DNA counts to RNA-seq and microscopy images.", "how": "Read chapters 1-2 and 6 first (probability, models, testing), then 7-8 (PCA and RNA-seq GLMs), which matter most for genomics jobs; run the R code for each chapter rather than only reading it.", "free": true, "chapters": [{"n": 1, "title": "Generative Models for Discrete Data", "pdf_pages": "online", "minutes": 60, "summary": ["Discrete data come from counting things (mutations, reads, codons); continuous data from measuring (mass, intensity).", "Binomial, Poisson and multinomial distributions are 'box models' that generate counts when the parameters are known (top-down reasoning).", "Poisson(lambda = np) approximates the binomial when events are rare (p small, n large).", "Monte Carlo simulation (rbinom, rpois, rmultinom, replicate) lets you build a null distribution and find p-values.", "When you look at the maximum of many tests you must correct for multiplicity (extreme value reasoning).", "Power is the chance of detecting an effect that is really there; 80% is a common target."], "terms": [{"term": "Bernoulli trial", "def": "A single trial with two outcomes, success with probability p."}, {"term": "Binomial B(n,p)", "def": "Number of successes in n independent Bernoulli trials."}, {"term": "Poisson(lambda)", "def": "Distribution of counts of rare events, with mean and variance both equal to lambda."}, {"term": "Multinomial", "def": "Generalisation of the binomial to more than two categories, e.g. counts of A, C, G, T."}, {"term": "Factor", "def": "R data type for categorical variables with fixed levels."}, {"term": "Power", "def": "Probability of rejecting the null when the alternative is true (true positive rate)."}], "cards": [{"q": "What is the difference between discrete and continuous data?", "a": "Discrete data are counts (whole numbers) such as reads or mutations; continuous data are measurements such as mass or fluorescence intensity."}, {"q": "When can a Poisson distribution replace a binomial?", "a": "When events are rare: n is large and p is small, with lambda = n x p."}, {"q": "HIV mutation rate 5e-4 per base per cycle, genome 1e4 bases. What is lambda and what R call gives P(exactly 3 mutations)?", "a": "lambda = 5e-4 x 1e4 = 5; dpois(3, 5), about 0.14."}, {"q": "What do the d, p, r and q prefixes mean in R distribution functions?", "a": "d = probability mass/density, p = cumulative probability, r = random draws, q = quantile."}, {"q": "What is a p-value?", "a": "The probability of seeing data at least as extreme as observed if the null hypothesis is true; it is not the probability that the null is true."}, {"q": "Why does finding the largest count among 100 positions need special treatment?", "a": "Taking the maximum of many tests inflates the chance of an extreme value; the probability must be corrected for the number of positions examined."}, {"q": "What does the chi-squared statistic compare?", "a": "Observed counts with expected counts: sum of (observed - expected)^2 / expected."}, {"q": "What sample-size lesson came from testing nucleotide frequencies with only 20 bases?", "a": "Power was only about 20%, far below 80%, so much longer sequences are needed to detect the departure."}], "for_rush": "Count models are the foundation for SNP, read-count and GWAS statistics you already use.", "priority": "core"}, {"n": 2, "title": "Statistical Modeling", "pdf_pages": "online", "minutes": 75, "summary": ["Statistical inference works bottom-up: from data to estimates of model parameters.", "Maximum likelihood picks the parameter that makes the data most probable; for Poisson the MLE is the sample mean, for binomial it is y/n.", "Goodness of fit can be checked with rootograms, QQ-plots and chi-squared tests.", "Hardy-Weinberg equilibrium links allele frequencies to genotype frequencies (p^2, 2pq, q^2).", "Markov chains model sequences where each base depends on the previous one.", "Bayesian analysis combines a prior with data; a Beta prior with binomial data gives a Beta posterior."], "terms": [{"term": "Maximum likelihood estimate (MLE)", "def": "Parameter value that maximises the probability of the observed data."}, {"term": "Rootogram", "def": "Plot comparing observed and fitted count frequencies to judge fit."}, {"term": "Hardy-Weinberg equilibrium", "def": "Genotype frequencies p^2, 2pq, q^2 expected under random mating."}, {"term": "Markov chain", "def": "Model in which the next state depends only on the current state."}, {"term": "Prior / posterior", "def": "Belief about a parameter before data / updated belief after data."}, {"term": "Position weight matrix", "def": "Matrix of base probabilities at each motif position, shown as a sequence logo."}], "cards": [{"q": "What is the MLE of lambda for Poisson data?", "a": "The sample mean of the counts."}, {"q": "10 of 120 men are colour-blind. What is the MLE of p?", "a": "10/120 = about 0.083."}, {"q": "Under HWE, what are genotype frequencies for allele frequencies p and q?", "a": "AA = p^2, Aa = 2pq, aa = q^2."}, {"q": "Beta(alpha, beta) prior plus y successes in n trials gives what posterior?", "a": "Beta(alpha + y, beta + n - y)."}, {"q": "Prior Beta(50,350), data 40 of 300 carry a haplotype. What is the posterior?", "a": "Beta(90, 610), mean about 0.129."}, {"q": "What is a credibility interval?", "a": "The Bayesian interval holding a stated share (e.g. 95%) of the posterior probability."}, {"q": "What does a Markov chain assume about DNA?", "a": "The probability of a base depends only on the base immediately before it."}, {"q": "What is Chargaff's rule?", "a": "In double-stranded DNA, A is about equal to T and C about equal to G."}], "for_rush": "HWE tests and MLE are standard QC steps in the GWAS pipelines you have built.", "priority": "core"}, {"n": 3, "title": "Data Visualization", "pdf_pages": "online", "minutes": 60, "summary": ["Base R plotting is quick, but ggplot2's grammar of graphics builds plots from data, aesthetics, geoms, stats, scales and facets.", "For one variable, prefer boxplots, violins, densities, beeswarms or ECDFs over bar charts of means.", "Hexagonal binning or 2D density contours fix overplotting in large scatterplots.", "Faceting splits data into panels to show extra variables.", "Colour palettes (RColorBrewer) and heatmaps (pheatmap) help show large matrices; dendrogram ordering is partly arbitrary.", "Transformations (log etc.) can change how many modes a distribution appears to have."], "terms": [{"term": "Grammar of graphics", "def": "Framework building plots from modular layers rather than drawing commands."}, {"term": "Aesthetic mapping", "def": "Link between a variable and a visual property such as position, colour or size."}, {"term": "Geom", "def": "Geometric object that represents data, e.g. points, bars, lines."}, {"term": "Overplotting", "def": "Points piling on top of each other and hiding the pattern."}, {"term": "ECDF", "def": "Empirical cumulative distribution function: share of data at or below each value."}, {"term": "Faceting", "def": "Splitting a plot into panels by categories."}], "cards": [{"q": "Why are bar charts of means a poor way to show one variable?", "a": "They reduce the data to one number and hide spread, outliers and shape."}, {"q": "Name three ggplot2 geoms for showing a distribution.", "a": "geom_boxplot, geom_violin, geom_density (also geom_histogram, beeswarm, stat_ecdf)."}, {"q": "How do you deal with 45,000 overlapping points?", "a": "Use hexagonal binning (geom_hex) or 2D density contours."}, {"q": "What does facet_grid(a ~ b) do?", "a": "Makes a grid of panels with rows by a and columns by b."}, {"q": "Which package draws clustered heatmaps with annotations in MSMB?", "a": "pheatmap."}, {"q": "Why is heatmap row order partly arbitrary?", "a": "Each dendrogram branch can be flipped without changing the tree topology."}, {"q": "What is an ECDF plot good for?", "a": "Comparing whole distributions without choosing a bin width or smoothing window."}], "for_rush": "Portfolio-quality ggplot2 figures make your GWAS and transcriptomics projects stand out to employers.", "priority": "core"}, {"n": 4, "title": "Mixture Models", "pdf_pages": "online", "minutes": 70, "summary": ["Biological data are often mixtures of groups, giving bimodal or heavy-tailed distributions.", "Finite mixtures have a few components; the EM algorithm estimates them by alternating soft group membership (E-step) and parameter updates (M-step).", "Zero-inflated models mix structural zeros with count zeros, e.g. ChIP-seq bins.", "The bootstrap resamples the data with replacement to estimate the sampling distribution of a statistic such as the median.", "Infinite mixtures build useful distributions: a gamma mixture of Poissons is the negative binomial (gamma-Poisson).", "Variance-stabilising transformations (e.g. square root for Poisson counts) make variance roughly constant."], "terms": [{"term": "Mixture model", "def": "Distribution formed as a weighted sum of simpler component distributions."}, {"term": "EM algorithm", "def": "Iterative method alternating expectation (membership probabilities) and maximisation (parameters)."}, {"term": "Zero inflation", "def": "More zeros than a count model predicts, from a separate 'always zero' process."}, {"term": "Bootstrap", "def": "Resampling the data with replacement to estimate the variability of a statistic."}, {"term": "Gamma-Poisson", "def": "Poisson whose rate varies by a gamma distribution; equal to the negative binomial."}, {"term": "Variance-stabilising transformation", "def": "Transformation making variance independent of the mean."}], "cards": [{"q": "What are the two steps of EM?", "a": "E-step: compute each point's probability of belonging to each component; M-step: re-estimate component parameters using those weights."}, {"q": "What is a soft assignment?", "a": "Membership weights between 0 and 1 that sum to 1, rather than a hard label."}, {"q": "Why are ChIP-seq bin counts often zero-inflated?", "a": "Many bins contain no binding site at all (structural zeros) in addition to zeros from sampling."}, {"q": "How does the bootstrap work?", "a": "Draw many samples of size n with replacement from the data, compute the statistic each time, and use the spread as its sampling distribution."}, {"q": "Which distribution results from Poisson counts whose rates follow a gamma distribution?", "a": "The negative binomial (gamma-Poisson)."}, {"q": "Which transformation stabilises Poisson variance?", "a": "The square root."}, {"q": "Why does RNA-seq need the gamma-Poisson rather than Poisson?", "a": "Biological replicates vary more than Poisson sampling alone (overdispersion)."}], "for_rush": "The gamma-Poisson model underpins DESeq2, which you would use for potato stress RNA-seq.", "priority": "core"}, {"n": 5, "title": "Clustering", "pdf_pages": "online", "minutes": 70, "summary": ["Clustering groups objects with similar features; the choice of distance (Euclidean, Manhattan, correlation, Jaccard, Mahalanobis) shapes the result.", "k-means uses cluster means; PAM uses real observations (medoids) as centres.", "Hierarchical clustering builds a tree; single, complete, average and Ward linkage give different trees.", "DBSCAN finds dense regions using a radius (eps) and minimum points.", "Choose k with the within-cluster sum of squares 'elbow', the gap statistic or bootstrap stability.", "Clustering can denoise data, e.g. DADA2 infers amplicon sequence variants from 16S reads."], "terms": [{"term": "Distance metric", "def": "Rule measuring how different two observations are."}, {"term": "k-means", "def": "Partitions data into k clusters by minimising within-cluster variance around means."}, {"term": "Medoid", "def": "An actual observation used as a cluster centre (PAM)."}, {"term": "Linkage", "def": "Rule for distance between clusters in hierarchical clustering."}, {"term": "Gap statistic", "def": "Compares within-cluster dispersion to that of reference data to choose k."}, {"term": "DBSCAN", "def": "Density-based clustering that groups points in dense regions."}], "cards": [{"q": "What does Jaccard distance ignore that Euclidean does not?", "a": "Shared absences (co-absence); it compares presence/absence patterns only."}, {"q": "How does PAM differ from k-means?", "a": "PAM uses medoids (real data points) as centres, making it more robust to outliers."}, {"q": "Which linkage tends to give long 'comb-like' trees?", "a": "Single linkage."}, {"q": "What is the elbow method?", "a": "Plot within-cluster sum of squares against k and pick k where the decrease levels off."}, {"q": "What two parameters does DBSCAN need?", "a": "eps (neighbourhood radius) and minPts (minimum points in a neighbourhood)."}, {"q": "Why is arcsinh used for flow/mass cytometry data?", "a": "It is a variance-stabilising transformation that puts markers on comparable scales."}, {"q": "What does DADA2 do?", "a": "Models sequencing errors to separate real amplicon sequence variants from noise."}], "for_rush": "Clustering genotypes or expression profiles is a routine task in plant genomics roles.", "priority": "core"}, {"n": 6, "title": "Testing", "pdf_pages": "online", "minutes": 80, "summary": ["Hypothesis testing has five steps; all decisions (test, null, alpha) are made before looking at the data.", "Type I error = false positive; Type II error = false negative; power = 1 - beta.", "The t-test compares two means; PlantGrowth ctrl vs trt2 gives t = -2.13, df = 18, p = 0.047.", "P-value hacking (trying tests until one is significant) inflates false positives.", "With many tests, control the family-wise error rate (Bonferroni) or the false discovery rate (Benjamini-Hochberg).", "The local fdr and independent hypothesis weighting (IHW) use the multiplicity of tests to gain power."], "terms": [{"term": "Type I error", "def": "Rejecting a true null hypothesis (false positive)."}, {"term": "Type II error", "def": "Failing to reject a false null hypothesis (false negative)."}, {"term": "FWER", "def": "Probability of at least one false positive among all tests."}, {"term": "FDR", "def": "Expected proportion of false discoveries among all rejections."}, {"term": "Benjamini-Hochberg", "def": "Procedure controlling FDR by comparing ordered p-values with phi x k/m."}, {"term": "IHW", "def": "Independent hypothesis weighting: uses a covariate to give more weight to tests with more power."}], "cards": [{"q": "List the five steps of hypothesis testing.", "a": "Choose test statistic; set null and its distribution; set rejection region (alpha); collect data and compute statistic; decide."}, {"q": "59 heads in 100 tosses: binom.test p-value is about 0.089. Reject at alpha 0.05?", "a": "No; 0.089 > 0.05, so we cannot conclude the coin is unfair."}, {"q": "With 20,000 true nulls at alpha 0.05, what is the chance of at least one false positive?", "a": "Essentially 1 (100%); 1 - 0.95^20000."}, {"q": "How does Benjamini-Hochberg work?", "a": "Sort p-values, find the largest k with p(k) <= phi x k/m, and reject hypotheses 1 to k."}, {"q": "FWER vs FDR: which gives more power?", "a": "FDR, because it tolerates a controlled proportion of false positives."}, {"q": "How can pi0 (share of true nulls) be estimated from a p-value histogram?", "a": "From the flat right-hand part, e.g. 2 x the share of p-values above 0.5."}, {"q": "What R function adjusts p-values for BH or Bonferroni?", "a": "p.adjust(p, method = 'BH') or method = 'bonferroni'."}, {"q": "What covariate did IHW use in the airway RNA-seq example?", "a": "Mean normalised count (baseMean), giving more discoveries than plain BH."}], "for_rush": "Multiple testing correction is central to GWAS (Bonferroni thresholds) and differential expression.", "priority": "core"}, {"n": 7, "title": "Multivariate Analysis", "pdf_pages": "online", "minutes": 80, "summary": ["Data matrices have n rows (samples) and p columns (variables); dimension reduction summarises them in fewer axes.", "Centre and scale variables before PCA when they have different units.", "PCA finds linear combinations (principal components) that capture maximum variance; it minimises perpendicular distances.", "The SVD (X = USV^t) is the engine of PCA; eigenvalues show variance per component.", "Use a screeplot to choose how many components to keep; components with similar eigenvalues are unstable.", "Biplots and correlation circles show samples and variables together; external labels help interpretation."], "terms": [{"term": "Principal component", "def": "New variable made as a weighted sum of originals, capturing maximum remaining variance."}, {"term": "Loadings", "def": "Weights of the original variables in a component."}, {"term": "Scores", "def": "Coordinates of observations on the components."}, {"term": "SVD", "def": "Singular value decomposition X = USV^t, basis of PCA."}, {"term": "Screeplot", "def": "Bar plot of eigenvalues used to choose the number of components."}, {"term": "Biplot", "def": "Plot showing both observations and variable arrows."}], "cards": [{"q": "Why scale variables before PCA?", "a": "So variables measured in different units contribute equally rather than by size of their variance."}, {"q": "For scaled data, what do the eigenvalues add up to?", "a": "The number of variables p."}, {"q": "Turtle data: PC1 loadings are all about 0.577. What does PC1 represent?", "a": "Overall size, with length, width and height contributing equally."}, {"q": "How does PCA differ from regression when fitting a line?", "a": "PCA minimises perpendicular distances and treats variables symmetrically; regression minimises vertical distances."}, {"q": "Why convert decathlon running times to speeds before PCA?", "a": "So that higher always means better for every event, making correlations interpretable."}, {"q": "What warning applies when two eigenvalues are nearly equal?", "a": "The individual components are unstable; interpret the subspace they span, not each axis."}, {"q": "Which R functions perform PCA?", "a": "prcomp, princomp, or ade4::dudi.pca (svd underneath)."}], "for_rush": "PCA on SNP data is how you detect population structure before running a GWAS.", "priority": "core"}, {"n": 8, "title": "High-Throughput Count Data and Generalized Linear Models", "pdf_pages": "online", "minutes": 90, "summary": ["RNA-seq gives a count table of reads per gene per sample; counts are heteroscedastic and need normalisation.", "Size factors adjust for sequencing depth; DESeq2 estimates them robustly.", "Counts for replicates follow a gamma-Poisson (negative binomial) with a gene-specific dispersion.", "DESeq2 fits a GLM with a log link; empirical Bayes shrinkage borrows strength across genes for dispersions and fold changes.", "Adding a blocking factor (e.g. sequencing type) to the design (~ type + condition) increases power.", "Use VST or rlog transformed data for PCA and heatmaps, but not for testing."], "terms": [{"term": "Size factor", "def": "Sample-specific scaling for sequencing depth."}, {"term": "Dispersion", "def": "Gene-specific measure of extra-Poisson biological variability."}, {"term": "GLM", "def": "Generalised linear model: linear predictor linked to the mean via a link function."}, {"term": "Design matrix", "def": "Matrix encoding the experimental factors for each sample."}, {"term": "Empirical Bayes shrinkage", "def": "Pulling noisy per-gene estimates towards a prior estimated from all genes."}, {"term": "rlog / VST", "def": "Transformations that stabilise variance of counts for visualisation."}], "cards": [{"q": "What are the three main steps run by DESeq()?", "a": "Estimate size factors, estimate dispersions, then fit the negative binomial GLM and Wald test."}, {"q": "Why can't you simply compare raw counts between samples?", "a": "Samples differ in sequencing depth (library size), so counts must be normalised by size factors."}, {"q": "At high expression, how does variance relate to the mean in RNA-seq?", "a": "Roughly proportional to the mean squared (overdispersion); at low counts it is close to Poisson (variance = mean)."}, {"q": "In the pasilla data, what happened when sequencing type was added to the design?", "a": "More genes were detected at FDR 0.1 (about 1,061 rising to 1,325) because batch variation left the residuals."}, {"q": "Should rlog-transformed data be used for differential testing?", "a": "No; use it for PCA, clustering and heatmaps. Testing uses the raw counts in the GLM."}, {"q": "What does lfcThreshold do in results()?", "a": "Tests whether the fold change exceeds a minimum size, not just whether it differs from zero."}, {"q": "What does an MA plot show?", "a": "Log fold change against mean normalised count for every gene."}, {"q": "What is an interaction term in a linear model?", "a": "A term showing that the effect of one factor depends on the level of another."}], "for_rush": "This chapter is the method behind analysing your Maris Piper phosphate-stress transcriptomics data.", "priority": "core"}, {"n": 9, "title": "Multivariate Methods for Heterogeneous Data", "pdf_pages": "online", "minutes": 70, "summary": ["Multidimensional scaling (MDS/PCoA) recovers coordinates from a distance matrix alone.", "Non-metric MDS uses ranks of distances and minimises 'stress'; it is robust.", "Correspondence analysis applies a weighted SVD to contingency tables using chi-squared distances.", "Arch or horseshoe shapes in ordination often reveal a hidden gradient (time, space).", "Batch effects can be detected with ordination and corrected, e.g. with ComBat.", "t-SNE is a non-linear method that preserves local neighbourhoods but not global distances."], "terms": [{"term": "MDS / PCoA", "def": "Embedding objects in low dimensions from their pairwise distances."}, {"term": "NMDS", "def": "Non-metric MDS using rank order of distances."}, {"term": "Stress", "def": "Measure of how badly an NMDS embedding preserves distance ranks."}, {"term": "Correspondence analysis", "def": "Ordination of contingency tables based on chi-squared distances."}, {"term": "Batch effect", "def": "Unwanted systematic variation from processing conditions."}, {"term": "t-SNE", "def": "Non-linear embedding emphasising local neighbourhoods."}], "cards": [{"q": "When would you use MDS instead of PCA?", "a": "When you only have a distance or dissimilarity matrix rather than a feature table."}, {"q": "What does a horseshoe pattern in CA or MDS suggest?", "a": "An underlying gradient such as time or a spatial transect."}, {"q": "What R function performs classical MDS?", "a": "cmdscale()."}, {"q": "Which vegan function runs NMDS?", "a": "metaMDS()."}, {"q": "What does ComBat do?", "a": "Removes known batch effects using an empirical Bayes model."}, {"q": "Why should you not over-interpret distances between clusters in t-SNE?", "a": "t-SNE preserves local neighbourhoods, not global distances."}, {"q": "What is correspondence analysis used for?", "a": "Finding associations between rows and columns of a contingency table."}], "for_rush": "Microbiome or metabolomics ordinations (Bray-Curtis PCoA) in your omics portfolio use these tools.", "priority": "core"}, {"n": 10, "title": "Networks and Trees", "pdf_pages": "online", "minutes": 60, "summary": ["A graph has vertices and edges, which may be directed or undirected; it can be stored as an adjacency matrix or an edge list.", "igraph and ggraph build and draw networks in R.", "Gene set enrichment can be tested with Fisher's exact test or Monte Carlo simulation, and results mapped onto networks.", "Phylogenetic trees can be estimated from aligned sequences, e.g. neighbour-joining on Jukes-Cantor distances.", "phyloseq combines abundance tables, taxonomy, sample data and trees for microbiome analysis; hierarchical FDR uses the tree.", "Minimum spanning trees support tests such as Friedman-Rafsky for whether labels cluster on a tree."], "terms": [{"term": "Adjacency matrix", "def": "Square matrix with entries showing which vertices are connected."}, {"term": "Degree", "def": "Number of edges attached to a vertex."}, {"term": "Neighbour-joining", "def": "Distance-based method to build a phylogenetic tree."}, {"term": "Jukes-Cantor model", "def": "Simplest DNA substitution model with equal rates."}, {"term": "Minimum spanning tree", "def": "Tree connecting all vertices with minimum total edge length."}, {"term": "phyloseq", "def": "Bioconductor container for microbiome data and trees."}], "cards": [{"q": "What is the difference between directed and undirected edges?", "a": "Directed edges have an order (from-to); undirected edges are symmetric."}, {"q": "For an undirected graph, what property does the adjacency matrix have?", "a": "It is symmetric."}, {"q": "Which test checks whether a gene category is over-represented among significant genes?", "a": "Fisher's exact (hypergeometric) test."}, {"q": "Which R call builds a neighbour-joining tree from sequences in MSMB?", "a": "nj(dist.ml(seqs, 'JC69')) using phangorn/ape."}, {"q": "What does the Friedman-Rafsky test count?", "a": "'Pure' edges in a minimum spanning tree whose two ends share the same label, compared with permutations."}, {"q": "How does hierarchical FDR gain power in microbiome data?", "a": "It tests along the taxonomic tree, pooling information across related taxa."}], "for_rush": "Phylogenies and gene networks are common in plant pathogen and pan-genome analyses.", "priority": "core"}, {"n": 11, "title": "Image Data", "pdf_pages": "online", "minutes": 70, "summary": ["Images are arrays in R (EBImage); colour images use the third dimension for channels.", "Linear filters (e.g. Gaussian blur) smooth images by convolution; median filters are non-linear.", "Adaptive thresholding compares each pixel with its local background to handle uneven lighting.", "Morphological operations (erode, dilate, open) clean binary masks; bwlabel labels connected objects.", "Watershed/Voronoi propagation segments touching cells; computeFeatures extracts shape and intensity features.", "Spatial point process statistics (Ripley's K, L, pair correlation) test whether cells cluster or avoid each other."], "terms": [{"term": "Convolution filter", "def": "Weighted average of neighbouring pixels using a kernel."}, {"term": "Adaptive thresholding", "def": "Threshold that varies with local background."}, {"term": "Morphological opening", "def": "Erosion followed by dilation to remove small specks."}, {"term": "Segmentation", "def": "Partitioning an image into individual objects."}, {"term": "Voronoi tessellation", "def": "Division of space so each point is assigned to its nearest seed."}, {"term": "Ripley's K", "def": "Expected number of extra points within distance r of a typical point."}], "cards": [{"q": "Why is PNG preferred to JPEG for analysis images?", "a": "PNG is lossless; JPEG discards information."}, {"q": "What does morphological opening do?", "a": "Erodes then dilates, removing small noise while keeping larger objects."}, {"q": "Why use adaptive rather than global thresholding?", "a": "Uneven illumination makes one global threshold miss objects in dark areas or merge them in bright ones."}, {"q": "What does bwlabel do?", "a": "Gives each connected component of a binary image its own integer label."}, {"q": "Pair correlation g(r) < 1 means what?", "a": "Inhibition: points are rarer than random at that distance."}, {"q": "What is the simplest spatial point process model?", "a": "A homogeneous Poisson process with constant intensity."}], "for_rush": "Image segmentation and features link directly to your UAV late blight imaging thesis.", "priority": "useful"}, {"n": 12, "title": "Supervised Learning", "pdf_pages": "online", "minutes": 80, "summary": ["Supervised learning learns a rule from labelled data to predict a categorical or continuous response.", "LDA uses linear boundaries with a shared covariance; QDA allows class-specific covariances; logistic regression models log-odds.", "Training error underestimates true error; use cross-validation (k-fold, leave-one-out) to estimate performance.", "With many features and few samples you can fit noise perfectly (overfitting); the curse of dimensionality makes space sparse.", "Regularisation (ridge L2, lasso L1, elastic net) shrinks coefficients; tune lambda with cv.glmnet.", "The bias-variance trade-off: a little bias can greatly reduce variance; beware method hacking and use nested CV."], "terms": [{"term": "Overfitting", "def": "Model learns noise in the training data and generalises poorly."}, {"term": "Cross-validation", "def": "Repeatedly splitting data into training and test parts to estimate prediction error."}, {"term": "LDA", "def": "Linear discriminant analysis with a shared covariance matrix."}, {"term": "Lasso", "def": "Regression with an L1 penalty that sets some coefficients to zero."}, {"term": "Ridge", "def": "Regression with an L2 penalty that shrinks coefficients."}, {"term": "Sensitivity / specificity", "def": "True positive rate TP/P / true negative rate TN/N."}], "cards": [{"q": "Why is training-set accuracy misleading?", "a": "The model has seen those data; it can memorise them, so error on new data is usually higher."}, {"q": "With 20 samples and 20 random features, what happens to training vs CV error?", "a": "Training error falls to near 0 while cross-validated error stays near 50% (chance)."}, {"q": "Lasso vs ridge: which performs feature selection?", "a": "Lasso (L1), because it can set coefficients exactly to zero."}, {"q": "What is lambda.1se in glmnet?", "a": "The largest lambda whose CV error is within one standard error of the minimum; a more conservative choice."}, {"q": "Why is nested cross-validation needed?", "a": "Tuning hyperparameters on the same CV folds gives optimistic accuracy; an outer loop gives an honest estimate."}, {"q": "State the MSE decomposition.", "a": "MSE = variance + bias squared."}, {"q": "Which R package offers a unified interface to hundreds of ML methods?", "a": "caret (train, trainControl)."}], "for_rush": "These are the same ML principles behind your late blight classifier and genomic prediction jobs.", "priority": "core"}, {"n": 13, "title": "Design of High Throughput Experiments and their Analyses", "pdf_pages": "online", "minutes": 80, "summary": ["Separate noise (averages out with replication) from bias (does not).", "Biological replicates measure populatio
