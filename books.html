f Date Palms", "pdf_pages": "", "minutes": 10, "summary": ["Date palms (Phoenix dactylifera) have been farmed in the Arabian Peninsula, Middle East and North Africa for over 5,000 years.", "Indicative needs: under 90 L/tree/day in November-December (post-harvest).", "Up to about 110 L/tree/day in January-February (pre-pollination growth).", "Peak about 180 L/tree/day from March-April to July (fruit growth); similar in August-October ripening, with an option to reduce to improve ripening and sweetness.", "Figures vary with local conditions, variety, spacing and age; add a 10-25% safety factor if demand is not adjusted regularly."], "terms": [{"term": "Phoenix dactylifera", "def": "The scientific name of the date palm."}, {"term": "Atmospheric water demand", "def": "How much water the air 'pulls' from plants, driven by heat, sun, wind and dryness (evapotranspiration)."}, {"term": "Safety factor", "def": "Extra water (10-25%) added as a buffer when irrigation is not adjusted to changing demand."}, {"term": "Reference evapotranspiration", "def": "Water use of a standard reference surface, estimated from weather data and used to schedule irrigation."}], "cards": [{"q": "Peak daily water need of a date palm and when?", "a": "About 180 litres per tree per day, from March-April to July (fruit growth)."}, {"q": "Daily water need in November-December?", "a": "Under 90 litres per tree."}, {"q": "Daily water need in January-February?", "a": "Up to about 110 litres per tree."}, {"q": "What safety factor does ICBA suggest?", "a": "10-25%, if water amounts are not adjusted periodically to atmospheric demand."}, {"q": "Why might growers reduce water during ripening (Aug-Oct)?", "a": "To enhance ripening, sweetness and fruit hardness."}, {"q": "Name three factors that change these figures.", "a": "Local conditions, variety, tree spacing, tree age, agroecosystem."}], "for_rush": "Date palm is the UAE's signature crop and has a sequenced genome - a natural bridge between your genomics skills and local agriculture.", "priority": "core"}, {"n": 2, "title": "Saline Irrigation, Roots and Water-Saving Technology", "pdf_pages": "", "minutes": 10, "summary": ["When irrigating with saline water, add a leaching ('soil washing') factor; good drainage is essential.", "Very salty water (over 10 dS/m) hurts farm profitability and needs large amounts of fresh water for leaching.", "Drip and bubbler systems are highly efficient (up to 85%), deliver water and fertiliser precisely and help prevent salt build-up.", "Roots spread as far as the fronds and 3-5 m deep, but 75% are within 70-100 cm.", "Too little water reduces growth and fruit quality; too much can limit fruiting.", "ICBA trials use soil-moisture sensors at three depths with LoRaWAN data links, plus soil amendments (hydrogels) and subsurface irrigation."], "terms": [{"term": "Leaching (soil washing) factor", "def": "Extra water applied to wash salts below the root zone."}, {"term": "Bubbler irrigation", "def": "Low-pressure system that floods a small basin around each tree."}, {"term": "Soil-moisture sensor", "def": "Device measuring soil water content to guide irrigation timing."}, {"term": "LoRaWAN", "def": "Low-power, long-range wireless network for sending sensor data."}, {"term": "Hydrogel", "def": "Water-absorbing polymer added to soil to hold more water."}, {"term": "Subsurface irrigation", "def": "Delivering water below the soil surface to cut evaporation."}], "cards": [{"q": "How efficient can drip and bubbler irrigation be for date palms?", "a": "Up to about 85%."}, {"q": "Where are 75% of date palm roots found?", "a": "Within the top 70-100 cm of soil."}, {"q": "How far do date palm roots spread?", "a": "Horizontally as far as the fronds and 3-5 m deep."}, {"q": "Above what water salinity does profitability suffer, per ICBA?", "a": "Above about 10 dS/m."}, {"q": "Why is drainage essential with saline water?", "a": "To remove leached salts and prevent build-up in the root zone."}, {"q": "What sensor setup does ICBA use?", "a": "Soil-moisture sensors at three depths with LoRaWAN data transmission."}, {"q": "Effect of over-irrigating date palms?", "a": "It can limit fruiting (and wastes water)."}], "for_rush": "Sensor-driven irrigation data is an analytics opportunity in UAE agri-tech, combining IoT with your ML experience.", "priority": "core"}]}, {"slug": "icba_family", "short": "Family Farming Tips (ICBA)", "emoji": "🏺", "color": "#c4882d", "warn": "", "title": "Family Farming Tips: Growing Vegetables at Home", "authors": "International Center for Biosaline Agriculture (ICBA)", "edition": "2020 (ICBA, bilingual Arabic/English)", "file": "", "url": "https://www.biosaline.org/sites/default/files/2022-04/family_farming_tips_vegs_8_sep_2020_sr_f.pdf", "licence": "ICBA copyright; free download from the publisher", "overview": "A short bilingual ICBA leaflet with step-by-step home-growing guides for leafy greens, herbs and fruiting vegetables in pots: sowing depth and spacing, watering, feeding and harvesting.", "how": "Read in one sitting; focus on the leafy greens (especially spinach) for your own growing.", "free": true, "chapters": [{"n": 1, "title": "Leafy Greens: Spinach, Kale, Mustard, Celery and Swiss Chard", "pdf_pages": "", "minutes": 10, "summary": ["Use pots with drainage holes and good potting soil.", "Spinach: 1 cm furrows, seeds 2.5 cm apart, rows about 40 cm apart.", "Kale: 2 cm furrows, seeds 2.5 cm apart, rows 40 cm; mustard: 1 cm furrows, rows 30 cm.", "Water when the surface feels dry, until it drains from the bottom; more on hot sunny days; liquid fertiliser as per label.", "Harvest outer leaves first, leaving the centre to grow; spinach can be cut 5 cm above the base to re-sprout."], "terms": [{"term": "Furrow", "def": "A shallow groove in soil where seeds are sown."}, {"term": "Thinning", "def": "Removing extra seedlings so the rest have space."}, {"term": "Cut-and-come-again", "def": "Harvesting outer leaves or cutting above the base so the plant regrows."}, {"term": "Drainage hole", "def": "Opening in a pot that lets excess water escape and prevents waterlogging."}], "cards": [{"q": "How deep should spinach seeds be sown?", "a": "In furrows about 1 cm deep."}, {"q": "Seed and row spacing for spinach?", "a": "Seeds 2.5 cm apart; rows about 40 cm apart."}, {"q": "How do you know when to water pot-grown greens?", "a": "When the soil surface feels dry to the touch; water until it drains out the bottom."}, {"q": "How should leafy greens be harvested to keep them producing?", "a": "Pick outer leaves first, leaving new centre leaves to grow."}, {"q": "How high above the base can spinach be cut so it re-sprouts?", "a": "About 5 cm."}, {"q": "Furrow depth for kale vs mustard?", "a": "Kale about 2 cm; mustard about 1 cm."}], "for_rush": "Directly comparable with your hydroponic spinach - same cut-and-come-again harvesting, but soil-based.", "priority": "useful"}, {"n": 2, "title": "Herbs and Fruiting Vegetables: Coriander, Mint, Tomato, Cucumber and Capsicum", "pdf_pages": "", "minutes": 10, "summary": ["Coriander: holes 1-2 cm deep, 20 cm spacing; ready in about 30-40 days.", "Mint is vigorous - one or two plants fill a pot; never remove more than one-third of the leaves at once.", "Tomato, cucumber and capsicum: sow 2 or more seeds per hole, keep moist daily and support with stakes.", "Seedlings need protection from harsh direct sun; in summer move pots to cooler spots.", "Fertilise only if needed (e.g. yellowing leaves) with liquid fertiliser or compost."], "terms": [{"term": "Staking", "def": "Supporting climbing or heavy plants with sticks."}, {"term": "Vigorous", "def": "Fast-spreading growth, as in mint."}, {"term": "Fruiting vegetable", "def": "A crop grown for its fruit, e.g. tomato, cucumber, pepper."}, {"term": "Liquid fertiliser", "def": "Dissolved nutrients applied with watering."}], "cards": [{"q": "How quickly is coriander ready?", "a": "About 30-40 days."}, {"q": "Maximum share of mint leaves to remove at one time?", "a": "One-third."}, {"q": "Which crops in the guide need stake support?", "a": "Tomato, cucumber and capsicum."}, {"q": "When should fertiliser be applied according to the guide?", "a": "If plants show yellowing / the soil is not well nourished, using liquid fertiliser as directed."}, {"q": "Why protect seedlings in a UAE summer?", "a": "Intense sun and heat damage young plants; move pots to cooler, shaded spots."}], "for_rush": "Coriander and mint are easy additions to your home hydroponic setup alongside spinach.", "priority": "skim"}]}, {"slug": "fao56", "short": "Crop Evapotranspiration (FAO 56)", "emoji": "☀️", "color": "#d69e2e", "warn": "", "title": "Crop Evapotranspiration: Guidelines for Computing Crop Water Requirements (FAO Irrigation and Drainage Paper 56)", "authors": "Richard G. Allen, Luis S. Pereira, Dirk Raes, Martin Smith", "edition": "1998", "file": "", "url": "https://www.fao.org/4/x0490e/x0490e00.htm", "licence": "FAO publication, free online (publisher-hosted)", "overview": "The global standard for estimating how much water crops use. It defines reference evapotranspiration (ETo) with the FAO Penman-Monteith equation and crop coefficients (Kc) to convert it to crop water use, then adjusts for water stress, salinity, sparse vegetation and management.", "how": "Read chapters 1, 2, 5 and 6 first (concepts, Penman-Monteith, Kc tables), then chapter 8 for water stress and salinity, which matter most in arid UAE conditions.", "free": true, "chapters": [{"n": 1, "title": "Introduction to Evapotranspiration", "pdf_pages": "online", "minutes": 35, "summary": ["Evapotranspiration (ET) combines evaporation from soil and transpiration from plants.", "ETo is the ET of a hypothetical well-watered grass reference surface and expresses the atmosphere's evaporative demand.", "ETc is ET of a healthy, well-watered crop under standard conditions; ETc adj applies to non-standard conditions (stress, salinity, poor management).", "Weather (radiation, temperature, humidity, wind), crop factors and management/environment all affect ET.", "ET is expressed in mm per day; 1 mm/day = 10 m3/ha/day = 2.45 MJ/m2/day.", "Typical ETo in warm arid tropics/subtropics is 6-8 mm/day."], "terms": [{"term": "Evapotranspiration (ET)", "def": "Combined water loss by soil evaporation and plant transpiration."}, {"term": "ETo", "def": "Reference crop evapotranspiration from a standard grass surface."}, {"term": "ETc", "def": "Crop evapotranspiration under standard conditions."}, {"term": "ETc adj", "def": "Crop ET adjusted for non-standard conditions."}, {"term": "Latent heat of vaporisation", "def": "Energy to evaporate water; 2.45 MJ/kg at 20 C."}], "cards": [{"q": "Convert 1 mm/day of ET into m3 per hectare per day.", "a": "10 m3/ha/day."}, {"q": "Energy equivalent of 1 mm/day evaporation?", "a": "2.45 MJ/m2/day."}, {"q": "Typical ETo range for warm (>30 C) arid tropical/subtropical regions?", "a": "6-8 mm/day."}, {"q": "Difference between ETo and ETc?", "a": "ETo depends only on climate (grass reference); ETc applies to a specific crop via Kc."}, {"q": "Name three groups of factors affecting ET.", "a": "Weather, crop characteristics, and management/environmental conditions."}, {"q": "What makes conditions 'non-standard'?", "a": "Water stress, salinity, low fertility, disease, poor stand or management."}], "for_rush": "Dubai's hot, dry climate gives high ETo, so even a home hydroponic rack loses water fast.", "priority": "core"}, {"n": 2, "title": "FAO Penman-Monteith Equation", "pdf_pages": "online", "minutes": 45, "summary": ["A single standard method was needed because older methods disagreed across climates.", "FAO Penman-Monteith combines energy balance and aerodynamic transfer.", "The reference crop: hypothetical grass, height 0.12 m, surface resistance 70 s/m, albedo 0.23.", "ETo = [0.408 delta (Rn - G) + gamma (900/(T + 273)) u2 (es - ea)] / [delta + gamma (1 + 0.34 u2)].", "Inputs: net radiation, soil heat flux, mean temperature, wind at 2 m, vapour pressure deficit, slope of vapour pressure curve, psychrometric constant.", "Aerodynamic resistance for grass is about 208/u2 s/m."], "terms": [{"term": "Reference surface", "def": "Hypothetical grass 0.12 m tall, rs 70 s/m, albedo 0.23, well watered."}, {"term": "Surface resistance (rs)", "def": "Resistance to vapour flow through stomata and soil."}, {"term": "Aerodynamic resistance (ra)", "def": "Resistance to heat and vapour transfer from surface to air."}, {"term": "Vapour pressure deficit", "def": "es - ea, the drying power of the air."}, {"term": "Albedo", "def": "Fraction of solar radiation reflected."}], "cards": [{"q": "State the three reference crop values.", "a": "Height 0.12 m, surface resistance 70 s/m, albedo 0.23."}, {"q": "Which two physical approaches are combined in Penman-Monteith?", "a": "Energy balance (radiation) and aerodynamic (wind and humidity) transfer."}, {"q": "Units of ETo in the equation?", "a": "mm/day."}, {"q": "What does the factor 0.408 do?", "a": "Converts energy (MJ/m2/day) into equivalent evaporation (mm/day)."}, {"q": "Aerodynamic resistance of the grass reference?", "a": "ra = 208/u2 s/m."}, {"q": "Which weather variables are needed?", "a": "Radiation (or sunshine), air temperature, humidity and wind speed."}], "for_rush": "Penman-Monteith is the basis of irrigation scheduling tools used across UAE farms.", "priority": "core"}, {"n": 3, "title": "Meteorological Data", "pdf_pages": "online", "minutes": 60, "summary": ["Atmospheric pressure from elevation: P = 101.3 [(293 - 0.0065z)/293]^5.26 kPa; gamma = 0.665e-3 P.", "Saturation vapour pressure e(T) = 0.6108 exp[17.27T/(T + 237.3)] kPa; es is averaged from Tmax and Tmin.", "Actual vapour pressure from dewpoint or from RHmax/RHmin with Tmin/Tmax.", "Net radiation Rn = Rns - Rnl, with Rns = (1 - 0.23) Rs; Rs can be estimated by the Angstrom formula or from temperature range.", "Soil heat flux G is near 0 for daily steps.", "Wind is converted to 2 m height: u2 = uz x 4.87 / ln(67.8z - 5.42)."], "terms": [{"term": "Psychrometric constant", "def": "gamma = 0.665e-3 x P (kPa/C)."}, {"term": "Saturation vapour pressure", "def": "Vapour pressure of saturated air at a given temperature."}, {"term": "Actual vapour pressure", "def": "Vapour pressure of the air, equal to e at dewpoint."}, {"term": "Extraterrestrial radiation (Ra)", "def": "Solar radiation at the top of the atmosphere."}, {"term": "Net radiation", "def": "Incoming minus outgoing short- and long-wave radiation."}], "cards": [{"q": "Why compute es from Tmax and Tmin rather than mean temperature?", "a": "The curve is non-linear, so using mean T underestimates es."}, {"q": "How is ea estimated when humidity data are missing?", "a": "Assume dewpoint is close to Tmin: ea = e(Tmin)."}, {"q": "Soil heat flux for daily ETo calculations?", "a": "Approximately zero."}, {"q": "Wind measured at 10 m. Conversion factor to 2 m?", "a": "4.87/ln(67.8 x 10 - 5.42) = about 0.75."}, {"q": "Hargreaves radiation coefficient kRs: interior vs coastal?", "a": "About 0.16 interior, 0.19 coastal."}, {"q": "Default Angstrom coefficients as and bs?", "a": "0.25 and 0.50."}], "for_rush": "Coastal Dubai weather station data feed these equations for local ETo.", "priority": "core"}, {"n": 4, "title": "Determination of ETo", "pdf_pages": "online", "minutes": 40, "summary": ["Use FAO Penman-Monteith whenever possible, estimating any missing data with chapter 3 procedures.", "With only temperature data, Penman-Monteith can still be run using estimated radiation, humidity and default wind (2 m/s).", "Hargreaves: ETo = 0.0023 (Tmean + 17.8)(Tmax - Tmin)^0.5 Ra is an alternative when only temperature is available.", "Pan evaporation: ETo = Kp x Epan.", "Class A pan: 120.7 cm diameter, 25 cm deep, on a platform 15 cm above ground, water 5 cm below rim.", "Kp depends on pan surroundings (fetch), wind and humidity; for a pan in a green area with light wind and humid air it is about 0.75-0.85."], "terms": [{"term": "Pan coefficient (Kp)", "def": "Factor converting pan evaporation to ETo."}, {"term": "Class A pan", "def": "Standard circular evaporation pan 120.7 cm across and 25 cm deep."}, {"term": "Hargreaves equation", "def": "Temperature-based ETo estimate."}, {"term": "Fetch", "def": "Distance of upwind green or dry surface around the pan."}], "cards": [{"q": "Write the pan method equation.", "a": "ETo = Kp x Epan."}, {"q": "Epan = 7.9 mm/day and Kp = 0.85. ETo?", "a": "About 6.7 mm/day."}, {"q": "Dimensions of a Class A pan?", "a": "120.7 cm diameter, 25 cm deep."}, {"q": "Write the Hargreaves equation.", "a": "ETo = 0.0023 (Tmean + 17.8)(Tmax - Tmin)^0.5 x Ra (Ra in mm/day equivalent)."}, {"q": "Recommended approach when data are missing?", "a": "Estimate missing data and still use Penman-Monteith."}, {"q": "Height of the Class A pan platform and water level?", "a": "Platform 15 cm above ground; water kept about 5 cm below the rim."}], "for_rush": "A simple pan or temperature-based estimate can guide top-up volumes for her hydroponic reservoir.", "priority": "useful"}, {"n": 5, "title": "Introduction to Crop Evapotranspiration (ETc)", "pdf_pages": "online", "minutes": 35, "summary": ["ETc = Kc x ETo under standard conditions.", "Kc reflects crop type, climate, soil evaporation and growth stage.", "Growth stages: initial (to about 10% cover), development (to full cover), mid-season (to start of maturity), late season (to harvest).", "The single Kc approach suits planning and design; the dual approach (Kcb + Ke) suits daily, high-frequency irrigation.", "Most full-grown crops have Kc 5-20% above grass; tall crops can be about 30% higher in arid, windy climates."], "terms": [{"term": "Crop coefficient (Kc)", "def": "Ratio ETc/ETo."}, {"term": "Kcb", "def": "Basal crop coefficient (transpiration with dry soil surface)."}, {"term": "Ke", "def": "Soil evaporation coefficient."}, {"term": "Effective full cover", "def": "Point when canopy shades nearly all the ground."}], "cards": [{"q": "Write the crop coefficient equation.", "a": "ETc = Kc x ETo."}, {"q": "Name the four crop growth stages.", "a": "Initial, crop development, mid-season, late season."}, {"q": "When is the dual crop coefficient preferred?", "a": "For daily calculations and high-frequency irrigation such as drip or real-time scheduling."}, {"q": "Which Kc values vary most with wetting frequency?", "a": "Kc ini and Kc end."}, {"q": "How much higher than grass is Kc for most full-cover crops?", "a": "About 5-20%."}, {"q": "At what ground cover does the initial stage end?", "a": "At about 10% ground cover."}], "for_rush": "Kc lets her translate Dubai ETo into how much water her spinach actually uses.", "priority": "core"}, {"n": 6, "title": "ETc - Single Crop Coefficient (Kc)", "pdf_pages": "online", "minutes": 60, "summary": ["Find growth stage lengths (Table 11) and Kc ini, Kc mid, Kc end (Table 12); local data take priority.", "Spinach: Kc 0.20 / 1.00 / 0.95; lettuce 0.70 / 1.00 / 0.95; tomato 0.60 / 1.15 / 0.70-0.90; potato 0.50 / 1.15 / 0.75.", "Date palm Kc is about 0.90 / 0.95 / 0.95.", "Kc mid and Kc end are adjusted for climates other than RHmin 45% and u2 2 m/s using wind, RHmin and plant height.", "The Kc curve: flat in initial and mid-season, straight lines through development and late season.", "Spinach in an arid region (November planting): stages 20/30/40/10 days, total about 100 days."], "terms": [{"term": "Kc ini", "def": "Crop coefficient for the initial stage."}, {"term": "Kc mid", "def": "Crop coefficient at full cover."}, {"term": "Kc end", "def": "Crop coefficient at harvest."}, {"term": "Kc curve", "def": "Plot of Kc over the season built from stage lengths."}, {"term": "RHmin", "def": "Mean daily minimum relative humidity used in climate adjustment."}], "cards": [{"q": "Kc ini, mid and end for spinach?", "a": "0.20, 1.00, 0.95."}, {"q": "Kc mid for tomato and potato?", "a": "1.15 for both."}, {"q": "Standard climate for tabulated Kc mid?", "a": "Sub-humid: RHmin about 45%, u2 about 2 m/s."}, {"q": "Will Kc mid be adjusted up or down in a hot, dry, windy climate?", "a": "Up (higher wind and lower RHmin increase Kc mid for taller crops)."}, {"q": "ETo = 7 mm/day, spinach at mid-season (Kc 1.0). ETc?", "a": "7 mm/day."}, {"q": "How is the Kc curve drawn in the development stage?", "a": "A straight line from Kc ini to Kc mid."}, {"q": "Total growing period for spinach in an arid region per Table 11?", "a": "About 100 days (20/30/40/10)."}], "for_rush": "Spinach Kc values and stage lengths give her a direct water budget for her home crop.", "priority": "core"}, {"n": 7, "title": "ETc - Dual Crop Coefficient (Kc = Kcb + Ke)", "pdf_pages": "online", "minutes": 60, "summary": ["Splits ET into transpiration (Kcb ETo) and soil evaporation (Ke ETo).", "Ke is highest after wetting and falls as the topsoil dries: Ke = Kr (Kc max - Kcb), capped by few x Kc max.", "Total evaporable water TEW = 1000 (thetaFC - 0.5 thetaWP) Ze; readily evaporable water REW is about 5-12 mm.", "Evaporation has an energy-limited stage 1 then a falling-rate stage 2 governed by Kr.", "few is the exposed and wetted soil fraction: drip wets only about 0.3-0.4 of the surface; sprinklers wet it all.", "Requires a daily water balance of the surface layer."], "terms": [{"term": "Kcb", "def": "Basal crop coefficient, ETc/ETo with dry surface soil and full transpiration."}, {"term": "Ke", "def": "Soil evaporation coefficient."}, {"term": "TEW", "def": "Total evaporable water of the topsoil."}, {"term": "REW", "def": "Readily evaporable water lost in stage 1."}, {"term": "few", "def": "Fraction of soil both exposed and wetted."}, {"term": "Kr", "def": "Evaporation reduction coefficient (0-1)."}], "cards": [{"q": "Write the dual coefficient equation.", "a": "ETc = (Kcb + Ke) ETo."}, {"q": "Why does drip irrigation reduce soil evaporation?", "a": "It wets only a small fraction of the surface (fw about 0.3-0.4), lowering few."}, {"q": "What happens to Ke as the soil surface dries?", "a": "It decreases as Kr falls in stage 2."}, {"q": "Typical REW range?", "a": "About 5-12 mm (lower for sand)."}, {"q": "Typical upper limit Kc max after wetting?", "a": "About 1.05-1.30."}, {"q": "Which approach suits real-time drip scheduling?", "a": "The dual coefficient approach."}], "for_rush": "Explains why drip and soilless systems save water in the UAE: little evaporating wet surface.", "priority": "useful"}, {"n": 8, "title": "ETc under Soil Water Stress Conditions", "pdf_pages": "online", "minutes": 70, "summary": ["Water stress is described by Ks (1 = no stress, 0 = maximum): ETc adj = Ks Kc ETo (or (Ks Kcb + Ke) ETo).", "TAW = 1000 (thetaFC - thetaWP) Zr; RAW = p x TAW; p is often about 0.5 but only 0.2 for spinach.", "When depletion Dr exceeds RAW, Ks = (TAW - Dr)/(TAW - RAW).", "A daily root-zone water balance tracks rain, runoff, irrigation, capillary rise, ETc and deep percolation.", "Salinity: relative yield = 1 - b(ECe - ECe threshold)/100.", "Example thresholds (ECe): barley 8.0 dS/m (b 5), spinach 2.0-3.2 (b 7.7-16), lettuce 1.3-1.7 (b 12), tomato 0.9-2.5 (b 9), potato 1.7 (b 12)."], "terms": [{"term": "Ks", "def": "Water (or salinity) stress coefficient."}, {"term": "TAW", "def": "Total available water between field capacity and wilting point in the root zone."}, {"term": "RAW", "def": "Readily available water, p x TAW."}, {"term": "Depletion fraction p", "def": "Share of TAW used before stress begins."}, {"term": "ECe", "def": "Electrical conductivity of the saturated soil extract (dS/m)."}, {"term": "Salinity slope b", "def": "% yield loss per dS/m above threshold."}], "cards": [{"q": "Write the TAW equation.", "a": "TAW = 1000 (thetaFC - thetaWP) Zr in mm."}, {"q": "Depletion fraction p for spinach and lettuce?", "a": "Spinach 0.20; lettuce 0.30 (very sensitive shallow-rooted crops)."}, {"q": "Rooting depth range for spinach?", "a": "0.3-0.5 m."}, {"q": "Write the yield-salinity equation.", "a": "Ya/Ym = 1 - b (ECe - ECe threshold)/100."}, {"q": "Barley: threshold 8.0, b = 5. Relative yield at ECe 12 dS/m?", "a": "1 - 5 x 4/100 = 0.80 (80%)."}, {"q": "Lettuce threshold 1.3 dS/m, b = 12. Yield at ECe 3.3?", "a": "1 - 12 x 2/100 = 76%."}, {"q": "Salt tolerance rating of spinach, lettuce and tomato?", "a": "Moderately sensitive (MS)."}, {"q": "When does Ks drop below 1?", "a": "When root-zone depletion exceeds RAW."}], "for_rush": "Salinity thresholds tell her how much saline UAE water her crops can take; spinach is moderately sensitive.", "priority": "core"}, {"n": 9, "title": "ETc for Natural, Non-typical and Non-pristine Vegetation", "pdf_pages": "online", "minutes": 45, "summary": ["Sparse or poorly grown vegetation uses less water than standard crops.", "Kc mid can be reduced from ground cover: Acm = 1 - (fc/fc dense)^0.5.", "Kcb can be estimated from LAI: Kcb = Kc min + (Kcb full - Kc min)(1 - exp(-0.7 LAI)).", "Or from effective cover: Kcb = Kc min + (Kcb full - Kc min) x min(1, 2fc, fc eff^(1/(1 + h))).", "Kc min for bare soil is about 0.15-0.20; LAI >= 3 is roughly full cover.", "Strong stomatal control (e.g. some trees) needs a resistance correction; Ks can be back-calculated from yields: Ks = 1 - Ky(1 - Ya/Ym)."], "terms": [{"term": "Non-pristine vegetation", "def": "Vegetation growing under less-than-ideal conditions."}, {"term": "LAI", "def": "Leaf area index: one-sided leaf area per ground area."}, {"term": "Effective ground cover", "def": "Fraction of soil shaded by vegetation."}, {"term": "Kc min", "def": "Minimum Kc for bare soil, about 0.15-0.20."}, {"term": "Stomatal control", "def": "Plant regulation of transpiration through leaf pores."}], "cards": [{"q": "Kc min for bare soil?", "a": "About 0.15-0.20."}, {"q": "LAI value roughly indicating full cover?", "a": "About 3 or more."}, {"q": "Kcb from LAI formula?", "a": "Kcb = Kc min + (Kcb full - Kc min)(1 - exp(-0.7 LAI))."}, {"q": "How can Ks be estimated from yields?", "a": "Ks = 1 - Ky (1 - Ya/Ym)."}, {"q": "Why does sparse desert vegetation use less water than tabulated Kc suggests?", "a": "Lower ground cover and stomatal control reduce transpiration."}, {"q": "What does Acm = 1 - (fc/fc dense)^0.5 adjust?", "a": "It reduces Kc mid for vegetation sparser than a dense standard stand."}], "for_rush": "Useful for estimating water use of sparse desert or greening plantings in the UAE.", "priority": "useful"}, {"n": 10, "title": "ETc under Various Management Practices", "pdf_pages": "online", "minutes": 40, "summary": ["Plastic mulch reduces soil evaporation by 50-80% but raises transpiration by 10-30%; overall Kc falls by about 10-30%.", "Organic mulch reduces evaporation by about 5% for every 10% of surface covered.", "Intercropping Kc can be weighted by area fraction and height.", "Small isolated plantings surrounded by dry land show 'clothesline' and 'oasis' effects with higher ET.", "Large vegetated areas rarely exceed about 1.4 ETo.", "Deliberate stress (e.g. sugar beet late season) lowers Kc end."], "terms": [{"term": "Plastic mulch", "def": "Plastic film over the soil reducing evaporation."}, {"term": "Oasis effect", "def": "Extra ET from a small wet area surrounded by dry land due to advected heat."}, {"term": "Clothesline effect", "def": "Higher ET at the edges of tall vegetation exposed to wind."}, {"term": "Intercropping", "def": "Growing two crops together in one field."}], "cards": [{"q": "How much does plastic mulch cut soil evaporation?", "a": "About 50-80%."}, {"q": "Net effect of plastic mulch on Kc?", "a": "About 10-30% lower."}, {"q": "Organic mulch covering 50% of the surface reduces evaporation by about?", "a": "25%."}, {"q": "What is the oasis effect?", "a": "A small irrigated area in dry surroundings receives extra heat and evaporates more."}, {"q": "Typical upper limit for ET from large vegetated areas?", "a": "About 1.4 x ETo."}, {"q": "Kc ini under plastic mulch is roughly?", "a": "About 0.10."}], "for_rush": "Small irrigated plots in Dubai deserts experience oasis effects, raising water needs.", "priority": "useful"}, {"n": 11, "title": "ETc during Non-growing Periods", "pdf_pages": "online", "minutes": 25, "summary": ["Non-growing periods are times with no crop planted.", "For bare soil, use Kc ini based on rain frequency (single coefficient) or Kcb = 0 with the dual method.", "Dead vegetation mulch reduces Kc ini and TEW by about 5% per 10% of soil covered.", "Frozen or snow-covered surfaces lose little water; one Idaho study averaged about 1 mm/day in winter.", "Accounting for these periods keeps year-round water balances accurate."], "terms": [{"term": "Non-growing period", "def": "Time with no crop in the field."}, {"term": "Bare soil Kc", "def": "Taken as Kc ini, set by wetting frequency."}, {"term": "Residue mulch", "def": "Dead plant material left on the surface."}, {"term": "TEW reduction", "def": "Lower evaporable water under mulch."}], "cards": [{"q": "Which Kc is used for bare soil in the single method?", "a": "Kc ini, depending on rainfall frequency."}, {"q": "How does crop residue affect bare-soil evaporation?", "a": "Reduces it by about 5% per 10% of soil covered."}, {"q": "In the dual method, what is Kcb for bare soil?", "a": "Zero."}, {"q": "Why include non-growing periods in water balances?", "a": "Soil water lost or stored then affects the next crop's irrigation needs."}, {"q": "Why does dead residue reduce TEW?", "a": "It protects the soil and dries quickly, so less soil water evaporates."}, {"q": "For dead-residue cover in the dual method, what are fc and fw set to?", "a": "fc = 0 (no green cover) and fw = 1.0."}], "for_rush": "", "priority": "skim"}]}, {"slug": "fao66", "short": "Crop Yield Response to Water (FAO 66)", "emoji": "📈", "color": "#2f855a", "warn": "", "title": "Crop Yield Response to Water (FAO Irrigation and Drainage Paper 66)", "authors": "Pasquale Steduto, Theodore C. Hsiao, Elias Fereres, Dirk Raes", "edition": "2012", "file": "", "url": "https://www.fao.org/4/i2800e/i2800e.pdf", "licence": "FAO publication, free PDF (publisher-hosted)", "overview": "Explains how crop yield responds to water supply, updating the classic Ky approach of FAO Paper 33 with the AquaCrop simulation model for herbaceous crops and practical guidelines for fruit trees and vines. It is the key reference for deficit irrigation and water productivity.", "how": "Read chapters 1-2 and the AquaCrop concepts section (3.1) carefully; skim applications and calibration; use the crop sections (3.4 and 4) as reference for crops you work with.", "free": true, "chapters": [{"n": 1, "title": "Introduction and the Original FAO Water Production Function (Chapters 1-2)", "pdf_pages": "1-15", "minutes": 40, "summary": ["FAO Paper 33 (Doorenbos and Kassam, 1979) linked relative yield loss to relative ET deficit.", "(1 - Ya/Yx) = Ky (1 - ETa/ETx).", "Ky > 1: yield falls proportionally more than water use (sensitive); Ky < 1: more tolerant.", "Seasonal Ky examples: maize 1.25, spring wheat 1.15, potato 1.1, tomato 1.05, cabbage 0.95.", "Limitations: one empirical factor, lumps soil evaporation with transpiration, coarse time steps, large within-crop variation.", "Fits planning and rapid appraisal; AquaCrop was developed for daily, process-based estimates."], "terms": [{"term": "Ky", "def": "Yield response factor relating relative yield loss to relative ET deficit."}, {"term": "Ya / Yx", "def": "Actual / maximum yield."}, {"term": "ETa / ETx", "def": "Actual / maximum evapotranspiration."}, {"term": "Water production function", "def": "Relationship between yield and water used."}, {"term": "Deficit irrigation", "def": "Deliberately supplying less water than full crop demand."}], "cards": [{"q": "Write the FAO 33 yield response equation.", "a": "(1 - Ya/Yx) = Ky (1 - ETa/ETx)."}, {"q": "Maize Ky = 1.25, ET deficit 20%. Expected yield loss?", "a": "1.25 x 20% = 25%."}, {"q": "Cabbage Ky = 0.95, ET deficit 20%. Yield loss?", "a": "About 19%."}, {"q": "What does Ky > 1 mean?", "a": "The crop is sensitive: yield drops proportionally more than water use."}, {"q": "Two main limitations of the Ky approach?", "a": "It lumps evaporation with transpiration and uses one empirical factor at coarse time scales."}, {"q": "What is the Ky approach best used for?", "a": "General planning, project design and rapid appraisal."}], "for_rush": "Ky helps judge which crops tolerate deficit irrigation under UAE water scarcity.", "priority": "useful"}, {"n": 2, "title": "AquaCrop: Concepts, Rationale and Operation (3.1)", "pdf_pages": "16-49", "minutes": 60, "summary": ["AquaCrop separates soil evaporation from transpiration and runs on daily steps.", "Biomass B = WP* x sum(Tr/ETo); yield Y = HI x B.", "Normalised water productivity WP* is nearly constant for a crop: about 15-20 g/m2 for C3 crops and 30-35 g/m2 for C4 crops.", "Canopy cover (CC) replaces LAI and can be estimated visually or by remote sensing.", "Water stress coefficients act separately on canopy expansion (most sensitive), stomatal closure, senescence and harvest index.", "Inputs: daily climate (Tmax, Tmin, rain, ETo, CO2), crop, soil and management (irrigation, fertility, mulch)."], "terms": [{"term": "WP*", "def": "Biomass per unit transpiration normalised for ETo and CO2."}, {"term": "Harvest index (HI)", "def": "Share of biomass in the harvested product."}, {"term": "Canopy cover (CC)", "def": "Fraction of ground covered by green canopy."}, {"term": "CGC / CDC", "def": "Canopy growth and decline coefficients."}, {"term": "Growing degree days", "def": "Heat units used to time crop development."}], "cards": [{"q": "Write AquaCrop's biomass equation.", "a": "B = WP* x sum(Tr/ETo)."}, {"q": "How is yield computed from biomass?", "a": "Y = HI x B."}, {"q": "Typical WP* for C3 vs C4 crops?", "a": "C3 about 15-20 g/m2; C4 about 30-35 g/m2."}, {"q": "Why use canopy cover instead of LAI?", "a": "It is easy to estimate in the field and from remote sensing images."}, {"q": "Which process is most sensitive to water stress in AquaCrop?", "a": "Canopy expansion."}, {"q": "Why normalise WP for ETo and CO2?", "a": "So WP* stays constant across climates and years."}, {"q": "Why separate E and Tr?", "a": "Only transpiration produces biomass; soil evaporation is a non-productive loss."}], "for_rush": "Canopy cover from UAV images, as in her late blight thesis, can feed AquaCrop-type models.", "priority": "core"}, {"n": 3, "title": "AquaCrop Applications (3.2)", "pdf_pages": "50-69", "minutes": 30, "summary": ["Used to estimate attainable yield and analyse yield gaps.", "Compares irrigation strategies, including deficit irrigation and scheduling by fixed interval, depth or allowable depletion.", "Simulates climate change scenarios (temperature, rainfall, elevated CO2).", "Benchmarks water productivity across regions and management.", "Supports planning decisions where water is scarce."], "terms": [{"term": "Yield gap", "def": "Difference between attainable and actual farm yields."}, {"term": "Irrigation schedule", "def": "Plan of when and how much to irrigate."}, {"term": "Water productivity", "def": "Crop output per unit of water used."}, {"term": "Scenario analysis", "def": "Comparing simulated outcomes under different conditions."}], "cards": [{"q": "Name three AquaCrop applications.", "a": "Yield gap analysis, deficit irrigation planning, climate change scenarios (also scheduling, WP benchmarking)."}, {"q": "Three ways AquaCrop can generate irrigation schedules?", "a": "Fixed interval, fixed depth, or allowable soil water depletion."}, {"q": "What climate change factors can be simulated?", "a": "Temperature, rainfall and atmospheric CO2."}, {"q": "What is water productivity benchmarking?", "a": "Comparing output per unit water across farms or regions to find improvement potential."}, {"q": "Why is AquaCrop useful under water scarcity?", "a": "It shows how yield responds to different amounts and timings of water, guiding allocation."}, {"q": "Does deficit irrigation always cut yield proportionally?", "a": "No; well-timed deficits can save water with smaller yield losses."}], "for_rush": "Scenario modelling of irrigation strategies is valuable for UAE agri-tech companies.", "priority": "useful"}, {"n": 4, "title": "AquaCrop Parameterisation, Calibration and Validation (3.3)", "pdf_pages": "70-88", "minutes": 30, "summary": ["Conservative parameters (e.g. WP*, canopy growth coefficient, initial canopy size) change little across cultivars and sites when expressed in growing degree days.", "Cultivar- or site-specific parameters (phenology, rooting depth, harvest index) need local calibration.", "Calibration data should come from crops grown without nutrient limits.", "Validation compares simulations with independent measurements.", "Common statistics: RMSE, Willmott's index of agreement (d) and R^2."], "terms": [{"term": "Conservative parameter", "def": "Parameter nearly constant across cultivars and environments."}, {"term": "Calibration", "def": "Adjusting parameters to match observed data."}, {"term": "Validation", "def": "Testing the model against independent data."}, {"term": "RMSE", "def": "Root mean square error between simulated and observed values."}, {"term": "Willmott d", "def": "Index of agreement from 0 to 1."}], "cards": [{"q": "Calibration vs validation?", "a": "Calibration tunes parameters; validation tests the tuned model on independent data."}, {"q": "Give one conservative AquaCrop parameter.", "a": "WP* (or canopy growth coefficient, initial canopy cover)."}, {"q": "Which parameters usually need local calibration?", "a": "Phenology durations, maximum rooting depth and harvest index."}, {"q": "Name two statistics used to judge model fit.", "a": "RMSE and Willmott's d (also R^2)."}, {"q": "Why calibrate with nutrient-unlimited crops?", "a": "So parameters reflect water response, not nutrient stress."}, {"q": "Why express phenology in growing degree days?", "a": "So parameters transfer across climates and sowing dates."}], "for_rush": "Calibration and validation language transfers directly to her ML model evaluation.", "priority": "skim"}, {"n": 5, "title": "Herbaceous Crops: Crop-by-Crop Summary (3.4)", "pdf_pages": "89-245", "minutes": 60, "summary": ["Covers 16 crops: wheat, rice, maize, soybean, barley, sorghum, cotton, sunflower, sugarcane, potato, tomato, sugar beet, alfalfa, bambara groundnut, quinoa and tef.", "Each section describes growth, water use and yield response, plus AquaCrop parameters.", "Flowering and yield formation are usually the most water-sensitive stages; vegetative and ripening stages less so.", "Wheat: stress during ripening has limited impact compared with flowering.", "Potato: tuber bulking is critical; tomato: flowering and fruit set are vulnerable.", "Seasonal Ky examples from FAO 33: sunflower about 0.95, cotton about 0.85, so these tolerate some deficit."], "terms": [{"term": "Sensitive growth stage", "def": "Stage when water stress causes the largest yield loss."}, {"term": "Tuber bulking", "def": "Phase when potato tubers fill rapidly."}, {"term": "Fruit set", "def": "Transition of flowers into developing fruits."}, {"term": "Quinoa", "def": "Andean grain crop included as a stress-tolerant option."}], "cards": [{"q": "Which growth stages are generally most sensitive to water deficit?", "a": "Flowering and yield formation."}, {"q": "Critical stage for potato water supply?", "a": "Tuber bulking."}, {"q": "Critical stage for tomato?", "a": "Flowering and fruit set."}, {"q": "Does stress during wheat ripening cause large losses?", "a": "No, the impact is limited compared with flowering."}, {"q": "Name two salt- or drought-tolerant crops covered that suit marginal lands.", "a": "Quinoa and barley (also sorghum)."}, {"q": "How many herbaceous crops are covered?", "a": "16."}], "for_rush": "Quinoa and barley sections are relevant to ICBA-style saline agriculture research in Dubai.", "priority": "useful"}, {"n": 6, "title": "Fruit Trees and Vines (Chapter 4)", "pdf_pages": "246-497", "minutes": 45, "summary": ["Trees and vines use guidelines rather than AquaCrop because of carry-over effects between years and large cultivar differences.", "Covers olive, citrus, apple, plum, almond, pear, peach, walnut, pistachio, apricot, avocado, sweet cherry, grapevine and kiwifruit.", "Regulated deficit irrigation (RDI) often saves water without yield or income penalties, and can improve fruit quality.", "Flowering and fruit development are typically the most sensitive stages; timing varies by species.", "Guidelines aim to safeguard farmers' net income under limited water."], "terms": [{"term": "Regulated deficit irrigation", "def": "Reducing water at less sensitive stages to save water with little yield loss."}, {"term": "Carry-over effect", "def": "Stress in one season affecting the next."}, {"term": "Phenological stage", "def": "Stage of plant development such as flowering or fruit growth."}, {"term": "Net income", "def": "Farm return after costs, the key target of RDI guidelines."}], "cards": [{"q": "Why is a simple AquaCrop approach not used for trees?", "a": "Carry-over effects between years and large cultivar differences."}, {"q": "What is regulated deficit irrigation?", "a": "Cutting irrigation at less sensitive stages to save water with little or no loss."}, {"q": "Can RDI improve quality?", "a": "Yes, in some cases fruit quality improves."}, {"q": "Which stages are usually most sensitive in fruit trees?", "a": "Flowering and fruit development."}, {"q": "Name three tree crops covered that grow in the Middle East.", "a": "Olive, citrus, pistachio (also almond, grapevine)."}, {"q": "What is the main aim of the tree guidelines?", "a": "Reduce water use while protecting farmers' net income."}], "for_rush": "RDI principles apply to UAE orchards facing severe water limits.", "priority": "skim"}]}, {"slug": "fao61", "short": "Drainage Water in Drylands (FAO 61)", "emoji": "🏞️", "color": "#718096", "warn": "", "title": "Agricultural Drainage Water Management in Arid and Semi-Arid Areas (FAO Irrigation and Drainage Paper 61)", "authors": "Kenneth K. Tanji and Neeltje C. Kielen", "edition": "2002", "file": "", "url": "https://www.fao.org/4/ap103e/ap103e.pdf", "licence": "FAO publication, free PDF (publisher-hosted)", "overview": "Guidelines for handling salty, contaminated drainage water from irrigated land in dry regions. It covers why drainage is needed, water quality concerns, and four groups of options: conservation, reuse, disposal and treatment, with case studies from Central Asia, Egypt, India, Pakistan and the USA.", "how": "Skim chapters 1-4 for the framework, then read chapter 6 (reuse, including IFDM and salt-tolerant crops) most closely; use the annex on crop salt tolerance as reference.", "free": true, "chapters": [{"n": 1, "title": "Introduction and Defining the Problem (Chapters 1-2)", "pdf_pages": "3-20", "minutes": 35, "summary": ["Irrigation without adequate drainage raises water tables, causing waterlogging and salinisation.", "About 20-30 million ha of the world's roughly 260 million ha of irrigated land is affected by salinisation.", "Salt must leave the root zone; the leaching fraction is the share of applied water that drains below the roots.", "A systems approach looks at levels from field to river basin and involves stakeholders.", "Root-zone hydrosalinity models (e.g. SWAP, UNSATCHEM, HYDRUS) simulate water and salt movement."], "terms": [{"term": "Waterlogging", "def": "Saturation of the root zone due to a high water table."}, {"term": "Salinisation", "def": "Build-up of salts in soil."}, {"term": "Leaching fraction", "def": "Fraction of applied water that passes below the root zone."}, {"term": "Salt balance", "def": "Accounting of salt inputs and outputs for an area."}, {"term": "Systems approach", "def": "Analysing a problem across linked scales and stakeholders."}], "cards": [{"q": "Why do irrigated lands need drainage?", "a": "To control rising water tables and remove salts that would otherwise accumulate."}, {"q": "Roughly how much irrigated land is affected by salinisation globally?", "a": "About 20-30 million ha of about 260 million ha."}, {"q": "Define leaching fraction.", "a": "Share of applied irrigation water that drains below the root zone, carrying salts."}, {"q": "Name one root-zone hydrosalinity model.", "a": "SWAP, UNSATCHEM or HYDRUS."}, {"q": "What happens if leaching is too low?", "a": "Salts accumulate in the root zone and reduce yields."}, {"q": "Why does waterlogging occur on irrigated land?", "a": "Drainage development has not kept pace with irrigation, so water tables rise."}], "for_rush": "Salinisation from irrigation is a core challenge for UAE and Gulf agriculture.", "priority": "useful"}, {"n": 2, "title": "Management Framework and Water Quality Concerns (Chapters 3-4)", "pdf_pages": "21-44", "minutes": 35, "summary": ["Driving forces: avoiding losses from waterlogging and salinity, protecting shared water, conserving scarce water, and regulation.", "Physical options fall into conservation, reuse, treatment and disposal.", "Non-physical options include economic instruments such as charges, subsidies and salinity permit trading (e.g. Murray-Darling credits and debits).", "Drainage water can carry salts, boron, selenium, molybdenum, nutrients, pesticides and sediments.", "Suitability for reuse depends on the use: crops (tolerance varies by stage), livestock, aquatic life and drinking water."], "terms": [{"term": "Physical options", "def": "Engineering or field measures such as reuse or treatment."}, {"term": "Non-physical options", "def": "Policy and economic instruments."}, {"term": "Trace elements", "def": "Elements such as selenium and boron that can be toxic at low levels."}, {"term": "Bioaccumulation", "def": "Build-up of a substance in organisms through the food chain."}, {"term": "EC", "def": "Electrical conductivity, a measure of salinity (dS/m)."}], "cards": [{"q": "Name the four groups of physical drainage options.", "a": "Conservation, reuse, treatment and disposal."}, {"q": "Give two trace elements of concern in drainage water.", "a": "Selenium and boron (also molybdenum)."}, {"q": "Give one non-physical management option.", "a": "Effluent charges, subsidies or tradable salinity permits."}, {"q": "How is salinity of water usually measured?", "a": "Electrical conductivity in dS/m."}, {"q": "Why is selenium a special concern?", "a": "It bioaccumulates and harms birds and aquatic life."}, {"q": "Why do salt-tolerance limits for reuse depend on growth stage?", "a": "Crops are often more sensitive at germination and early growth than later."}], "for_rush": "", "priority": "skim"}, {"n": 3, "title": "Water Conservation (Chapter 5)", "pdf_pages": "45-72", "minutes": 30, "summary": ["Source reduction lowers deep percolation by improving irrigation, e.g. moving from surface to precision methods.", "A minimum leaching requirement must still be met to keep salts out of the root zone.", "Shallow water table management lets crops use groundwater through capillary rise, but can draw salts upward.", "Land retirement takes badly affected land out of production but can lead to bare, eroding land if not managed."], "terms": [{"term": "Source reduction", "def": "Reducing drainage volume at its origin by better irrigation."}, {"term": "Deep percolation", "def": "Water moving below the root zone."}, {"term": "Capillary rise", "def": "Upward movement of groundwater into the root zone."}, {"term": "Land retirement", "def": "Removing problem land from irrigated production."}], "cards": [{"q": "What is the main way to reduce drainage volume?", "a": "Source reduction: improving irrigation to cut deep percolation."}, {"q": "Risk of relying on shallow groundwater?", "a": "Capillary rise brings salts into the upper soil."}, {"q": "Why can't leaching be cut to zero?", "a": "Salts would accumulate in the root zone."}, {"q": "Downside of land retirement?", "a": "Unmanaged retired land may become barren and suffer wind erosion."}, {"q": "Example of source reduction?", "a": "Switching from surface to precision (drip or sprinkler) irrigation."}, {"q": "How does controlled drainage save water?", "a": "It keeps the water table higher so crops use groundwater, reducing irrigation."}], "for_rush": "Precision irrigation and minimal leaching match the drip/hydroponic approaches favoured in the UAE.", "priority": "useful"}, {"n": 4, "title": "Drainage Water Reuse (Chapter 6)", "pdf_pages": "73-90", "minutes": 40, "summary": ["Drainage water can be reused directly, blended with fresh water, or used cyclically (alternating fresh and saline water).", "Crop substitution uses salt-tolerant crops, shrubs, trees or halophytes to make use of saline water.", "IFDM (integrated on-farm drainage management) reuses water in sequence: salt-sensitive crops, then tolerant crops, then halophytes, then solar evaporators.", "IFDM shrinks the final volume of drainage effluent.", "Moderately saline drainage water can help start reclamation of sodic soils."], "terms": [{"term": "Blending", "def": "Mixing saline drainage water with fresh water before use."}, {"term": "Cyclic use", "def": "Alternating fresh and saline water between seasons or within a season."}, {"term": "Halophyte", "def": "Plant adapted to high salinity."}, {"term": "IFDM", "def": "Integrated on-farm drainage management using sequential reuse."}, {"term": "Solar evaporator", "def": "Final basin where concentrated drainage water evaporates, leaving salt."}], "cards": [{"q": "Blending vs cyclic use?", "a": "Blending mixes fresh and saline water; cyclic use alternates between them."}, {"q": "Order of reuse in IFDM?", "a": "Salt-sensitive crops, salt-tolerant crops, halophytes, then solar evaporator."}, {"q": "Main benefit of IFDM?", "a": "It reduces the volume of drainage effluent needing disposal."}, {"q": "What is a halophyte?", "a": "A plant that tolerates high salinity."}, {"q": "How can saline drainage water help sodic soils?", "a": "Its salt content keeps soil from dispersing during early reclamation."}, {"q": "Why might cyclic use be preferred to blending?", "a": "It is more flexible, using fresh water at sensitive stages and saline water later."}], "for_rush": "Sequential saline reuse and halophytes are active research themes at Dubai's ICBA.", "priority": "useful"}, {"n": 5, "title": "Disposal and Treatment (Chapters 7-8)", "pdf_pages": "91-108", "minutes": 30, "summary": ["Disposal routes: rivers, outfall drains to sea or saline lakes, evaporation ponds and deep-well injection.", "Evaporation ponds concentrate trace elements; selenium harmed waterbirds at Kesterson Reservoir, California.", "Deep injection risks clogging and contaminating fresh aquifers.", "Reverse osmosis can desalinate but is costly and leaves brine for disposal.", "Constructed wetlands can remove about 60-80% of selenium mass; microbes can convert selenate to immobile elemental selenium."], "terms": [{"term": "Evaporation pond", "def": "Basin where drainage water evaporates, concentrating salts."}, {"term": "Deep-well injection", "def": "Pumping effluent into deep confined aquifers."}, {"term": "Reverse osmosis", "def": "Membrane desalination producing fresh water and brine."}, {"term": "Constructed wetland", "def": "Engineered vegetated system that treats water biologically."}], "cards": [{"q": "What happened at Kesterson Reservoir?", "a": "Selenium from drainage water accumulated and harmed waterbirds."}, {"q": "Main drawback of reverse osmosis for drainage water?", "a": "High cost and brine disposal."}, {"q": "How much selenium can constructed wetlands remove?", "a": "About 60-80% of its mass."}, {"q": "Two risks of deep-well injection?", "a": "Clogging of the formation and contamination of fresh groundwater."}, {"q": "How do microbes help with selenium?", "a": "They reduce soluble selenate to immobile elemental selenium."}, {"q": "Why can evaporation ponds be hazardous?", "a": "Trace elements concentrate and bioaccumulate in birds and wildlife."}], "for_rush": "Brine from UAE desalination raises similar disposal questions.", "priority": "skim"}, {"n": 6, "title": "Case Studies and Annexes", "pdf_pages": "109 onwards", "minutes": 30, "summary": ["Case studies summarise experience from Central Asia (Aral Sea basin), Egypt, India, Pakistan and the USA.", "In the Aral Sea basin, river salinity rises from about 0.5 g/L upstream to 1-1.5 g/L in delta areas because of return flows.", "Pakistan still reports about 13% of irrigated land with severe salinity despite drainage investment, showing the need for operation and maintenance.", "The USA (San Joaquin Valley) case centres on selenium-laden drainage water.", "Annex 1 gives crop salt tolerance data; other annexes cover livestock and drinking-water quality, and trees and shrubs for saltland."], "terms": [{"term": "Return flow", "def": "Drainage water returned to rivers after irrigation."}, {"term": "Closed basin", "def": "Basin with no outlet to the sea, where salts accumulate."}, {"term": "Operation and maintenance", "def": "Ongoing upkeep needed for drainage systems to work."}, {"term": "Salt tolerance data", "def": "Thresholds and slopes of yield decline with salinity for crops."}], "cards": [{"q": "How does Aral Sea basin river salinity change downstream?", "a": "From about 0.5 g/L upstream to 1-1.5 g/L in the delta."}, {"q": "What share of Pakistan's irrigated land reportedly has severe salinity?", "a": "About 13%."}, {"q": "Main contaminant issue in the San Joaquin Valley case?", "a": "Selenium in subsurface drainage."}, {"q": "Where in FAO 61 do you find crop salt tolerance data?", "a": "Annex 1."}, {"q": "Lesson from Pakistan's case?", "a": "Infrastructure fails without good operation, maintenance and policy enforcement."}, {"q": "What is a closed basin?", "a": "A basin with no outlet to the sea, so salts accumulate in it."}], "for_rush": "Annex salt tolerance and saltland trees are handy references for UAE marginal-water farming.", "priority": "skim"}]}, {"slug": "isu_cropgenetics", "short": "Crop Genetics (ISU, open)", "emoji": "🧬", "color": "#6b46c1", "warn": "", "title": "Crop Genetics", "authors": "Walter Suza and Kendall Lamkey (eds.)", "edition": "2023, Iowa State University Digital Press", "file": "", "url": "https://iastate.pressbooks.pub/cropgenetics/", "licence": "CC BY-NC 4.0", "overview": "An open textbook on the genetics that plant breeders rely on: crop reproduction, flowers and pollination control, Mendelian segregation, linkage, population genetics, inbreeding and heterosis, quantitative inheritance, mutation and polyploidy. Each chapter has learning objectives and worked examples with crop cases.", "how": "Read in order; chapters 4-8 are the core for genomics work (segregation, linkage, population genetics, heterosis, heritability). Work through the numerical examples with pen and paper.", "free": true, "chapters": [{"n": 1, "title": "Reproduction in Crop Plants", "pdf_pages": "online", "minutes": 45, "summary": ["Phenotype = genotype + environment + genotype x environment (P = G + E + GxE).", "DNA sits mainly in nuclear chromosomes; plastid and mitochondrial DNA are usually inherited maternally.", "A genome is the basic chromosome set inherited from one parent; polyploids carry more than two sets (auto- or allopolyploid).", "Mitosis gives two identical 2n cells; meiosis gives four haploid (n) cells.", "In angiosperms, pollen carries two sperm; double fertilisation makes a 2n zygote and a 3n endosperm.", "Reproductive mode (sexual, asexual, self or cross) decides which breeding methods work."], "terms": [{"term": "Genotype", "def": "The genetic make-up of an individual."}, {"term": "Phenotype", "def": "The observable trait, shaped by genotype and environment."}, {"term": "Genome", "def": "The basic set of chromosomes inherited as a unit from one parent."}, {"term": "Meiosis", "def": "Two divisions producing four haploid cells."}, {"term": "Double fertilisation", "def": "One sperm fertilises the egg (2n zygote); the other fuses with two polar nuclei (3n endosperm)."}, {"term": "Maternal inheritance", "def": "Organelle DNA passed on through the egg cytoplasm."}], "cards": [{"q": "Write the basic phenotype model.", "a": "P = G + E + (G x E)."}, {"q": "How many cells and what ploidy does meiosis produce?", "a": "Four haploid (n) cells."}, {"q": "What is the ploidy of endosperm after double fertilisation?", "a": "Triploid (3n)."}, {"q": "Barley is 2n = 14. How many chromosomes in a barley gamete?", "a": "7."}, {"q": "How is chloroplast DNA usually inherited?", "a": "Maternally, through the egg cytoplasm."}, {"q": "Autopolyploid vs allopolyploid?", "a": "Auto: extra sets from one species; allo: sets from different species."}, {"q": "How many nuclei does a typical embryo sac contain?", "a": "Eight haploid nuclei (egg, synergids, polar nuclei, antipodals)."}], "for_rush": "Potato (her thesis crop) is propagated by tubers, a key reproduction mode covered here.", "priority": "core"}, {"n": 2, "title": "Flower Morphology and Distribution", "pdf_pages": "online", "minutes": 45, "summary": ["Complete flowers have sepals, petals, stamens and pistils; incomplete flowers lack one or more.", "Perfect flowers have both sexes; imperfect flowers are male (staminate) or female (pistillate).", "Monoecious species carry both flower types on one plant (maize); dioecious species have separate male and female plants (spinach, date palm, asparagus).", "Self-pollination is enforced by closed flowers or early pollen shedding (soybean); cross-pollination by asynchrony, separate sexes, sterility or self-incompatibility.", "Asexual reproduction includes tubers, rhizomes, stolons, bulbs, corms, suckers, cuttings, tissue culture and apomixis.", "Apomixis makes seed without fertilisation, fixing a genotype including heterozygosity."], "terms": [{"term": "Perfect flower", "def": "Flower with both stamens and pistil."}, {"term": "Monoecious", "def": "Separate male and female flowers on the same plant."}, {"term": "Dioecious", "def": "Male and female flowers on different plants."}, {"term": "Autogamy", "def": "Self-pollination."}, {"term": "Allogamy", "def": "Cross-pollination."}, {"term": "Apomixis", "def": "Seed formation without fertilisation."}, {"term": "Totipotency", "def": "Ability of a somatic cell to regenerate a whole plant."}], "cards": [{"q": "Is spinach monoecious or dioecious?", "a": "Dioecious: separate male and female plants."}, {"q": "Why is dioecy 'reproductively expensive'?", "a": "Only about half the plants (the females) produce seed."}, {"q": "Name the vegetative organ used to propagate potato.", "a": "Tuber."}, {"q": "Which is the most common form of apomixis in angiosperms?", "a": "Apospory (embryo sac from a somatic nucellus/integument cell)."}, {"q": "What is the breeding advantage of obligate apomixis?", "a": "It fixes a genotype, including hybrid heterozygosity, through seed."}, {"q": "Give one mechanism that promotes cross-pollination.", "a": "Separate sexes, asynchronous maturity, male sterility or self-incompatibility."}, {"q": "Date palm offshoots are an example of which propagation type?", "a": "Suckers (vegetative propagation)."}], "for_rush": "Spinach and date palm are both dioecious, relevant to her hydroponics and UAE agriculture.", "priority": "core"}, {"n": 3, "title": "Controlled Hybridization: Self-incompatibility, Male-sterility, and Sex-inheritance", "pdf_pages": "online", "minutes": 50, "summary": ["Self-incompatibility (SI) stops seed set after selfing even though pollen is viable.", "In gametophytic SI the pollen's own S allele matters and rejection is in the style; in sporophytic SI the parent plant's genotype matters and rejection is on the stigma (Brassicas).", "Genetic male sterility (ms ms) is nuclear and recessive; hard to maintain pure sterile lines.", "Cytoplasmic male sterility (CMS) uses mitochondrial S cytoplasm with A (sterile), B (maintainer) and R (restorer) lines for hybrid seed.", "Chemical gametocides can induce male sterility but may be incomplete.", "Sex can be set by sex chromosomes (asparagus XY; YY supermales) or autosomal genes and hormones (cucumber)."], "terms": [{"term": "Self-incompatibility", "def": "Inability to set seed after self-pollination despite fertile pollen."}, {"term": "GSI", "def": "Gametophytic SI: pollen's own genotype decides compatibility."}, {"term": "SSI", "def": "Sporophytic SI: pollen parent's genotype decides compatibility."}, {"term": "CMS", "def": "Male sterility caused by mitochondrial genes, inherited maternally."}, {"term": "Restorer (Rf)", "def": "Dominant nuclear allele that restores fertility in CMS cytoplasm."}, {"term": "Maintainer (B line)", "def": "Normal-cytoplasm line used to multiply the sterile A line."}], "cards": [{"q": "Where is pollen rejected in GSI vs SSI?", "a": "GSI: in the style; SSI: on the stigma surface."}, {"q": "Which SI type do Brassica crops show?", "a": "Sporophytic self-incompatibility."}, {"q": "What is the genotype of a CMS A line?", "a": "S cytoplasm, rf rf (male sterile)."}, {"q": "A line (S rf rf) x R line (Rf Rf): is the F1 fertile?", "a": "Yes, S Rf rf is male fertile."}, {"q": "Why is CMS inherited only through the female?", "a": "Mitochondria pass through the egg cytoplasm."}, {"q": "How is SI overcome in Brassica breeding?", "a": "Bud pollination before the stigma barrier develops (or removing the stigma surface)."}, {"q": "Why do asparagus breeders want YY supermales?", "a": "Crossing them gives all-male progeny, and males are more productive."}], "for_rush": "CMS hybrid systems are standard knowledge for seed company roles in vegetables.", "priority": "core"}, {"n": 4, "title": "Gene Segregation and Genetic Recombination", "pdf_pages": "online", "minutes": 60, "summary": ["Genes are DNA sequences transcribed to mRNA (introns removed) and translated in codons.", "Gene action can be additive, completely dominant, partially dominant or overdominant.", "Mendel's principles: uniformity of F1, segregation (3:1), independent assortment (9:3:3:1).", "After n generations of selfing from an F1, heterozygosity is (1/2)^n and homozygosity 1 - (1/2)^n.", "Use chi-squared to test observed against expected ratios; testcrosses reveal unknown genotypes.", "Epistasis changes ratios: 9:7 (duplicate recessive), 12:3:1 (dominant), 15:1 (duplicate dominant)."], "terms": [{"term": "Allele", "def": "Alternative DNA version of a gene at a locus."}, {"term": "Penetrance", "def": "Percentage of individuals with a genotype that show the expected phenotype."}, {"term": "Expressivity", "def": "Degree to which a trait is expressed."}, {"term": "Testcross", "def": "Cross to a homozygous recessive to reveal genotype."}, {"term": "Epistasis", "def": "Interaction between genes at different loci altering phenotypes."}, {"term": "Pleiotropy", "def": "One gene affecting several traits."}], "cards": [{"q": "AA = 80, aa = 40, Aa = 70. What gene action is this?", "a": "Partial dominance (between midpoint 60 and 80)."}, {"q": "What is the F2 phenotypic ratio for a dihybrid with complete dominance?", "a": "9:3:3:1."}, {"q": "What fraction of plants is heterozygous at a locus in F4 (n = 3 selfing generations)?", "a": "(1/2)^3 = 12.5%."}, {"q": "What ratio indicates duplicate recessive (complementary) epistasis?", "a": "9:7."}, {"q": "What result of a testcross shows the parent was heterozygous?", "a": "A 1:1 ratio of the two phenotypes."}, {"q": "Multiplicative rule of probability?", "a": "P(A and B) = P(A) x P(B) for independent events."}, {"q": "What ratio shows duplicate dominant epistasis?", "a": "15:1."}], "for_rush": "Segregation ratios are the basis of the QTL and GWAS genetics in her portfolio.", "priority": "core"}, {"n": 5, "title": "Linkage", "pdf_pages": "online", "minutes": 60, "summary": ["Genes on the same chromosome are linked; crossing over at chiasmata creates recombinant gametes.", "Coupling phase = AB/ab; repulsion phase = Ab/aB.", "Recombination frequency (RF) = recombinants / total; 1% RF is about 1 cM; RF cannot exceed 50%.", "Three-point crosses give gene order and reveal double crossovers; coefficient of coincidence and interference describe crossover dependence.", "Linkage disequilibrium D = pAB - pA x pB decays as Dt = D0(1 - c)^t.", "DNA markers (SNPs, SSRs, INDELs) drive mapping, QTL detection and marker-assisted selection."], "terms": [{"term": "Recombination frequency", "def": "Proportion of recombinant progeny."}, {"term": "centiMorgan", "def": "Map unit equal to 1% recombination."}, {"term": "Coupling / repulsion", "def": "Dominant alleles on the same / opposite homologues."}, {"term": "Interference", "def": "1 - coefficient of coincidence; one crossover reducing another nearby."}, {"term": "Linkage disequilibrium", "def": "Non-random association of alleles at different loci."}, {"term": "SNP", "def": "Single nucleotide polymorphism, the most abundant DNA marker."}], "cards": [{"q": "What is the maximum observable recombination frequency?", "a": "50%, which looks like independent assortment."}, {"q": "2,000 BC1 progeny split 800/800/200/200. What is RF?", "a": "(200+200)/2000 = 20%, about 20 cM."}, {"q": "How is gene order found in a three-point cross?", "a": "Compare double-crossover classes with parentals: the gene that switches is in the middle (shortest total map)."}, {"q": "Expected double crossovers 0.021, observed 0.012. Coefficient of coincidence and interference?", "a": "CoC = 0.58; interference = 0.42."}, {"q": "Write the LD decay equation.", "a": "Dt = D0 (1 - c)^t."}, {"q": "Why are SNPs now preferred to SSRs?", "a": "They are abundant, can lie within genes and are easy to automate."}, {"q": "Where is recombination usually suppressed?", "a": "Near centromeres and in repetitive DNA."}], "for_rush": "LD decay determines GWAS marker density and resolution, central to her GWAS work.", "priority": "core"}, {"n": 6, "title": "Population Genetics", "pdf_pages": "online", "minutes": 60, "summary": ["A Mendelian population shares a gene pool; allele frequencies p + q = 1.", "p = P(AA) + 1/2 P(Aa); HWE gives p^2, 2pq, q^2 under random mating in large populations.", "Self-pollinating crops violate random mating and lose heterozygosity by half each selfing generation.", "Systematic forces (migration, mutation, selection) change frequencies predictably; drift is random in direction.", "Migration: delta q = m(qm - q0); mutation rates are about 1e-5 to 1e-6 per generation.", "Selection against recessives slows as q falls: t = 1/qt - 1/q0 generations when s = 1."], "terms": [{"term": "Gene pool", "def": "All alleles in a population."}, {"term": "Allele frequency", "def": "Proportion of one allele among all alleles at a locus."}, {"term": "Hardy-Weinberg equilibrium", "def": "Stable genotype frequencies p^2, 2pq, q^2 under random mating."}, {"term": "Genetic drift", "def": "Random change in allele frequency due to finite population size."}, {"term": "Migration rate (m)", "def": "Proportion of migrant genes entering a population each generation."}, {"term": "Homogeneous vs homozygous", "def": "Uniform population vs identical alleles in one individual."}], "cards": [{"q": "Genotypes 0.09 AA, 0.42 Aa, 0.49 aa. What is p?", "a": "p = 0.09 + 0.21 = 0.30."}, {"q": "Remove all aa from 0.09 AA + 0.42 Aa. New p?", "a": "p = (0.18 + 0.42)/(0.18 + 0.84) = 0.59."}, {"q": "Why doesn't HWE apply to wheat breeding populations?", "a": "Wheat is self-pollinating, so mating is not random."}, {"q": "Migration rate 0.0005 of a transgene (q = 1) into native maize (q = 0). Change per generation?", "a": "delta q = 0.0005."}, {"q": "Generations to reduce a recessive from q = 0.5 to 0.1 with complete selection?", "a": "t = 1/0.1 - 1/0.5 = 8."}, {"q": "Variance of allele frequency from drift?", "a": "p0 q0 / 2N; it rises as population size falls."}, {"q": "Which force is dispersive rather than systematic?", "a": "Genetic drift from small population size."}], "for_rush": "Allele frequency and HWE checks are routine filters in her SNP QC.", "priority": "core"}, {"n": 7, "title": "Inbreeding and Heterosis", "pdf_pages": "online", "minutes": 60, "summary": ["Inbreeding is mating of relatives; it raises homozygosity but does not change allele frequencies.", "F, the inbreeding coefficient, is the probability two alleles are identical by descent; F rises by 1/2N per generation in a finite population.", "Inbreeding depression comes from exposing deleterious recessives; it is strong in outcrossers (maize, alfalfa) and weak in selfers (wheat, oat).", "Selfing halves heterozygosity each generation; full-sib and half-sib mating are slower.", "Heterosis is F1 superiority; mid-parent heterosis compares with the parental mean, better-parent with the best parent.", "Dominance and overdominance hypotheses both explain heterosis; maize expression data show mostly additive gene action."], "terms": [{"term": "Inbreeding coefficient (F)", "def": "Probability two alleles at a locus are identical by descent."}, {"term": "Identical by descent", "def": "Alleles copied from the same ancestral allele."}, {"term": "Inbreeding depression", "def": "Reduced vigour and fertility after inbreeding."}, {"term": "Heterosis", "def": "Superior performance of F1 over parents."}, {"term": "Mid-parent heterosis", "def": "(F1 - MP)/MP x 100, where MP is the parental mean."}, {"term": "Overdominance", "def": "Heterozygote better than both homozygotes."}], "cards": [{"q": "Does inbreeding change allele frequencies?", "a": "No, it changes genotype frequencies (more homozygotes)."}, {"q": "Parents 70 and 70, F1 100. Mid-parent heterosis?", "a": "(100 - 70)/70 x 100 = about 43%."}, {"q": "F1 with 4 independent loci selfed: share of fully homozygous F2 plants?", "a": "(1/2)^4 = 1/16 = 6.25%."}, {"q": "Why does maize suffer more inbreeding depression than wheat?", "a": "Maize outcrosses and carries masked deleterious recessives; wheat selfs and has purged them."}, {"q": "Explain the dominance hypothesis of heterosis.", "a": "Each inbred carries different favourable dominant alleles; the F1 combines them, masking deleterious recessives."}, {"q": "Genotype frequency of aa with inbreeding F?", "a": "q^2(1 - F) + qF."}, {"q": "Coefficient of relationship for full sibs and half sibs?", "a": "Full sibs 0.5; half sibs 0.25."}], "for_rush": "Hybrid vegetable and date palm breeding decisions depend on heterosis and inbreeding concepts.", "priority": "core"}, {"n": 8, "title": "Inheritance of Quantitative Traits", "pdf_pages": "online", "minutes": 75, "summary": ["Quantitative traits (yield, drought tolerance) are controlled by many genes with small effects plus environment, giving continuous variation.", "Nilsson-Ehle's wheat colour cross (three genes) gave F2 classes in a 1:6:15:20:15:6:1 ratio.", "Genotypic value G = A + D + I; only additive effects (breeding values) pass predictably to progeny.", "Broad-sense H^2 = VG/VP; narrow-sense h^2 = VA/VP; heritability describes variation in a population, not how 'genetic' a trait is.", "Heritability is estimated by ANOVA (needs multiple environments) or parent-offspring regression (b = h^2 for mid-parent; 2b for one parent/half sibs).", "Breeder's equation R = h^2 S; expected gain per cycle = k x sigma_P x h^2 (k = 1.76 for 10% selected)."], "terms": [{"term": "Polygenes / QTL", "def": "Many loci each with small effects on a quantitative trait."}, {"term": "Transgressive segregation", "def": "Progeny outside the parental range."}, {"term": "Breeding value", "def": "Sum of average allele effects; predicts progeny performance."}, {"term": "Broad-sense heritability", "def": "VG/VP, all genetic variance."}, {"term": "Narrow-sense heritability", "def": "VA/VP, additive variance only."}, {"term": "Selection differential (S)", "def": "Mean of selected parents minus population mean."}], "cards": [{"q": "State the breeder's equation.", "a": "R = h^2 x S."}, {"q": "h^2 = 0.4, S = 10 kg/ha. Expected response?", "a": "R = 4 kg/ha per cycle."}, {"q": "Which heritability better predicts response in sexually reproducing crops, and why?", "a": "Narrow-sense, because parents pass on alleles (additive effects), not whole genotypes."}, {"q": "Why must heritability trials be grown in several environments?", "a": "To separate genetic variance from environmental and GxE variance."}, {"q": "What is k when the best 10% are selected?", "a": "About 1.76."}, {"q": "Regression of offspring on mid-parent gives b = 0.6. What is h^2?", "a": "0.6."}, {"q": "What three trait types are quantitative?", "a": "Continuous, meristic (counts) and threshold traits."}, {"q": "A trait has high heritability in one population. Is it high everywhere?", "a": "Not necessarily; heritability is specific to the population and environments measured."}], "for_rush": "Heritability and breeding values are what GWAS and genomic selection roles quantify daily.", "priority": "core"}, {"n": 9, "title": "Mutations and Variation", "pdf_pages": "online", "minutes": 55, "summary": ["A mutation is a heritable change in DNA; it can be spontaneous or induced, somatic or germinal.", "Point mutations include transitions, transversions, silent, missense, nonsense and frameshift (INDEL) changes.", "Chromosomal mutations include deletions, duplications, inversions, translocations and transpositions.", "Spontaneous mutation rates are about 1 in 100,000 to 1 in 1,000,000 gametes per generation.", "Gene pools: primary (easy crosses), secondary (difficult), tertiary (need embryo rescue).", "Genetic engineering transfers genes (often via Agrobacterium) across species; GM crops expanded from 1.7 million ha (1996) to 170 million ha (2012)."], "terms": [{"term": "Transition", "def": "Purine to purine or pyrimidine to pyrimidine substitution."}, {"term": "Transversion", "def": "Purine to pyrimidine substitution or vice versa."}, {"term": "Nonsense mutation", "def": "Creates a premature stop codon."}, {"term": "Frameshift", "def": "INDEL not a multiple of three that shifts the reading frame."}, {"term": "Germinal mutation", "def": "Mutation in reproductive cells, passed to offspring."}, {"term": "Primary gene pool", "def": "Crop and relatives that cross easily with fertile progeny."}], "cards": [{"q": "A C to T change: transition or transversion?", "a": "Transition (pyrimidine to pyrimidine)."}, {"q": "Which point mutation creates a stop codon?", "a": "Nonsense mutation."}, {"q": "Why is a 1-bp insertion often severe?", "a": "It shifts the reading frame, changing all downstream codons."}, {"q": "How many codons code amino acids and how many are stop codons?", "a": "61 code amino acids; 3 are stops (UAA, UAG, UGA)."}, {"q": "Are loss-of-function mutations usually dominant or recessive?", "a": "Usually recessive."}, {"q": "What technique is often needed to use the tertiary gene pool?", "a": "Embryo rescue (or other special techniques)."}, {"q": "Name the bacterium widely used to transform plants.", "a": "Agrobacterium tumefaciens."}], "for_rush": "Variant types here are exactly what she annotated in the rare disease re-analysis project, now in plants.", "priority": "core"}, {"n": 10, "title": "Ploidy: Polyploidy, Aneuploidy, and Haploidy", "pdf_pages": "online", "minutes": 55, "summary": ["x is the basic chromosome number, n the gametic number and 2n the somatic number.", "About 75% of angiosperms and of domesticated crops are polyploid.", "Bread wheat is an allohexaploid AABBDD (2n = 6x = 42); the Brassica triangle of U links AA, BB and CC genomes.", "Aneuploids (nullisomic, monosomic, trisomic) help map genes; colchicine doubles chromosomes.", "Doubled haploids give complete homozygosity in one step; triticale combines wheat and rye.", "Autotetraploids show polysomic inheritance (nulliplex to quadruplex genotypes); allopolyploids behave disomically."], "terms": [{"term": "Euploid", "def": "Having complete chromosome sets."}, {"term": "Aneuploid", "def": "Having extra or missing individual chromosomes."}, {"term": "Allopolyploid", "def": "Polyploid combining genomes from different species."}, {"term": "Homoeologous", "def": "Corresponding chromosomes from related but different genomes."}, {"term": "Doubled haploid", "def": "Haploid plant whose chromosomes are doubled to give a fully homozygous line."}, {"term": "Colchicine", "def": "Chemical that blocks spindle formation, doubling chromosome number."}], "cards": [{"q": "Write the genome formula and chromosome number of bread wheat.", "a": "AABBDD, 2n = 6x = 42."}, {"q": "What is a trisomic?", "a": "2n + 1: one chromosome present three times."}, {"q": "Why are doubled haploids valuable to breeders?", "a": "They give completely homozygous lines in one generation."}, {"q": "How does colchicine double chromosomes?", "a": "It disrupts microtubules so chromosomes do not separate at division."}, {"q": "Name the five genotype classes for one locus in an autotetraploid.", "a": "Nulliplex aaaa, simplex Aaaa, duplex AAaa, triplex AAAa, quadruplex AAAA."}, {"q": "What species are combined in hexaploid triticale?", "a": "Tetraploid wheat (AABB) and rye (RR)."}, {"q": "Roughly what share of crop species are polyploid?", "a": "About 75%."}], "for_rush": "Cultivated potato is an autotetraploid, so polysomic inheritance matters for her potato work.", "priority": "core"}]}, {"slug": "isu_quantmethods", "short": "Quantitative Methods for Plant Breeding", "emoji": "📐", "color": "#553c9a", "warn": "", "title": "Quantitative Methods for Plant Breeding", "authors": "Walter Suza and Kendall Lamkey (eds.)", "edition": "2023, Iowa State University Digital Press", "file": "", "url": "https://iastate.pressbooks.pub/quantitativeplantbreeding/", "licence": "CC BY-NC 4.0", "overview": "An applied statistics textbook for agronomy and plant breeding, covering descriptive statistics, probability, hypothesis tests, categorical and continuous data, regression, ANOVA, mean comparisons, blocking, transformations and non-linear models. Examples use real field trial data in Excel and R.", "how": "Work chapters 1-3 quickly if your statistics is solid, then focus on 8-11 (ANOVA, factorials, mean comparisons, RCBD), which are the daily tools of variety trials. Redo the worked examples in R.", "free": true, "chapters": [{"n": 1, "title": "Basic Principles", "pdf_pages": "online", "minutes": 45, "summary": ["The scientific method cycles through observation, hypothesis, experiment and conclusion.", "Observational studies describe; designed experiments apply treatments to experimental units such as plots.", "Three design principles: replication, randomisation and design control (blocking).", "Data are qualitative or quantitative, on nominal, ordinal or continuous scales.", "Mean, median and mode describe the centre; variance (n - 1 denominator), SD and CV describe spread.", "Report results only to the precision of your measurements and use SI units."], "terms": [{"term": "Experimental unit", "def": "The unit (e.g. plot) to which a treatment is applied."}, {"term": "Replication", "def": "Applying each treatment to two or more units."}, {"term": "Randomisation", "def": "Assigning treatments to units at random to avoid bias."}, {"term": "Coefficient of variation", "def": "SD divided by the mean x 100%."}, {"term": "Degrees of freedom", "def": "n - 1 for a sample variance."}, {"term": "Parameter vs statistic", "def": "Population value vs sample estimate."}], "cards": [{"q": "Name the three principles of experimental design.", "a": "Replication, randomisation and design control (blocking)."}, {"q": "Why divide by n - 1 for a sample variance?", "a": "It gives an unbiased estimate of the population variance (degrees of freedom)."}, {"q": "Mean yield 8 t/ha, SD 0.8 t/ha. CV?", "a": "10%."}, {"q": "Is a 1-9 disease score nominal, ordinal or continuous?", "a": "Ordinal: ranked but intervals are not equal quantities."}, {"q": "Why randomise treatments?", "a": "To avoid unintent
