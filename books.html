n variation; technical replicates only measure assay noise.", "Randomisation, blocking and pairing control confounding; pairing can greatly raise power.", "Use power analysis (pwr.t.test) to set sample size; d = 0.4 needs about 99 per group unpaired but about 51 pairs paired.", "Know the mean-variance relationship (constant, Poisson, quadratic) and choose a matching variance-stabilising transformation.", "Practise reproducible research: scripts, Quarto/R Markdown, Git, tidy long-format data, and analyse data early ('dailies')."], "terms": [{"term": "Bias", "def": "Systematic error that replication cannot remove."}, {"term": "Blocking", "def": "Grouping similar units so treatment comparisons happen within groups."}, {"term": "Confounding", "def": "Two factors varying together so their effects cannot be separated."}, {"term": "Biological replicate", "def": "Independent biological unit measured once."}, {"term": "Tidy data", "def": "Each variable a column, each observation a row."}, {"term": "Batch effect", "def": "Known systematic variation from processing groups."}], "cards": [{"q": "Noise vs bias: which can more replicates fix?", "a": "Noise; bias is systematic and remains however many replicates you add."}, {"q": "Why are technical replicates not enough for a DE experiment?", "a": "They do not capture biological variation between individuals."}, {"q": "Sample size for d = 0.4, alpha 0.05, power 0.8: unpaired vs paired?", "a": "About 99 per group unpaired vs about 51 pairs paired."}, {"q": "Why can pairing (e.g. same pot) raise power so much?", "a": "It removes large between-unit (pot) variation from the comparison."}, {"q": "Which mean-variance pattern fits sequencing counts?", "a": "Poisson-like: variance proportional to the mean (plus overdispersion)."}, {"q": "Fisher's warning about consulting a statistician after the experiment?", "a": "It is like asking for a post-mortem: they can only say what the experiment died of."}, {"q": "Which tidyr functions switch bet <script>
(function(){

const addDays=(d,n)=>{const [y,m,dd]=d.split("-").map(Number);const x=new Date(y,m-1,dd+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};

let view={mode:"home",slug:null};

      h("div",{class:"row",style:"margin-top:8px"},h("span",{class:"e"},b.emoji),h("div",{style:"flex:1;min-width:0"},h("h3",{style:"margin:0"},`Ch ${c.n}: ${c.title}`),h("div",{class:"muted",style:"font-size:.85rem"},`${b.short} · PDF pages ${c.pdf_pages} · about ${c.minutes} min (split it over a few mornings)`))),

    h("div",{class:"card",style:"text-align:center"},h("div",{class:"muted fr"},"Cards due today"),h("div",{class:"big tnum"},String(Math.min(due.length,S.daily))),

    h("div",{class:"card",style:"text-align:center"},h("div",{class:"muted fr"},"Streak · learned"),h("div",{class:"big tnum"},`${streak()}🔥 · ${learned()}`),h("div",{class:"muted",style:"font-size:.75rem;margin-top:6px"},"days in a row · cards you know well")));
  app.append(rv);

    g.slugs.forEach((s,i)=>{const b=BY[s]; if(!b) return; const p=bookPct(b);
      sh.append(h("button",{class:"book",style:`background:${b.color};animation-delay:${i*50}ms`,onclick:()=>{view={mode:"book",slug:s};render();}},
        h("div",{},h("div",{style:"font-size:1.5rem"},b.emoji),h("b",{},b.short)),h("div",{},h("div",{class:"m tnum"},`${b.chapters.length} ch · ${b.chapters.reduce((a,c)=>a+c.cards.length,0)} cards`),h("div",{class:"bar"},h("i",{style:`width:${Math.max(2,p*100)}%`})))));});
    app.append(sh);}
  app.append(h("div",{class:"note",style:"margin-top:16px"},"💛 How to use this: read one chapter section in the morning (the Taiz block in your timetable). When you finish a chapter, tap 'I've read it'. Its flashcards then join your daily review. 15 minutes of cards a day is enough."));
}

function bookView(app){
  const b=BY[view.slug];
  app.append(h("div",{class:"listhead"},h("button",{class:"btn ghost sm",onclick:()=>{view={mode:"home"};render();}},"← Shelf"),h("div",{class:"g"},h("h2",{style:"margin:0"},b.emoji+" "+b.short))));
  const info=h("div",{class:"card"},h("b",{},b.title),h("div",{class:"muted",style:"font-size:.82rem"},[b.authors,b.edition].filter(Boolean).join(" · ")),
    h("p",{style:"font-size:.9rem"},b.overview),h("div",{class:"note"},"🧭 How to read it: "+b.how),

    b.licence?h("div",{class:"muted",style:"font-size:.75rem"},"Free & legal: "+b.licence):null,

  app.append(info);
  const seg=h("div",{class:"seg",style:"margin:14px 0 8px;width:max-content"}); let f=view.filter||"all";
  [["all","All"],["core","Core only"],["todo","Not read"]].forEach(([k,l])=>seg.append(h("button",{class:f===k?"on":"",onclick:()=>{view.filter=k;render();}},l)));

    app.append(h("div",{class:"ch"+(done?" done":""),style:`animation-delay:${Math.min(i,12)*30}ms`,role:"button",tabindex:"0",onclick:()=>openCh(b,c),onkeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCh(b,c);}}},h("div",{class:"n"},done?"✓":String(c.n)),
      h("div",{class:"tx"},h("b",{},c.title),h("div",{class:"s"},`pages ${c.pdf_pages} · ~${c.minutes} min · ${c.cards.length} cards`)),h("span",{class:"tag t-"+c.priority},c.priority)));});
}

  const sb=document.getElementById("sb"); sb.replaceChildren(); const k=chKey(b,c); const done=!!S.read[k];
  sb.append(h("div",{class:"muted fr",style:"font-size:.8rem"},b.short+" · Chapter "+c.n),h("h2",{style:"margin:2px 0 6px"},c.title),
    h("div",{},h("span",{class:"tag t-"+c.priority},c.priority)," ",h("span",{class:"tag"},"PDF pages "+c.pdf_pages)," ",h("span",{class:"tag"},"~"+c.minutes+" min")));
  if(c.for_rush) sb.append(h("div",{class:"note"},"🎯 Why this matters for you: "+c.for_rush));
  sb.append(h("span",{class:"lbl"},"What this chapter teaches"),h("ul",{},...c.summary.map(s=>h("li",{},s))));
  sb.append(h("span",{class:"lbl"},"Key terms"),h("div",{class:"terms"},...c.terms.map(t=>h("div",{},h("b",{},t.term+": "),t.def))));
  sb.append(h("span",{class:"lbl"},`Flashcards (${c.cards.length})`),h("div",{class:"muted",style:"font-size:.82rem"},done?"These are in your daily review.":"Tap 'I've read it' after reading. Then these cards join your daily review."));
  const pv=h("details",{},h("summary",{style:"cursor:pointer;font-weight:800;margin:6px 0"},"Peek at the questions"),h("ol",{},...c.cards.map(cd=>h("li",{style:"margin:6px 0"},cd.q,h("details",{},h("summary",{style:"cursor:pointer;color:var(--muted);font-size:.8rem"},"answer"),h("div",{style:"font-size:.9rem"},cd.a))))));
  sb.append(pv);
  const btn=h("button",{class:"btn",onclick:(e)=>{ if(S.read[k]) delete S.read[k]; else {S.read[k]=today(); burst(e.target); toast("Chapter done! "+c.cards.length+" cards added 🌱");} save(); close(); render(); }},done?"↩︎ Mark as not read":"✓ I've read it");
  sb.append(h("div",{class:"acts"},btn,h("button",{class:"btn ghost",onclick:close},"Close")));
  const sh=document.getElementById("sheet"),sc=document.getElementById("scrim"); sh.hidden=false;sc.hidden=false; sh.scrollTop=0; requestAnimationFrame(()=>{sh.classList.add("on");sc.classList.add("on");});
}
function close(){const sh=document.getElementById("sheet"),sc=document.getElementById("scrim");sh.classList.remove("on");sc.classList.remove("on");setTimeout(()=>{sh.hidden=true;sc.hidden=true;},300);}
document.getElementById("scrim").addEventListener("click",close);
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});

let queue=null,qi=0;
function reviewView(app){
  if(!queue){queue=dueCards().slice(0,S.daily);qi=0;}
  app.append(h("div",{class:"listhead"},h("button",{class:"btn ghost sm",onclick:()=>{queue=null;view={mode:"home"};render();}},"← Done for now"),h("div",{class:"g"},h("h2",{style:"margin:0"},"🃏 Daily review"))));
  if(qi>=queue.length){ S.log[today()]=true; save(); app.append(h("div",{class:"card",style:"text-align:center"},h("div",{style:"font-size:3rem"},"🌸"),h("h2",{},"All done for today!"),h("p",{class:"muted"},"Come back tomorrow. Spaced repetition works because of the gaps."),h("button",{class:"btn",onclick:()=>{queue=null;view={mode:"home"};render();}},"Back to the shelf"))); return; }
  const it=queue[qi];
  app.append(h("div",{class:"muted tnum",style:"font-size:.8rem"},`${qi+1} of ${queue.length}`),h("div",{class:"prog"},h("i",{style:`width:${qi/queue.length*100}%`})));
  const fc=h("div",{class:"fc",role:"button",tabindex:"0","aria-label":"Flip card"},
    h("div",{class:"face"},h("div",{class:"src"},`${it.b.emoji} ${it.b.short} · Ch ${it.c.n}`),h("div",{class:"q"},it.cd.q),h("div",{class:"hint"},"Think of your answer, then tap to flip")),
    h("div",{class:"face back"},h("div",{class:"src"},"Answer"),h("div",{style:"font-size:1rem"},it.cd.a)));
  const flip=()=>{fc.classList.add("flip");rate.hidden=false;};
  fc.addEventListener("click",flip); fc.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}});
  const rate=h("div",{class:"rate",hidden:""},
    h("button",{class:"r1",onclick:()=>grade(0)},"😕 Again"),h("button",{class:"r2",onclick:()=>grade(1)},"🤔 Hard"),h("button",{class:"r3",onclick:()=>grade(2)},"😊 Got it"));
  app.append(h("div",{class:"fc-wrap"},fc),rate);
  function grade(g){const cur=S.box[it.k]?S.box[it.k][0]:0; let nb=g===0?1:g===1?Math.max(1,cur):Math.min(5,cur+1); if(g===0){queue.push(it);} S.box[it.k]=[nb,addDays(today(),g===0?0:IV[nb])]; S.log[today()]=true; save(); qi++; if(g===2&&nb>=3&&cur<3) toast("You know this one now ⭐"); render();}
}
const tb=document.getElementById("themeBtn");
function applyTheme(t){if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;tb.textContent=dark?"☀️":"🌙";}

try{const v=JSON.parse(sessionStorage.getItem("nook-view")||"null"); if(v&&v.mode!=="review"&&(v.mode!=="book"||BY[v.slug])) view=v;}catch(e){}
render();
(async()=>{try{
  if(!window.claude||!claude.use) return;
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]); if(!d||!u){setSync("this device");return;}
  const uid=await u.id(); if(!uid){setSync("this device");return;}
  ref=d.doc("data/users/"+uid+"/nook"); let first=true; setSync("syncing…");
  ref.onSnapshot(snap=>{ if(snap.metadata.hasPendingWrites) return;
    if(snap.exists){ if(!dirty&&!writing){ S=Object.assign({read:{},box:{},daily:20,log:{}},JSON.parse(JSON.stringify(snap.data()))); lsSet(); if(document.getElementById("sheet").hidden&&view.mode!=="review") render(); } }
    else if(first){ dirty=true; flush(); }
    first=false; setSync(ro?"read-only":"synced",!ro);
  },()=>setSync("this device"));
}catch(e){setSync("this device");}})();
})();
