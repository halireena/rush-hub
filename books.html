ng-term no-till raised aggregate stability from 22% to 50%.", "Fix compaction and low fertility before switching to no-till; transition takes 3-5 years.", "Roller-crimpers and planting green help organic and no-till systems."], "terms": [{"term": "Conservation tillage", "def": "Any system leaving more than 30% residue cover."}, {"term": "No-till", "def": "Planting directly into undisturbed soil and residue."}, {"term": "Strip-till", "def": "Loosening only narrow bands where crop rows will go."}, {"term": "Roller-crimper", "def": "A roller that flattens and kills a cover crop to form a mulch."}], "cards": [{"q": "What residue cover qualifies as conservation tillage?", "a": "More than 30%."}, {"q": "How much does adequate residue cut erosion?", "a": "By more than 50%."}, {"q": "What should be fixed before converting to no-till?", "a": "Existing compaction and low fertility."}, {"q": "How long is the typical no-till transition?", "a": "About 3-5 years."}, {"q": "Change in aggregate stability with long-term no-till?", "a": "From about 22% to 50%."}], "for_rush": "", "priority": "skim"}, {"n": 17, "title": "Managing Water: Irrigation and Drainage", "pdf_pages": "online", "minutes": 30, "summary": ["Irrigated land is about 18% of cultivated area but gives about 40% of world food.", "Salt build-up is the main threat to irrigated soils in arid regions; irrigation must be paired with drainage for leaching.", "Gypsum replaces sodium with calcium in sodic soils; test soil and water regularly and calculate leaching needs.", "Each 1% loss of organic matter cuts plant-available water by about 16,500 gallons per acre.", "Drip and subsurface drip, fertigation, mulch, monitoring (tensiometers, TDR) and deficit irrigation save water.", "Drainage helps aeration but can be a shortcut for nutrient and pesticide losses."], "terms": [{"term": "Fertigation", "def": "Delivering fertiliser through the irrigation water."}, {"term": "Leaching requirement", "def": "Extra water that must pass through the root zone to keep salts at acceptable levels."}, {"term": "Deficit irrigation", "def": "Deliberately applying less than full crop evapotranspiration to save water."}, {"term": "Evapotranspiration (ET)", "def": "Water lost by evaporation from soil plus transpiration from plants."}, {"term": "Tensiometer", "def": "A device measuring how tightly water is held in soil, used to schedule irrigation."}, {"term": "Controlled drainage", "def": "Using weirs or structures to hold the water table at a chosen level."}], "cards": [{"q": "What share of cultivated land is irrigated, and what share of food does it produce?", "a": "About 18% of land and about 40% of food."}, {"q": "Why must irrigation be combined with drainage in arid areas?", "a": "So excess water can carry salts below the root zone instead of letting them accumulate or raise the water table."}, {"q": "How does gypsum fix sodic soil?", "a": "Its calcium replaces sodium on exchange sites so sodium can be leached away."}, {"q": "How much plant-available water is lost per 1% drop in organic matter?", "a": "About 16,500 gallons per acre."}, {"q": "Name three ways to monitor soil water for scheduling.", "a": "Tensiometers, moisture blocks, TDR probes (or ET-based weather calculations)."}, {"q": "Why does flood irrigation tend to cause salinity problems?", "a": "It over-applies water and can raise saline groundwater tables."}, {"q": "What is fertigation and why is it efficient?", "a": "Applying fertiliser with irrigation water, so nutrients go where and when roots need them."}], "for_rush": "Fertigation is exactly what your hydroponic system does; UAE farms rely on drip plus fertigation with brackish groundwater.", "priority": "core"}, {"n": 18, "title": "Nutrient Management: An Introduction", "pdf_pages": "online", "minutes": 20, "summary": ["Fertiliser cannot replace good soil management; organic matter underpins nutrient cycling.", "The 4Rs: right source, right rate, right time, right place.", "Of 17 essential elements, N, P and K most commonly limit yields; S, Mg, Zn, B and Mn limit regionally.", "Banding, split applications and sidedressing improve efficiency; soil testing avoids waste.", "Commercial fertilisers are predictable but energy-intensive; organic sources feed biology but vary."], "terms": [{"term": "4Rs", "def": "Right source, right rate, right time, right place for nutrient application."}, {"term": "Banding", "def": "Placing fertiliser in a narrow band near the seed rather than over the whole field."}, {"term": "Sidedressing", "def": "Applying fertiliser beside growing crop rows during the season."}, {"term": "Macronutrients", "def": "Nutrients needed in large amounts, chiefly N, P and K."}], "cards": [{"q": "What are the 4Rs of nutrient stewardship?", "a": "Right source, right rate, right time, right place."}, {"q": "How many elements are essential to plants, and which three most often limit yield?", "a": "17; nitrogen, phosphorus and potassium."}, {"q": "Why split nitrogen on sandy soils?", "a": "To reduce leaching losses."}, {"q": "When is banding especially useful?", "a": "In cool soils at planting."}, {"q": "What share of corn production energy can fertiliser represent?", "a": "About 25-50%."}], "for_rush": "The 4Rs map directly onto hydroponic nutrient recipes: the right salt, concentration (EC), timing and delivery.", "priority": "useful"}, {"n": 19, "title": "Management of Nitrogen and Phosphorus", "pdf_pages": "online", "minutes": 25, "summary": ["Fertilisers supplement the soil's natural supply; credit organic matter, manure, covers and residues first.", "N is lost by leaching, denitrification and ammonia volatilisation; N2O is about 300 times more potent than CO2.", "P is lost mainly through runoff and erosion, causing algal blooms.", "Surface urea can lose up to 30% of N, and over 50% on soils above pH 8.", "The pre-sidedress nitrate test (PSNT) samples 0-12 inches in late spring; legume credits are about 40-120 lb N/acre."], "terms": [{"term": "Denitrification", "def": "Microbial conversion of nitrate to N2 and N2O gases in waterlogged soils."}, {"term": "Volatilisation", "def": "Loss of N as ammonia gas, especially from surface urea or manure."}, {"term": "Eutrophication", "def": "Nutrient enrichment of water causing algal blooms and oxygen depletion."}, {"term": "PSNT", "def": "Pre-sidedress nitrate test: soil nitrate at 0-12 inches in late spring to guide N rates."}, {"term": "Nitrification inhibitor", "def": "Product that slows conversion of ammonium to nitrate, reducing losses."}], "cards": [{"q": "What are the three main N loss pathways?", "a": "Leaching, denitrification and ammonia volatilisation."}, {"q": "How much more climate-warming is N2O than CO2?", "a": "About 300 times."}, {"q": "How is P mainly lost from fields?", "a": "Runoff and erosion."}, {"q": "How much N can surface urea lose on high-pH soils (>8)?", "a": "Over 50% (up to 30% on other soils)."}, {"q": "Why is urea risky on UAE calcareous soils?", "a": "High pH (>8) greatly increases ammonia volatilisation unless it is incorporated or watered in."}, {"q": "What depth does the PSNT sample?", "a": "0-12 inches."}, {"q": "Typical N credit from legume covers or rotation crops?", "a": "About 40-120 lb N/acre."}], "for_rush": "UAE soils are typically alkaline, so the pH > 8 urea warning applies directly.", "priority": "useful"}, {"n": 20, "title": "Other Fertility Issues: Nutrients, CEC, Acidity and Alkalinity", "pdf_pages": "online", "minutes": 30, "summary": ["Potassium is held on CEC and much is recycled in stover; Ca and Mg are corrected with lime or gypsum.", "Sulphur deficiency is rising as air pollution falls; typical rates are 15-25 lb S/acre.", "Zinc and boron deficiencies are common in sandy, low-organic-matter, alkaline soils; iron deficiency above pH 7.5 for some crops.", "Most crops do well at pH 6-7.5; most N fertilisers are acid-forming (4-7 lb lime per lb N).", "Saline soils are fixed by leaching; sodic soils by gypsum (about 2 tons/acre per meq Na per foot of soil)."], "terms": [{"term": "CEC", "def": "Cation exchange capacity: the soil's capacity to hold nutrient cations, from clay and humus."}, {"term": "Dolomitic lime", "def": "Limestone containing magnesium, used when soil is acidic and Mg-deficient."}, {"term": "Gypsum", "def": "Calcium sulphate; supplies calcium to displace sodium in sodic soils without changing pH much."}, {"term": "Overliming", "def": "Raising pH too high, causing micronutrient deficiencies."}, {"term": "Micronutrients", "def": "Nutrients needed in small amounts, e.g. Zn, B, Mn, Fe, Cu."}], "cards": [{"q": "Under what soil conditions is zinc deficiency common?", "a": "Neutral to high pH, sandy soils low in organic matter."}, {"q": "Above what pH do some crops show iron deficiency?", "a": "About pH 7.5 (blueberries above pH 6.5)."}, {"q": "What pH range suits most crops?", "a": "About 6 to 7.5."}, {"q": "How much lime is needed to neutralise the acidity from 1 lb of N fertiliser?", "a": "About 4-7 lb."}, {"q": "How are saline soils reclaimed vs sodic soils?", "a": "Saline: leach salts with water. Sodic: add gypsum so Ca replaces Na, then leach."}, {"q": "Gypsum rule of thumb for sodic soils?", "a": "About 2 tons/acre for each meq of sodium per 100 g, per foot of soil depth."}, {"q": "Typical sulphur application rate?", "a": "About 15-25 lb S per acre."}, {"q": "How does organic matter relate to CEC?", "a": "Humified organic matter adds CEC, more so as pH rises above about 4.5."}], "for_rush": "Iron and zinc deficiency at high pH is why hydroponic nutrient solutions use chelated iron and are kept slightly acidic.", "priority": "core"}, {"n": 21, "title": "Analysing Your Soil and Crop", "pdf_pages": "online", "minutes": 30, "summary": ["Take 15-20 cores per sample, one sample per 10-20 acres at most.", "Sample at plough depth (tilled), 6 inches (no-till) or 3-4 inches (pasture); same lab and season each time.", "Labs use sufficiency, build-up/maintenance or base cation saturation ratio systems; sufficiency is often most economic.", "PSNT categories: very low 0-10 ppm, low 11-22, optimum 23-28, high 29-35+ ppm nitrate-N.", "P extraction differs by region (Olsen for arid/alkaline soils; Mehlich or Bray for humid), so values are not directly comparable.", "Test at least every three years (annually for high-value crops)."], "terms": [{"term": "Composite sample", "def": "Many soil cores mixed together to represent one field area."}, {"term": "Sufficiency level system", "def": "Recommends nutrients only when a crop response is likely."}, {"term": "Base cation saturation ratio", "def": "Approach targeting set proportions of Ca, Mg and K on the CEC."}, {"term": "Olsen test", "def": "Bicarbonate P extraction suited to alkaline, arid-region soils."}, {"term": "Mehlich / Bray", "def": "Acid P extraction methods used in humid-region soils."}], "cards": [{"q": "How many cores make up a good composite soil sample?", "a": "About 15-20."}, {"q": "Maximum area one sample should represent?", "a": "About 10-20 acres."}, {"q": "Sampling depth in no-till fields?", "a": "About 6 inches."}, {"q": "What PSNT nitrate-N value is optimum?", "a": "About 23-28 ppm."}, {"q": "Which P test suits alkaline UAE soils?", "a": "The Olsen (bicarbonate) test."}, {"q": "How often should soils be tested?", "a": "At least every three years; annually for high-value crops."}, {"q": "Why use the same lab and season each time?", "a": "Methods and seasonal variation affect results, so consistency allows real trends to be seen."}, {"q": "Why does rock phosphate work poorly on UAE soils?", "a": "It dissolves poorly in high-pH soils (pH > 7)."}], "for_rush": "Soil and tissue testing data are the agronomy equivalent of omics data - a job-relevant skill for UAE agri-tech analytics.", "priority": "core"}, {"n": 22, "title": "Soils for Urban Farms, Gardens and Green Spaces", "pdf_pages": "online", "minutes": 20, "summary": ["Urban soils are often compacted, low in organic matter and contaminated from past land uses.", "Lead is the most common contaminant (from old petrol and paint).", "Exposure routes: swallowing soil (highest risk for children), inhaling dust, eating crops, skin contact.", "Research site history and test pH, organic matter, nutrients and metals before growing food.", "Raised beds with imported soil, compost and cover crops are practical fixes."], "terms": [{"term": "Soil contamination", "def": "Presence of toxic substances from industrial, commercial or residential uses."}, {"term": "Phytotoxicity", "def": "Damage to plants from high levels of metals such as Cu, Zn or Ni."}, {"term": "Remediation", "def": "Physical, chemical or biological methods to clean up or improve soil."}, {"term": "Raised bed", "def": "A bed of imported soil above the ground, isolating roots from contaminated soil."}], "cards": [{"q": "What is the most common urban soil contaminant?", "a": "Lead."}, {"q": "Which exposure route is highest risk for children?", "a": "Swallowing contaminated soil."}, {"q": "What should a minimum urban soil test include?", "a": "pH, organic matter, nutrients, micronutrients and metals including lead."}, {"q": "Name a simple way to grow food safely on contaminated urban land.", "a": "Raised beds filled with imported soil/compost, often over a fabric barrier."}, {"q": "Why research a site's history first?", "a": "Past uses reveal likely contaminants and where to test."}], "for_rush": "Rooftop and balcony growing in Dubai faces the same 'imported media' choices - or skip soil entirely with hydroponics.", "priority": "skim"}, {"n": 23, "title": "How Good Are Your Soils? Field and Laboratory Evaluation", "pdf_pages": "online", "minutes": 25, "summary": ["Assess soil health at three levels: general observations, field indicators and lab tests.", "Penetrometer readings above 300 psi mean soil is too hard for roots.", "Field worksheet indicators include cover, crusting and ponding (<5% acceptable), aggregate stability (≥80% intact) and biopores.", "Lab soil health tests combine biological (organic matter, active carbon, respiration), physical and chemical indicators, scored 1-100.", "PLFA and DNA profiling describe microbial communities; there is no single standard soil health test yet."], "terms": [{"term": "Active carbon", "def": "Easily decomposed carbon that responds quickly to management changes."}, {"term": "Soil respiration", "def": "CO2 released by soil organisms, an indicator of biological activity."}, {"term": "Aggregate stability", "def": "How well soil crumbs resist breaking down when wetted."}, {"term": "PLFA", "def": "Phospholipid fatty acid analysis, used to profile microbial groups."}, {"term": "Normative scoring", "def": "Rating a result against similar soils and cropping systems, here on a 1-100 scale."}], "cards": [{"q": "What penetrometer reading indicates soil too hard for roots?", "a": "Greater than 300 psi."}, {"q": "What aggregate stability result is considered good on the worksheet?", "a": "At least 80% of aggregates staying intact after submersion."}, {"q": "Name three biological lab indicators.", "a": "Organic matter, active carbon, respiration (also aggregate stability as a tilth indicator)."}, {"q": "What does fungal dominance in a soil suggest?", "a": "Less disturbed systems with good nutrient cycling (bacterial dominance suggests intensive agriculture)."}, {"q": "Which molecular methods profile soil microbes?", "a": "PLFA and DNA-based profiling."}, {"q": "When is the best time for field assessments?", "a": "When soil is moist but not waterlogged, e.g. early spring or late autumn."}], "for_rush": "DNA-based soil microbiome profiling is a direct bioinformatics career link (metagenomics).", "priority": "useful"}, {"n": 24, "title": "Putting It All Together", "pdf_pages": "online", "minutes": 15, "summary": ["Combine practices rather than using them in isolation; results take several years.", "Six core approaches: reduce tillage, avoid compaction, grow cover crops, improve rotations, use organic amendments well, use inorganic amendments strategically.", "Think of a soil 'balance sheet': credits (manure, covers, reduced tillage) vs debits (compaction, intensive tillage).", "Fresh organic materials boost biology quickly; stable lignin-rich materials build long-term structure.", "Bringing in any organic material in any amount is not automatically the answer."], "terms": [{"term": "Soil balance sheet", "def": "Analogy weighing practices that build soil (credits) against those that degrade it (debits)."}, {"term": "Fresh organic matter", "def": "Easily decomposed material that stimulates immediate biological activity."}, {"term": "Stable organic matter", "def": "Lignin-rich material that decomposes slowly and builds structure."}], "cards": [{"q": "List the six core approaches to better soil health.", "a": "Reduce tillage, avoid compaction, cover crops, better rotations, organic amendments, strategic inorganic amendments."}, {"q": "Give two 'credits' and two 'debits' on the soil balance sheet.", "a": "Credits: manure, cover crops, reduced tillage. Debits: compaction, intensive tillage."}, {"q": "Fresh vs stable organic materials - what does each do?", "a": "Fresh boosts biology and nutrient release quickly; stable builds long-term structure."}, {"q": "What warning does the chapter give about organic inputs?", "a": "Adding any organic material in any amount is not necessarily the solution - balance and type matter."}], "for_rush": "", "priority": "skim"}]}, {"slug": "sare_covercrops", "short": "Managing Cover Crops", "emoji": "🌱", "color": "#68a357", "warn": "", "title": "Managing Cover Crops Profitably (3rd edition)", "authors": "SARE Outreach (Andy Clark, ed.); soil fertility chapter by Marianne Sarrantonio", "edition": "3rd edition, 2007 (SARE Outreach)", "file": "", "url": "https://www.sare.org/resources/managing-cover-crops-profitably-3rd-edition/", "licence": "Free download/online reading from the publisher (SARE Outreach, USDA-funded); copyright SARE", "overview": "A farmer-oriented handbook on choosing, growing and managing cover crops for soil fertility, pest control, erosion control and profit. General chapters explain benefits and management; most of the book is species-by-species profiles with comparison charts.", "how": "Read the soil fertility and benefits chapters, skim the rest of the general chapters, and use the species chapters only as a reference.", "free": true, "chapters": [{"n": 1, "title": "Building Soil Fertility and Tilth with Cover Crops", "pdf_pages": "online", "minutes": 30, "summary": ["Cover crops reduce erosion; as little as 40% soil cover before winter substantially reduces erosion.", "Active organic matter releases nutrients fast; stable humus improves structure and nutrient holding.", "Microbial polysaccharides and fungal glomalin glue soil into aggregates.", "Cereal rye planted by 1 October can capture over 70 lb N/acre, but only about 15 lb if planted in November.", "Legume N fixation needs the right inoculant, enough Mo, Fe, K, S and Zn, good aeration and pH above 5.", "Kill legumes at early to mid bloom; estimate available N as total N ÷ 2 (tilled) or ÷ 4 (northern no-till)."], "terms": [{"term": "Glomalin", "def": "A sticky, water-insoluble protein from mycorrhizal fungi that stabilises aggregates."}, {"term": "Active fraction", "def": "Quickly decomposing organic matter that supplies nutrients."}, {"term": "Stable fraction (humus)", "def": "Slowly decomposing organic matter that builds soil structure and CEC."}, {"term": "Rhizobia", "def": "Bacteria that form nodules on legume roots and fix atmospheric nitrogen."}, {"term": "Water-filled pore space", "def": "Proportion of pore space filled with water; about 60% is optimal for decomposition."}], "cards": [{"q": "How much soil cover before winter substantially reduces erosion?", "a": "About 40%."}, {"q": "N captured by rye planted by 1 October vs in November?", "a": "Over 70 lb N/acre vs about 15 lb N/acre."}, {"q": "What protein from mycorrhizal fungi stabilises aggregates?", "a": "Glomalin."}, {"q": "Minimum soil pH for effective legume nitrogen fixation?", "a": "Above about 5."}, {"q": "N content of annual legumes before flowering vs at flowering?", "a": "About 3.5-4% vs 3-3.5%."}, {"q": "When should legume cover crops be killed for maximum N?", "a": "At early to mid bloom."}, {"q": "How do you estimate plant-available N from a green manure?", "a": "Total N ÷ 2 under conventional tillage, or ÷ 4 for northern no-till."}, {"q": "How fast can a ploughed-in legume release N?", "a": "Up to about 140 lb N/acre within 7-10 days."}], "for_rush": "Rhizobia-legume symbiosis genes are a classic plant-microbe genomics topic.", "priority": "useful"}, {"n": 2, "title": "Benefits of Cover Crops", "pdf_pages": "online", "minutes": 20, "summary": ["Cover crops can raise profits from the first year and build benefits over time.", "Following crops can use about 30-60% of the nitrogen produced by legumes, cutting fertiliser costs.", "They suppress weeds (competition, shading, allelopathy) and some diseases and nematodes.", "Radish covers reduced sugar beet cyst nematode in Wyoming.", "Rye removed 25-100% of residual N after corn in a Georgia study, protecting groundwater."], "terms": [{"term": "Nonpoint source pollution", "def": "Diffuse pollution from runoff across many fields, not one outlet."}, {"term": "Nitrogen scavenging", "def": "A cover crop taking up leftover soil nitrate that would otherwise leach."}, {"term": "Smother crop", "def": "A dense cover that outcompetes weeds."}, {"term": "Allelopathy", "def": "Chemical suppression of other plants by a crop's residues or roots."}], "cards": [{"q": "What share of legume N can the next crop use?", "a": "About 30-60%."}, {"q": "Give three ways cover crops suppress weeds.", "a": "Competing for resources, blocking light, releasing allelopathic compounds."}, {"q": "Which cover reduced sugar beet cyst nematodes in Wyoming?", "a": "Radish."}, {"q": "How much residual N did rye remove after corn in Georgia?", "a": "25-100%."}, {"q": "How can you maximise cumulative benefits of cover crops?", "a": "Increase cover crop diversity, frequency between cash crops, and time growing in the field."}], "for_rush": "", "priority": "useful"}, {"n": 3, "title": "Selecting the Best Cover Crops for Your Farm", "pdf_pages": "online", "minutes": 20, "summary": ["Narrow goals to one or two main objectives - cover crops are not 'wonder crops'.", "Map an 18-36 month timeline of rotations, rainfall, frost-free periods and labour to find planting windows.", "Describe the niche: temperature, moisture, traffic, winterkill and equipment.", "Sow winter covers at least six weeks before a hard frost; use 3-8 week summer gaps for buckwheat or cowpeas.", "Mixtures often work best; test on small areas first."], "terms": [{"term": "Niche", "def": "The time and place in a rotation where a cover crop can fit."}, {"term": "Overseeding", "def": "Sowing a cover into a standing cash crop."}, {"term": "Winterkill", "def": "A cover crop dying naturally from cold."}, {"term": "Mixture", "def": "Two or more cover species sown together."}], "cards": [{"q": "How long a planning timeline does the book suggest?", "a": "About 18-36 months."}, {"q": "How long before a hard frost should winter covers be sown?", "a": "At least six weeks."}, {"q": "What covers suit a 3-8 week summer gap?", "a": "Quick annuals such as buckwheat or cowpeas."}, {"q": "Why limit goals to one or two?", "a": "No single cover does everything; focused goals make species choice clearer."}, {"q": "What should you do before adopting a cover crop widely?", "a": "Test a few options on small areas."}], "for_rush": "", "priority": "skim"}, {"n": 4, "title": "Crop Rotation with Cover Crops", "pdf_pages": "online", "minutes": 20, "summary": ["The hardest part is fitting covers into existing rotations; early-maturing cash crops help.", "Notation: '>' means followed by, '/' means grown together.", "Corn Belt: rye after corn scavenges N; hairy vetch before corn adds N.", "Dryland: medics and field peas add N while conserving water; long rotations balance moisture.", "Allow 2-3 weeks between cover termination and cash crop planting in humid regions; check herbicide plant-back intervals."], "terms": [{"term": "Rotation notation", "def": "'>' shows sequence; '/' shows crops grown together."}, {"term": "Nurse crop", "def": "A quick crop (e.g. oats) that shelters a slower legume during establishment."}, {"term": "Plant-back interval", "def": "Time required after a herbicide before a crop can safely be sown."}, {"term": "Dryland farming", "def": "Farming without irrigation where water is the main limit."}], "cards": [{"q": "What does 'corn > rye > soybeans' mean?", "a": "Corn followed by rye followed by soybeans."}, {"q": "Which cover follows corn to catch leftover N?", "a": "Cereal rye."}, {"q": "Which covers suit dryland systems?", "a": "Medics and field peas."}, {"q": "Gap between termination and cash crop planting in humid regions?", "a": "About 2-3 weeks."}, {"q": "Why check herbicide labels?", "a": "Residual herbicides can kill a following cover crop (plant-back intervals)."}], "for_rush": "", "priority": "skim"}, {"n": 5, "title": "Managing Pests with Cover Crops", "pdf_pages": "online", "minutes": 20, "summary": ["Covers host beneficial predators (insidious flower bugs, bigeyed bugs, lady beetles) that eat pests.", "Georgia farmers cut insecticide costs by $50-100/acre; after 2-3 years damping-off stopped being serious in no-till covers.", "Sorghum-sudangrass, brassicas, mustards and radish have nematicidal effects; rye suppresses root-knot nematodes.", "Rye/vetch/clover mulch kept tomatoes nearly weed-free for six weeks; 36 days of weed control can equal season-long control.", "Living mulches suppress weeds between crop rows."], "terms": [{"term": "Generalist predator", "def": "A beneficial insect that eats many prey types and can survive on pollen/nectar."}, {"term": "Damping-off", "def": "Seedling disease caused by fungi such as Pythium and Rhizoctonia."}, {"term": "Nematicidal", "def": "Toxic or suppressive to plant-parasitic nematodes."}, {"term": "Living mulch", "def": "A cover crop kept growing between cash crop rows."}], "cards": [{"q": "Name two beneficial insects supported by cover crops.", "a": "Any two of: insidious flower bugs, bigeyed bugs, lady beetles."}, {"q": "Which covers have nematicidal effects?", "a": "Sorghum-sudangrass, brassicas, mustards, radish (and rye on root-knot nematodes)."}, {"q": "How many days of weed control can equal season-long control?", "a": "About 36 days."}, {"q": "Insecticide savings reported by Georgia farmers?", "a": "About $50-100 per acre."}, {"q": "Which fungi cause damping-off?", "a": "Pythium and Rhizoctonia solani."}], "for_rush": "", "priority": "skim"}, {"n": 6, "title": "Managing Cover Crops in Conservation Tillage Systems", "pdf_pages": "online", "minutes": 20, "summary": ["Conservation tillage keeps at least 30% residue cover; cover crops add more.", "No-till corn with winter covers cut soil loss to 0.9 vs 8 tons/acre/year with conventional tillage (Kentucky).", "Legume covers can add 50-100 lb N/acre; residues can raise infiltration 50-800%.", "C:N above 30:1 tends to immobilise N (may need an extra 25-30 lb N/acre); grass-legume mixes sit near 25:1.", "Terminate 2-3 weeks before planting; use row cleaners, strip-till or roller-crimpers."], "terms": [{"term": "C:N ratio", "def": "Carbon to nitrogen ratio of residue, predicting decomposition and N release."}, {"term": "Immobilisation", "def": "Microbes tying up soil N while decomposing high-carbon residue."}, {"term": "Row cleaner", "def": "Planter attachment that moves residue away from the seed row."}, {"term": "Roller-crimper", "def": "Tool that flattens and crimps a cover crop to kill it."}], "cards": [{"q": "Soil loss with no-till plus covers vs conventional tillage in Kentucky?", "a": "0.9 vs 8 tons/acre/year."}, {"q": "Above what C:N ratio is N immobilisation likely?", "a": "Above about 30:1."}, {"q": "Typical C:N of a grass-legume mixture?", "a": "About 25:1."}, {"q": "N contributed by legume covers in these systems?", "a": "About 50-100 lb N/acre."}, {"q": "When should covers be terminated before the cash crop?", "a": "About 2-3 weeks before planting."}], "for_rush": "", "priority": "skim"}, {"n": 7, "title": "Species Overview: Charts and Selected Cover Crops", "pdf_pages": "online", "minutes": 25, "summary": ["Comparison charts rate species by goal, performance (N supplied, dry matter, scavenging, erosion control, weed suppression) and cultural traits (heat, drought, shade, flooding tolerance).", "Cereal rye: hardiest cereal, up to 10,000 lb dry matter/acre (3,000-4,000 typical in the Northeast), scavenges 25-50 lb N (up to 100); germinates at 34°F.", "Berseem clover (Egyptian clover): fixes 100-200+ lb N/acre, up to 8 tons forage irrigated, more salt-tolerant than alfalfa and red clover, winterkills below 20°F.", "Brassicas (radish, mustards, rapeseed): glucosinolates give biofumigation; can capture 140+ lb N/acre; taproots 'biodrill' compacted soil.", "Species profiles also cover legumes (vetches, clovers, cowpeas, peas, medics) and nonlegumes (ryegrass, barley, oats, buckwheat, sorghum-sudangrass, wheat)."], "terms": [{"term": "Biofumigation", "def": "Release of toxic sulphur compounds from brassica glucosinolates that suppress soil pests."}, {"term": "Glucosinolates", "def": "Sulphur-containing compounds in brassicas that break down into biologically active products."}, {"term": "Biodrilling", "def": "Large taproots penetrating compacted layers and leaving channels for later crops."}, {"term": "Winter annual", "def": "A plant sown in autumn that grows over winter and completes its cycle in spring."}], "cards": [{"q": "Which legume cover is more salt-tolerant than alfalfa and red clover?", "a": "Berseem (Egyptian) clover."}, {"q": "How much N can berseem clover fix?", "a": "About 100-200 lb N/acre or more."}, {"q": "Seeding rate for drilled berseem clover?", "a": "About 8-12 lb/acre."}, {"q": "How much N does cereal rye typically scavenge?", "a": "About 25-50 lb N/acre, up to 100."}, {"q": "How long do rye's allelopathic effects usually last?", "a": "About 30 days."}, {"q": "What gives brassica covers their pest-suppressing effect?", "a": "Glucosinolates breaking down into toxic sulphur compounds (biofumigation)."}, {"q": "How deep can brassica roots go?", "a": "Up to about six feet."}], "for_rush": "Berseem clover originates in Egypt and is relevant as a salt-tolerant forage in Middle East systems.", "priority": "skim"}]}, {"slug": "fao_salinesoil", "short": "Saline Soil Management (FAO)", "emoji": "🧂", "color": "#b7791f", "warn": "", "title": "Handbook for Saline Soil Management", "authors": "R. Vargas, E.I. Pankova, S.A. Balyuk, P.V. Krasilnikov and G.M. Khasankhanova (eds.)", "edition": "2018 (FAO and Lomonosov Moscow State University)", "file": "", "url": "https://www.fao.org/4/i7318en/I7318EN.pdf", "licence": "FAO copyright 2018; may be reproduced for private study, research, teaching or non-commercial use with acknowledgement of FAO", "overview": "An FAO handbook on diagnosing, mapping, monitoring and reclaiming salt-affected soils, built mainly on experience from Eurasia and Central Asia. It covers salinity and sodicity criteria, remote sensing and monitoring, amelioration (drainage, leaching, gypsum, biological methods), cost-effectiveness and tutorial annexes.", "how": "Focus on Chapter 1 (definitions and thresholds), Chapter 4 (reclamation measures) and the monitoring/remote sensing parts of Chapter 2; skim regional case studies and the economics chapter.", "free": true, "chapters": [{"n": 1, "title": "Salt-Affected Soils: Diagnostics, Criteria and Distribution", "pdf_pages": "3-15", "minutes": 35, "summary": ["Saline soils contain soluble salts above toxic thresholds; the classic criterion is ECe above 4 dS/m in a saturated paste extract, though sensitive crops react from about 2 dS/m.", "USDA salinity grades by ECe: low 2-4, medium 4-8, high 8-16, very high above 16 dS/m.", "Sodic/alkaline soils: ESP above 15% and pH typically above 8.5; solonetz soils have a sodium-rich (natric) subsoil horizon.", "Solonchaks have very high surface salt: over 1% (chloride-sulphate) or over 0.5% (soda salinity).", "Primary salinity is natural (parent material, saline groundwater, wind-blown salt); secondary salinity is caused by irrigation without drainage and poor water.", "About 242 million ha are salt-affected in Eurasia; 40-60% of irrigated land in Central Asia is affected."], "terms": [{"term": "ECe", "def": "Electrical conductivity of the saturated soil-paste extract, the standard soil salinity measure (dS/m)."}, {"term": "ESP", "def": "Exchangeable sodium percentage: share of CEC occupied by sodium."}, {"term": "SAR", "def": "Sodium adsorption ratio: sodium relative to calcium plus magnesium in solution."}, {"term": "Solonchak", "def": "A soil with high soluble salt content near the surface."}, {"term": "Solonetz", "def": "A soil with a dense, sodium-rich subsurface (natric) horizon."}, {"term": "Primary vs secondary salinity", "def": "Natural salinity vs salinity caused by human activity such as irrigation."}, {"term": "Soda salinity", "def": "Salinity dominated by sodium carbonate/bicarbonate, with pH above 8.5."}], "cards": [{"q": "What ECe threshold classically defines a saline soil?", "a": "Above 4 dS/m (saturated paste extract at 25°C)."}, {"q": "Give the USDA ECe salinity grades.", "a": "Low 2-4, medium 4-8, high 8-16, very high >16 dS/m."}, {"q": "What ESP and pH typically indicate alkaline (sodic) salinity?", "a": "ESP above 15% and pH above 8.5."}, {"q": "What salt content defines a solonchak?", "a": "Over 1% soluble salts (chloride-sulphate) or over 0.5% (soda) in the surface layer."}, {"q": "Difference between primary and secondary salinity?", "a": "Primary is natural; secondary is human-induced, e.g. irrigation without drainage or with saline water."}, {"q": "Neutral vs alkaline salinity chemistry?", "a": "Neutral (pH < 8.5): chloride, chloride-sulphate, sulphate types. Alkaline (pH > 8.5): soda and sulphate-soda types."}, {"q": "How much of Central Asia's irrigated land is salt-affected?", "a": "About 40-60%."}, {"q": "Why can soda salinity be harmful at lower salt contents than chloride salinity?", "a": "Sodium carbonates raise pH and disperse soil, so toxicity starts at lower concentrations (0.5% vs 1% for solonchaks)."}], "for_rush": "These are the exact definitions used in UAE soil surveys and in salinity phenotyping for salt-tolerance genomics.", "priority": "core"}, {"n": 2, "title": "Methods of Studying, Mapping and Monitoring Saline and Alkaline Soils", "pdf_pages": "16-28", "minutes": 30, "summary": ["Study in three stages: preparation (existing data, remote sensing, draft maps), fieldwork (soil pits, profiles) and laboratory analysis.", "Multispectral satellite imagery (e.g. Landsat, Terra, Pleiades) with corrections and classification is highly efficient for salinity mapping.", "UAV surveys are flown at about 80-100 m between 09:00 and 16:00 and merged into orthomosaics.", "Monitoring networks use permanent sites on regular grids (e.g. 16 x 16 km in France) or irregular networks.", "ECe is the international standard, though many countries use 1:5 or 1:2.5 soil:water extracts with conversion factors.", "Farm-level monitoring is annual; regional monitoring is less frequent but more complex."], "terms": [{"term": "Multispectral imagery", "def": "Satellite or drone images captured in several wavelength bands."}, {"term": "Supervised classification", "def": "Image analysis where known training areas teach an algorithm to map classes."}, {"term": "Orthomosaic", "def": "Geometrically corrected, stitched aerial image of an area."}, {"term": "Ground-truthing", "def": "Checking remote-sensing maps with field observations and samples."}, {"term": "1:5 extract", "def": "Soil mixed with five parts water for EC measurement; needs conversion to compare with ECe."}], "cards": [{"q": "What are the three stages of a saline soil survey?", "a": "Preparation, fieldwork and laboratory analysis."}, {"q": "What altitude and time window are used for UAV salinity surveys?", "a": "About 80-100 m, between 09:00 and 16:00."}, {"q": "Why must 1:5 extract EC be converted before comparing with ECe?", "a": "Different water-to-soil ratios dilute salts differently, so values are not equal."}, {"q": "Name two satellite systems mentioned for salinity mapping.", "a": "Landsat, Terra or Pleiades."}, {"q": "Why is ground-truthing essential?", "a": "Remote sensing must be calibrated and checked against measured soil salinity."}, {"q": "How often is farm-level salinity monitoring done?", "a": "Annually."}], "for_rush": "UAV multispectral mapping and classification is exactly your late blight thesis toolkit, transferable to salinity mapping in the UAE.", "priority": "core"}, {"n": 3, "title": "Assessing and Forecasting Salinisation and Alkalinisation", "pdf_pages": "29-34", "minutes": 20, "summary": ["Models assess irrigated land and natural resources and forecast salt and moisture regimes.", "Salt balance depends on water exchange between root zone, atmosphere and subsoil.", "Downward water flow desalinises; upward (capillary) flow salinises.", "A nomogram using the dimensionless Peclet number estimates changes in mean salt content.", "Forecasts help plan drainage and irrigation before salinity becomes severe."], "terms": [{"term": "Salt balance", "def": "Salt inputs minus outputs for a root zone over time."}, {"term": "Peclet number", "def": "A dimensionless number comparing transport by water flow with spreading by diffusion/dispersion."}, {"term": "Nomogram", "def": "A graphical calculation chart."}, {"term": "Capillary rise", "def": "Upward movement of groundwater through soil pores, bringing salts to the surface."}], "cards": [{"q": "Which direction of water flow desalinises soil?", "a": "Downward flow (leaching)."}, {"q": "What process salinises soils above a shallow water table?", "a": "Upward capillary rise and evaporation leaving salts behind."}, {"q": "What dimensionless number appears in the salt-change nomogram?", "a": "The Peclet number."}, {"q": "Why forecast salinisation?", "a": "To plan drainage and irrigation changes before yields fall."}], "for_rush": "Salt-transport modelling is a quantitative niche that suits a bioinformatician moving into agri-tech analytics.", "priority": "skim"}, {"n": 4, "title": "The Rational Use of Saline and Alkaline Soils", "pdf_pages": "35-52", "minutes": 30, "summary": ["Amelioration measures are grouped hierarchically as groups, types and techniques.", "Main groups: hydrotechnical (irrigation and drainage), chemical (gypsum, acidification), agronomic (crop choice and cultivation) and biological (phytomelioration, agroforestry).", "Leaching moves soluble salts downward and needs drainage to remove them.", "Gypsum treats sodium-dominated soils; its dose depends on CEC and sodium saturation.", "Integrated water and soil management works better than single measures in arid regions."], "terms": [{"term": "Amelioration", "def": "Improving degraded soil to restore productivity."}, {"term": "Hydrotechnical measures", "def": "Engineering water control: irrigation methods, drainage systems."}, {"term": "Chemical amelioration", "def": "Using amendments such as gypsum or acids to change soil chemistry."}, {"term": "Phytomelioration", "def": "Using salt-tolerant plants to improve saline soils."}, {"term": "Leaching", "def": "Applying water to wash salts below the root zone."}], "cards": [{"q": "Name the four groups of amelioration measures.", "a": "Hydrotechnical, chemical, agronomic (agrotechnical) and biological."}, {"q": "Why does leaching need drainage?", "a": "Without drainage, leached salts and water raise the water table and salts return."}, {"q": "What determines the gypsum dose for a sodic soil?", "a": "CEC and the level of exchangeable sodium."}, {"q": "What is phytomelioration?", "a": "Using salt-tolerant plants (and trees) to stabilise and improve saline land."}, {"q": "Why are integrated approaches recommended?", "a": "Several degradation processes interact in arid lands, so single measures are often insufficient."}], "for_rush": "Biological amelioration with salt-tolerant plants is where plant genomics (salt tolerance genes) meets UAE farm practice.", "priority": "core"}, {"n": 5, "title": "Innovative Methods and Technologies for Amelioration", "pdf_pages": "53-78", "minutes": 25, "summary": ["Armenia: electromelioration on localised soda solonetz-solonchak patches.", "Kazakhstan: differentiated amelioration for rice on saline soils and forest plantations on saline-alkaline land.", "Precision agriculture, including laser land levelling, targets within-field variability.", "Biosaline approaches use salt-tolerant crops to keep marginal land productive in Central Asia and the Caucasus.", "Agroforestry on degraded salt-affected land in Uzbekistan restores functions and diversifies income."], "terms": [{"term": "Electromelioration", "def": "Using electric current to help remove salts from localised soil areas."}, {"term": "Laser land levelling", "def": "Precisely flattening fields so water spreads evenly and leaches salts uniformly."}, {"term": "Biosaline agriculture", "def": "Farming saline land and water with salt-tolerant crops."}, {"term": "Agroforestry", "def": "Combining trees with crops or pasture."}], "cards": [{"q": "Why does laser land levelling help on saline fields?", "a": "Even water distribution avoids high spots where salts accumulate and improves leaching."}, {"q": "What is biosaline agriculture?", "a": "Producing crops on saline land/water using salt-tolerant species."}, {"q": "Where was electromelioration applied?", "a": "Armenia, on soda solonetz-solonchak patches."}, {"q": "What does agroforestry offer degraded saline land?", "a": "Restores ecosystem functions and gives diversified income."}, {"q": "Which crop has special differentiated amelioration systems in Kazakhstan?", "a": "Paddy rice."}], "for_rush": "Biosaline agriculture is ICBA's core mission in Dubai - a likely employer link.", "priority": "useful"}, {"n": 6, "title": "Assessing Cost-Effectiveness of Amelioration Measures", "pdf_pages": "79-87", "minutes": 15, "summary": ["Evaluate both direct costs and wider ecological and economic benefits.", "Ecological benefits include restored ecosystem services such as better infiltration.", "Uzbekistan case studies assess laser land levelling and agroforestry returns.", "Financial and environmental outcomes should be judged together."], "terms": [{"term": "Cost-effectiveness", "def": "Benefit gained per unit cost of a measure."}, {"term": "Ecosystem services", "def": "Benefits nature provides, e.g. water regulation, soil fertility."}, {"term": "Ecological-economic assessment", "def": "Valuing environmental as well as financial outcomes."}], "cards": [{"q": "What two kinds of benefit should amelioration assessments include?", "a": "Direct economic (yield) benefits and ecological benefits/ecosystem services."}, {"q": "Which two measures were assessed in Uzbekistan?", "a": "Laser land levelling and agroforestry."}, {"q": "Why value ecosystem services?", "a": "Benefits like improved infiltration have real value not captured by yield alone."}], "for_rush": "", "priority": "skim"}, {"n": 7, "title": "Part II Annexes: Tutorials on Classification, Water Suitability, Monitoring, Mapping, Agroforestry and Extension", "pdf_pages": "88-127", "minutes": 30, "summary": ["Annex A gives worked salinity classifications by salt chemistry and degree, separating neutral (pH < 8.5) and alkaline (pH > 8.5) salinity.", "Annex B assesses irrigation water in three risk classes; limits are stricter for clay soils than sandy soils.", "Groundwater mineralisation ranges from fresh (<1 g/L) to brine (>35 g/L).", "Electromagnetic induction allows rapid, non-destructive salinity mapping; remote sensing uses supervised classification.", "Monitoring frequency: local annually, regional every 5-10 years, continental every 15-20 years.", "Tree clusters ('green umbrellas') on solonetz complexes and farmer field schools (Kyrgyzstan) show agroforestry and extension in practice."], "terms": [{"term": "Electromagnetic induction (EMI)", "def": "Measuring soil apparent electrical conductivity with sensors (e.g. EM38) to map salinity rapidly."}, {"term": "Groundwater mineralisation", "def": "Total dissolved salt content of groundwater, in g/L."}, {"term": "Farmer field school", "def": "Group-based, hands-on training for farmers on demonstration plots."}, {"term": "Irrigation water risk class", "def": "Category of water suitability based on salts, toxic ions and pH relative to soil texture."}], "cards": [{"q": "Groundwater mineralisation for fresh water vs brine?", "a": "Fresh <1 g/L; brine >35 g/L."}, {"q": "Why are water-suitability limits stricter for clay soils?", "a": "Clays drain and leach poorly, so salts accumulate more readily."}, {"q": "What does EMI offer for salinity mapping?", "a": "Rapid, non-destructive coverage of large areas with little sampling."}, {"q": "Recommended monitoring frequencies at local, regional and continental scales?", "a": "Annual; every 5-10 years; every 15-20 years."}, {"q": "What extension approach is described for the Kyrgyz Republic?", "a": "Training workshops, farmer field schools and demonstration plots."}], "for_rush": "EMI and remote-sensing salinity data are spatial datasets you could analyse with your ML skills.", "priority": "useful"}]}, {"slug": "fao_salinewater", "short": "Saline Waters for Crops (FAO 48)", "emoji": "🌊", "color": "#2a69ac", "warn": "", "title": "The Use of Saline Waters for Crop Production (FAO Irrigation and Drainage Paper 48)", "authors": "J.D. Rhoades, A. Kandiah and A.M. Mashali", "edition": "1992 (FAO)", "file": "", "url": "https://www.fao.org/4/t0667e/t0667e00.htm", "licence": "FAO copyright; free online from the publisher", "overview": "FAO guidelines for using saline and drainage waters safely for irrigation. It classifies saline waters, reviews real-world experience in five countries, explains how to assess water suitability (salinity, sodicity, toxicity, Watsuit model) and sets out management practices and environmental safeguards.", "how": "Read the executive summary first, then Chapters 2, 4 and 6 closely; Chapter 3 case studies and Chapter 5 environmental aspects can be read faster.", "free": true, "chapters": [{"n": 1, "title": "Executive Summary and Introduction", "pdf_pages": "online", "minutes": 20, "summary": ["Saline waters here mean waters of roughly 1,500-7,000 mg/L TDS not normally used for irrigation.", "Irrigation covered about 15% of cultivated land but produced 36% of world food (around 1990).", "Less than 60% of diverted irrigation water is used in crop transpiration.", "Problems come from over-irrigation, poor drainage and mixing saline drainage into good water - not from saline water itself.", "Suitability rests on permeability/tilth, salinity and toxicity/nutrition, assessed with models like Watsuit."], "terms": [{"term": "Saline water (this guide)", "def": "Water with about 1,500-7,000 mg/L total dissolved solids."}, {"term": "TDS", "def": "Total dissolved solids, in mg/L."}, {"term": "Drainage water reuse", "def": "Using collected drainage water again for irrigation, usually of tolerant crops."}, {"term": "Watsuit", "def": "A steady-state computer model predicting soil-water composition from irrigation water and leaching fraction."}], "cards": [{"q": "What TDS range does this guide call 'saline water'?", "a": "About 1,500-7,000 mg/L."}, {"q": "What share of food came from irrigated land around 1990, and on what share of land?", "a": "About 36% of food from about 15% of cultivated land."}, {"q": "What fraction of diverted irrigation water is actually transpired by crops?", "a": "Less than 60%."}, {"q": "What are the three suitability criteria?", "a": "Permeability and tilth, salinity, toxicity/nutritional balance."}, {"q": "According to the guide, what really causes salinity and waterlogging problems?", "a": "Excess water use, poor distribution, inadequate drainage and polluting good water with saline drainage."}], "for_rush": "", "priority": "useful"}, {"n": 2, "title": "Saline Waters as Resources", "pdf_pages": "online", "minutes": 25, "summary": ["Water classes: non-saline <0.7 dS/m (<500 mg/L); slightly saline 0.7-2 (500-1,500); moderately saline 2-10 (1,500-7,000); highly saline 10-25 (7,000-15,000); very highly saline 25-45 (15,000-35,000); brine >45 dS/m.", "Rule of thumb: 1 dS/m ≈ 10 mmolc/L ≈ 700 mg/L.", "Sodicity (high Na, high pH, low salinity) swells and disperses clays; SAR is used as an index of sodium hazard.", "Toxic ions include Na, Cl and B; Se, As and Mo can accumulate in plants.", "Sources: saline groundwater (most common), seawater intrusion, drainage water.", "Egypt blends drainage water with Nile water (e.g. 1:1 for 700-1,500 mg/L; 1:2 or 1:3 for 1,500-3,000 mg/L)."], "terms": [{"term": "dS/m", "def": "Decisiemens per metre, the unit of electrical conductivity used for salinity."}, {"term": "ECw", "def": "Electrical conductivity of irrigation water."}, {"term": "Sodicity", "def": "Soil condition caused by excess exchangeable sodium, leading to clay dispersion."}, {"term": "SAR", "def": "Sodium adsorption ratio: Na / sqrt((Ca + Mg)/2), concentrations in mmolc/L."}, {"term": "Seawater intrusion", "def": "Movement of seawater into coastal aquifers, often from over-pumping."}], "cards": [{"q": "Give the FAO class and EC range for moderately saline water.", "a": "2-10 dS/m (1,500-7,000 mg/L) - typical drainage and groundwater."}, {"q": "Upper EC limit for non-saline water?", "a": "0.7 dS/m (<500 mg/L)."}, {"q": "Convert 3 dS/m to approximate TDS.", "a": "About 2,100 mg/L (3 x 700)."}, {"q": "EC range of very highly saline water?", "a": "25-45 dS/m (15,000-35,000 mg/L); seawater is near the top of this range."}, {"q": "Why does sodium damage soil structure?", "a": "It makes clays swell and disperse, blocking pores."}, {"q": "What is the most common source of saline irrigation water?", "a": "Groundwater."}, {"q": "Egyptian policy for drainage water of 700-1,500 mg/L?", "a": "Blend 1:1 with Nile water."}, {"q": "What three toxic ions are most common in irrigation water?", "a": "Sodium, chloride and boron."}], "for_rush": "Your hydroponic EC meter uses the same dS/m (= mS/cm) unit; UAE groundwater often falls in the slightly-to-moderately saline classes.", "priority": "core"}, {"n": 3, "title": "Examples of Saline Water Use for Irrigation", "pdf_pages": "online", "minutes": 25, "summary": ["USA: Pecos Valley used about 2,500 mg/L (≈4.1 dS/m) water for cotton, alfalfa and grains; night sprinkling with up to 5 dS/m water avoided leaf damage.", "Arizona cotton irrigated with 4.0-11.1 dS/m water yielded near state averages.", "Israel: 2-8 dS/m groundwater with drip and sprinklers; cotton on 5 dS/m water (SAR 26) with gypsum and pre-plant leaching.", "Tunisia: Medjerda water (3.0 dS/m) for date palms, cereals and vegetables; germination and emergence are critical.", "India (Haryana): up to 8 dS/m well water; farmers accept 30-40% yield loss at 6-8 dS/m; monsoon rains leach salts.", "Egypt: blends drainage water to about 1.0 dS/m; Siwa Oasis uses 2-10 dS/m groundwater for olives, dates and cereals."], "terms": [{"term": "Alternate-furrow irrigation", "def": "Watering every other furrow to push salts away from the seed row."}, {"term": "Decapping", "def": "Removing the salty soil crust from beds before seedlings emerge."}, {"term": "Cyclic use", "def": "Alternating good and saline water depending on crop and growth stage."}, {"term": "Conjunctive use", "def": "Using surface water and groundwater together."}], "cards": [{"q": "What salinity water did Israeli farmers use for cotton, and what was needed?", "a": "About 5 dS/m (SAR 26), with annual gypsum and pre-plant leaching to 150-180 cm."}, {"q": "What yield loss do Haryana farmers accept at 6-8 dS/m?", "a": "About 30-40%."}, {"q": "Why can India's farmers use quite saline water long term?", "a": "Monsoon rainfall leaches accumulated salts."}, {"q": "Why irrigate with saline sprinklers at night?", "a": "Less evaporation and leaf absorption of salts, so less foliar injury."}, {"q": "What salinity does Egypt target when blending drainage with Nile water?", "a": "About 1.0 dS/m."}, {"q": "What crops does Siwa Oasis grow with 2-10 dS/m groundwater?", "a": "Olives, date palms and cereals."}, {"q": "What did Tunisian research stress as critical for success with saline water?", "a": "Germination and emergence (seedbed condition and irrigation method)."}], "for_rush": "Siwa and Tunisian date systems are close analogues to UAE oasis farming.", "priority": "useful"}, {"n": 4, "title": "Water Quality Assessment", "pdf_pages": "online", "minutes": 40, "summary": ["Three hazards: permeability/tilth (Na, high pH, low EC), salinity (osmotic) and specific toxicity (Cl, Na, B).", "Maas-Hoffman model: relative yield = 100 - b(ECe - a), where a is threshold and b is % loss per dS/m above it.", "Example thresholds (ECe): barley 8.0, cotton 7.7, sugarbeet 7.0, sorghum 6.8, wheat 6.0, alfalfa 2.0, bean 1.0 dS/m.", "Plants tolerate salt fairly well at germination but are more sensitive at emergence and early seedling stages.", "Chloride-sensitive plants may be injured above 5-10 mmolc/L Cl in the saturation extract; calcium should be at least 2 mmolc/L.", "Watsuit (or a simple concentration-factor method) predicts root-zone salinity from water quality and leaching fraction (0.05-0.40)."], "terms": [{"term": "Threshold (a)", "def": "The maximum ECe a crop tolerates without yield loss."}, {"term": "Slope (b)", "def": "Percentage yield lost per dS/m increase above the threshold."}, {"term": "Leaching fraction (LF)", "def": "Fraction of applied water that drains below the root zone."}, {"term": "Adjusted SAR", "def": "SAR corrected for calcium precipitation or dissolution in the soil."}, {"term": "Concentration factor (Fc)", "def": "Multiplier relating irrigation water EC to root-zone salinity for a given LF."}, {"term": "Water-uptake-weighted salinity", "def": "Root-zone salinity averaged according to where roots take up water."}], "cards": [{"q": "Write the Maas-Hoffman equation.", "a": "Yr = 100 - b(ECe - a); a = threshold (dS/m), b = % yield loss per dS/m above it."}, {"q": "A crop has a = 6 dS/m and b = 7%. Expected yield at ECe 8?", "a": "100 - 7 x (8 - 6) = 86%."}, {"q": "ECe threshold for barley and cotton?", "a": "Barley 8.0, cotton 7.7 dS/m."}, {"q": "ECe threshold for wheat and alfalfa?", "a": "Wheat 6.0, alfalfa 2.0 dS/m."}, {"q": "At which growth stage are crops most salt-sensitive?", "a": "Emergence and early seedling stage (germination is relatively tolerant)."}, {"q": "Above what chloride concentration may sensitive plants be injured?", "a": "About 5-10 mmolc/L in the saturation extract."}, {"q": "Minimum calcium for nutritional adequacy under saline/sodic conditions?", "a": "At least 2 mmolc/L, with Ca:Mg above 1."}, {"q": "How does pH above 8 affect soil permeability?", "a": "It worsens it by increasing repulsion between clay particles."}, {"q": "How does a higher leaching fraction affect root-zone salinity?", "a": "Lowers it, because more salt is flushed below the roots."}], "for_rush": "Threshold and slope values are the phenotypes that salt-tolerance QTL/GWAS studies try to improve.", "priority": "core"}, {"n": 5, "title": "Environmental and Ecological Aspects", "pdf_pages": "online", "minutes": 20, "summary": ["Hazards: lost productivity (salinity, waterlogging), polluted water, damaged ecosystems and health risks.", "About 25% of irrigated land worldwide is salinity-damaged (some estimates up to 50%); India had about 20 million ha (36%).", "Irrigation adds roughly 1-60 tonnes of salt per hectare per year depending on water quality.", "Kesterson Reservoir: selenium at about 35 ppb in drainage water caused deformities and deaths of waterfowl.", "Keep saline drainage separate from good water; control at source with efficient irrigation and reuse."], "terms": [{"term": "Waterlogging", "def": "Saturation of the root zone by a high water table."}, {"term": "Bioaccumulation", "def": "Build-up of a substance (e.g. selenium) in organisms faster than it is lost."}, {"term": "Evaporation pond", "def": "Pond used to dispose of saline drainage water by evaporation."}, {"term": "Source control", "def": "Reducing drainage volume at the field by efficient irrigation."}], "cards": [{"q": "What share of world irrigated land is damaged by salinity?", "a": "About 25% (some estimates up to 50%)."}, {"q": "How much salt can irrigation add per hectare per year?", "a": "About 1-60 tonnes, depending on water salinity and amount."}, {"q": "What element caused wildlife deaths at Kesterson?", "a": "Selenium (about 35 ppb in drainage water)."}, {"q": "Why keep saline drainage separate from good water?", "a": "Blending reduces the usable good water for sensitive crops."}, {"q": "Name three contaminants that can reach groundwater below drains.", "a": "Any three of: salts, nitrates, selenium, boron, pesticides."}], "for_rush": "", "priority": "skim"}, {"n": 6, "title": "Management Principles and Practices for Safe Use of Saline Water", "pdf_pages": "online", "minutes": 35, "summary": ["Apply enough water beyond ET to meet the leaching requirement, and keep a salt balance (salt out ≥ salt in).", "Drainage removes excess water and salts and controls the water table; the safe water table depth is not one fixed value.", "Drip irrigation is recommended for saline water; salts collect at the wetted edge. Avoid sprinkling sensitive crops with saline water, or sprinkle at night.", "Plant on sloping or double-row flat beds below the salt-accumulation zone; use pre-emergence irrigation with good water.", "Deep ploughing (40-150 cm), sanding, gypsum, organic matter and mulching help.", "Cyclic 'dual rotation' strategy: good water for sensitive crops and seedlings, saline drainage water for tolerant crops (cotton, sugarbeet, wheat) after establishment - preferred over blending."], "terms": [{"term": "Leaching requirement (Lr)", "def": "Fraction of infiltrated water that must pass the root zone to keep salinity acceptable."}, {"term": "Salt balance", "def": "Removing at least as much salt as irrigation adds."}, {"term": "Cyclic (dual-rotation) strategy", "def": "Switching between good and saline water by crop and growth stage."}, {"term": "Blending", "def": "Mixing saline and good water into one supply."}, {"term": "Pre-emergence irrigation", "def": "Irrigation with good water to keep salts low around germinating seeds."}], "cards": [{"q": "What is the leaching requirement?", "a": "The fraction of infiltrated water that must drain through the root zone to keep salinity within crop tolerance."}, {"q": "Why is drip irrigation recommended for saline water?", "a": "Frequent application keeps root-zone salinity and matric stress low near the emitter."}, {"q": "Where do salts accumulate under drip?", "a": "At the edges of the wetted zone and on the surface between emitters."}, {"q": "Where should seeds go on a furrow-irrigated bed with saline water?", "a": "On the slope of a sloping bed or shoulders of a double-row flat bed, below the salt-accumulation zone."}, {"q": "Why is the cyclic strategy often better than blending?", "a": "It allows sensitive crops to get good water, needs no blending infrastructure and avoids wasting usable water."}, {"q": "When is saline water introduced for tolerant crops in the cyclic strategy?", "a": "After seedling establishment with good-quality water."}, {"q": "How deep is the deep ploughing recommended for saline soils?", "a": "About 40-150 cm, roughly every 3-4 years."}, {"q": "Which amendment is most common for sodic soils irrigated with high-SAR water?", "a": "Gypsum."}], "for_rush": "UAE farms irrigate with brackish groundwater by drip - this chapter is the playbook.", "priority": "core"}]}, {"slug": "fao_waterquality", "short": "Water Quality for Agriculture (FAO 29)", "emoji": "🚰", "color": "#3c6e9c", "warn": "", "title": "Water Quality for Agriculture (FAO Irrigation and Drainage Paper 29 Rev.1)", "authors": "R.S. Ayers and D.W. Westcot", "edition": "1985 (reprinted 1989, 1994) (FAO)", "file": "", "url": "https://www.fao.org/4/t0234e/t0234e00.htm", "licence": "FAO copyright; free online from the publisher", "overview": "The classic FAO reference for judging whether water is suitable for irrigation and livestock. It gives the famous Table 1 guidelines for salinity, infiltration, specific-ion toxicity and miscellaneous problems, crop tolerance tables, the leaching requirement formula, and 25 field case studies including Bahrain and the UAE.", "how": "Learn Chapter 1's guideline table and Chapter 2's crop tolerance and leaching formulas thoroughly; read Chapters 3-5 for specific problems and the Gulf case studies in Chapter 8.", "free": true, "chapters": [{"n": 1, "title": "Water Quality Evaluation and Guidelines", "pdf_pages": "online", "minutes": 35, "summary": ["Four problem types: salinity, water infiltration rate, specific ion toxicity and miscellaneous effects.", "Salinity restriction: ECw <0.7 none, 0.7-3.0 slight to moderate, >3.0 dS/m severe (TDS <450, 450-2,000, >2,000 mg/L).", "Infiltration depends on SAR and ECw together, e.g. SAR 0-3: no problem if ECw >0.7, severe if <0.2 dS/m.", "Toxicity (surface irrigation): SAR <3 none, 3-9 moderate, >9 severe; Cl <4, 4-10, >10 meq/L; boron <0.7, 0.7-3.0, >3.0 mg/L.", "Miscellaneous: NO3-N <5, 5-30, >30 mg/L; bicarbonate (sprinklers) <1.5, 1.5-8.5, >8.5 meq/L; normal pH 6.5-8.4.", "Assumes leaching fraction ≥15%, sandy loam to clay loam with good drainage, and soil-water salinity about three times the applied water."], "terms": [{"term": "ECw", "def": "Electrical conductivity of irrigation water (dS/m)."}, {"term": "SAR", "def": "Sodium adsorption ratio = Na / sqrt((Ca + Mg)/2), in meq/L."}, {"term": "Degree of restriction", "def": "None, slight to moderate, or severe limitation on water use."}, {"term": "meq/L", "def": "Milliequivalents per litre, concentration adjusted for ion charge."}, {"term": "Specific ion toxicity", "def": "Damage from accumulation of a particular ion (Na, Cl, B) in plant tissue."}, {"term": "Leaching fraction", "def": "Fraction of applied water percolating below the root zone (guidelines assume ≥15%)."}], "cards": [{"q": "ECw ranges for no, slight-moderate and severe salinity restriction?", "a": "<0.7, 0.7-3.0 and >3.0 dS/m."}, {"q": "TDS equivalents for those salinity classes?", "a": "<450, 450-2,000 and >2,000 mg/L."}, {"q": "Boron restriction thresholds?", "a": "<0.7 none, 0.7-3.0 slight-moderate, >3.0 mg/L severe."}, {"q": "Chloride thresholds for surface irrigation?", "a": "<4 none, 4-10 slight-moderate, >10 meq/L severe."}, {"q": "Sodium/chloride limit for sprinkler irrigation?", "a": "Above 3 meq/L causes restriction (leaf absorption risk)."}, {"q": "Normal pH range for irrigation water?", "a": "6.5-8.4."}, {"q": "Why can very pure water (ECw <0.2 dS/m) cause problems?", "a": "It leaches calcium and disperses the surface soil, reducing infiltration."}, {"q": "Write the SAR formula.", "a": "SAR = Na / sqrt((Ca + Mg)/2), all in meq/L."}, {"q": "What leaching fraction do the guidelines assume?", "a": "At least 15%."}, {"q": "Nitrate-N above which level is a severe restriction for sensitive crops?", "a": "Above 30 mg/L."}], "for_rush": "Use Table 1 to judge your tap or RO water before mixing hydroponic nutrients; it is also the standard checklist for UAE well water.", "priority": "core"}, {"n": 2, "title": "Salinity Problems: Build-up, Crop Effects and Management", "pdf_pages": "online", "minutes": 45, "summary": ["Crops remove water but leave salts; salinity of drainage water ECdw = ECw / LF.", "At 15-20% leaching fraction: ECe ≈ 1.5 ECw and soil-water ECsw ≈ 3 ECw.", "Salt causes an osmotic effect that mimics drought; crop tolerance varies 8-10 fold.", "Thresholds (ECe, dS/m, 100% yield): barley 8.0, cotton 7.7, sorghum 6.8, wheat 6.0, date palm 4.0, tomato 2.5, cucumber 2.5, spinach 2.0, alfalfa 2.0, orange 1.7, lettuce 1.3, onion 1.2, bean/carrot/strawberry 1.0.", "Leaching requirement LR = ECw / (5 ECe - ECw); applied water AW = ET / (1 - LR).", "Keep the water table at least 2 m deep in arid areas; surface salinity above 4 dS/m may delay germination; intermittent ponding leaches more efficiently than continuous ponding."], "terms": [{"term": "ECe", "def": "Electrical conductivity of the soil saturation extract."}, {"term": "Osmotic effect", "def": "Extra force a plant must exert to extract water from salty soil."}, {"term": "Leaching requirement (LR)", "def": "Minimum leaching fraction needed to keep root-zone salinity within crop tolerance."}, {"term": "ECdw", "def": "Salinity of drainage water leaving the root zone."}, {"term": "Salt index", "def": "Relative salt effect of a fertiliser compared with sodium nitrate."}, {"term": "Intermittent ponding", "def": "Alternating ponding and drying cycles for leaching, using less water than continuous ponding."}], "cards": [{"q": "Relationship between ECe and ECw at a 15-20% leaching fraction?", "a": "ECe ≈ 1.5 x ECw."}, {"q": "Write the leaching requirement formula.", "a": "LR = ECw / (5 ECe - ECw)."}, {"q": "LR for ECw = 2 dS/m and a crop tolerating ECe = 4 dS/m?", "a": "2 / (20 - 2) = 0.11, i.e. about 11%."}, {"q": "How do you calculate total applied water including leaching?", "a": "AW = ET / (1 - LR)."}, {"q": "Threshold ECe and ECw for date palm?", "a": "ECe 4.0, ECw 2.7 dS/m (50% yield at ECe 18)."}, {"q": "Threshold ECe for spinach, and ECe at 50% yield?", "a": "2.0 dS/m; 8.6 dS/m at 50% yield."}, {"q": "Threshold ECe for tomato and lettuce?", "a": "Tomato 2.5; lettuce 1.3 dS/m."}, {"q": "Which crops have the lowest thresholds in the list (1.0 dS/m)?", "a": "Bean, carrot and strawberry."}, {"q": "Minimum water table depth recommended in arid areas?", "a": "At least 2 m."}, {"q": "Above what surface ECe may germination be delayed?", "a": "About 4 dS/m."}, {"q": "Why is intermittent ponding preferred for leaching?", "a": "It removes salts more efficiently and uses less water."}], "for_rush": "Spinach tolerates ECe 2.0 dS/m before yield loss - a useful reference point alongside the typical hydroponic nutrient EC you run.", "priority": "core"}, {"n": 3, "title": "Infiltration Problems", "pdf_pages": "online", "minutes": 30, "summary": ["Infiltration problems occur when water enters soil too slowly to meet crop needs.", "Very low salinity water (ECw <0.2 dS/m) almost always causes problems by leaching calcium.", "High sodium relative to calcium (above about 3:1) disperses soil; adjusted RNa uses a corrected calcium value (Cax).", "Gypsum: 86 kg of pure gypsum per 1,000 m3 of water adds 1 meq/L calcium; soil rates 5-40 t/ha.", "Sulphuric acid or sulphur release calcium from soil lime; blending, deep tillage, fibrous residues and irrigation changes also help."], "terms": [{"term": "Infiltration rate", "def": "Speed at which water enters the soil surface."}, {"term": "Adjusted RNa (adj SAR)", "def": "Sodium ratio using an adjusted calcium (Cax) that reflects post-irrigation calcium equilibrium."}, {"term": "Cax", "def": "Adjusted calcium concentration based on ECw and the HCO3/Ca ratio."}, {"term": "Dispersion", "def": "Breakdown of aggregates into individual particles that clog pores."}], "cards": [{"q": "Why does very low salinity water reduce infiltration?", "a": "It leaches calcium and salts from the surface, so aggregates disperse and seal pores."}, {"q": "How much gypsum raises calcium by 1 meq/L in 1,000 m3 of water?", "a": "About 86 kg of 100% gypsum."}, {"q": "Typical soil gypsum rates?", "a": "About 5-40 t/ha (40 t/ha for severe sodic reclamation)."}, {"q": "How do sulphur and sulphuric acid help sodic, calcareous soils?", "a": "They dissolve soil lime, releasing calcium to replace sodium."}, {"q": "Why is adjusted RNa better than SAR?", "a": "It accounts for calcium precipitation or dissolution after irrigation."}, {"q": "Name two irrigation changes that help infiltration problems.", "a": "More frequent irrigation, longer sets, pre-plant irrigation, or switching to sprinkler/drip."}], "for_rush": "RO/desalinated water used in the UAE is very low in salts - the same infiltration risk applies if it is used unamended on soils.", "priority": "useful"}, {"n": 4, "title": "Toxicity Problems", "pdf_pages": "online", "minutes": 30, "summary": ["Chloride burn starts at leaf tips; tree crops are injured at about 0.3% Cl in leaf dry weight.", "Sodium burn appears at leaf edges; tree crops are harmed at about 0.25-0.50% Na in leaves.", "Boron toxicity yellows leaf tips and edges, usually when leaf boron exceeds 250-300 mg/kg.", "Boron tolerance groups: very sensitive <0.5 mg/L (lemon, blackberry); sensitive 0.5-0.75 (citrus, grape, avocado); tolerant 4-6 (tomato, alfalfa); very tolerant 6-15 (cotton, asparagus).", "Sprinkler foliar injury: sensitive crops (citrus, almond, plum) at <5 meq/L Na or Cl; tolerant (cauliflower, cotton, sugarbeet) above 20 meq/L.", "Leaching controls toxic ions (boron needs about three times more water than chloride); sprinkle at night or switch to drip."], "terms": [{"term": "Leaf burn", "def": "Drying and death of leaf tissue from toxic ion accumulation."}, {"term": "Foliar absorption", "def": "Uptake of salts through wetted leaves under sprinkler irrigation."}, {"term": "Rootstock", "def": "The root part of a grafted tree, which strongly affects chloride and sodium exclusion."}, {"term": "Boron tolerance group", "def": "Crop classification by the boron concentration they tolerate."}], "cards": [{"q": "Where do chloride and sodium burn first appear?", "a": "Chloride at leaf tips; sodium at leaf edges."}, {"q": "Leaf chloride level that injures tree crops?", "a": "About 0.3% of dry weight."}, {"q": "Leaf boron level linked to toxicity symptoms?", "a": "Above about 250-300 mg/kg."}, {"q": "Give a very sensitive and a very tolerant crop for boron.", "a": "Lemon (very sensitive, <0.5 mg/L); cotton or asparagus (very tolerant, 6-15 mg/L)."}, {"q": "How much more leaching water does boron need than chloride?", "a": "About three times as much."}, {"q": "Na/Cl in sprinkler water that injures sensitive crops like citrus?", "a": "Below 5 meq/L can already injure them (damage seen at 3 meq/L)."}, {"q": "Why do rotating sprinklers increase foliar injury?", "a": "Leaves dry between passes, concentrating salts on the surface."}, {"q": "Name three ways to cut sprinkler toxicity.", "a": "Irrigate at night, faster rotation/higher rates, or switch to drip/furrow/undertree methods."}], "for_rush": "Leaf ion analysis and ion-exclusion traits (Na/Cl) are standard phenotypes in salt-tolerance genomics.", "priority": "core"}, {"n": 5, "title": "Miscellaneous Problems", "pdf_pages": "online", "minutes": 35, "summary": ["Nitrate-N above 5 mg/L affects sensitive crops (lower sugar in beets, delayed grape maturity); count it in fertiliser plans.", "Normal water pH is 6.5-8.4; abnormal pH signals other issues and is managed via soil amendments (lime or sulphur).", "Bicarbonate scale on fruit/leaves under sprinklers at low humidity; acidify water (e.g. sulphuric acid to about 90% of HCO3).", "Mg-dominated water (Ca/Mg <1) raises ESP; calcium should be at least 10-15% of total cations for good roots.", "Trace element maxima (mg/L) include Al 5.0, As 0.10, Cd 0.01, Cu 0.20, Fe 5.0, Mn 0.20, Mo 0.01, Ni 0.20, Pb 5.0, Se 0.02, Zn 2.0, Li 2.5 (citrus 0.075).", "Drip clogging: suspended solids >100 mg/L, pH >8.0, TDS >2,000 mg/L, Fe or Mn >1.5 mg/L or bacteria >50,000/mL are severe; chlorination and acid flushing help."], "terms": [{"term": "Scale deposit", "def": "White calcium carbonate/sulphate deposit left on leaves and fruit by evaporating water."}, {"term": "Trace elements", "def": "Elements needed in tiny amounts or toxic at low levels, e.g. Cd, Mo, Se."}, {"term": "Emitter clogging", "def": "Blockage of drip emitters by particles, chemical precipitates or microbial slime."}, {"term": "Langelier Saturation Index", "def": "Index predicting whether water will precipitate calcium carbonate."}, {"term": "Chlorination", "def": "Adding chlorine to control algae and bacteria in irrigation systems."}], "cards": [{"q": "Above what nitrate-N do sensitive crops respond adversely?", "a": "About 5 mg/L."}, {"q": "How is bicarbonate scaling reduced?", "a": "Acidify water (e.g. sulphuric acid to about 90% of HCO3), sprinkle at night, or change method."}, {"q": "Why is Mg-dominated water a problem?", "a": "With Ca/Mg below 1, soil ESP becomes higher than normal and calcium may become deficient."}, {"q": "Recommended maximum cadmium and selenium in irrigation water?", "a": "Cd 0.01 mg/L; Se 0.02 mg/L."}, {"q": "What share of applied trace elements accumulates in soil?", "a": "More than 85%."}, {"q": "Severe drip clogging thresholds for iron/manganese and TDS?", "a": "Fe or Mn >1.5 mg/L; TDS >2,000 mg/L."}, {"q": "pH target to prevent calcium carbonate clogging?", "a": "About 6.5 (or periodic acid flushing)."}, {"q": "Chlorine residual suggested for iron control in drip systems?", "a": "About 1 mg/L."}], "for_rush": "Drip clogging, pH control near 6.5 and chlorination are exactly the maintenance issues of a home hydroponic or drip system.", "priority": "useful"}, {"n": 6, "title": "Water Quality for Livestock and Poultry", "pdf_pages": "online", "minutes": 15, "summary": ["EC <1.5 dS/m is excellent for all livestock and poultry; 1.5-5.0 very satisfactory.", "5-8 dS/m is fine for livestock but unfit for poultry; 8-11 limited (avoid for pregnant/lactating animals).", "11-16 dS/m very limited; above 16 dS/m not recommended.", "Limits include nitrate+nitrite 100 mg/L, fluoride 2.0, arsenic 0.2, lead 0.1, mercury 0.01, selenium 0.05 mg/L.", "Change gradually from low to high salinity water; magnesium can cause scouring."], "terms": [{"term": "Scouring", "def": "Diarrhoea in livestock, which excess magnesium can cause."}, {"term": "Ruminant", "def": "Cud-chewing animal such as cattle, sheep or goats, generally more salt-tolerant."}, {"term": "Settling basin", "def": "Pond where sediment drops out before water use."}], "cards": [{"q": "Water EC above which water is unfit for poultry?", "a": "Above 5 dS/m."}, {"q": "EC rated excellent for all livestock?", "a": "Below 1.5 dS/m."}, {"q": "EC above which water is not recommended for any livestock?", "a": "Above 16 dS/m."}, {"q": "Maximum fluoride for livestock water?", "a": "2.0 mg/L."}, {"q": "Why change water salinity gradually?", "a": "Abrupt changes from low to high salinity cause more problems."}], "for_rush": "", "priority": "skim"}, {"n": 7, "title": "Irrigation Water Quality and Wastewater Re-use", "pdf_pages": "online", "minutes": 20, "summary": ["Subsurface drainage water is a major water-quality threat because it is salty; reuse it before disposal.", "Agriculture can use lower-quality water, so treated wastewater irrigation makes sense in arid regions.", "WHO criteria include removing solids and parasite eggs and no more than 100 coliforms per 100 mL in 80% of samples.", "Primary treatment suits non-food crops; raw-eaten vegetables need secondary treatment plus disinfection (California: ≤2.2 coliforms/100 mL).", "Drip and furrow systems reduce contamination; sprinklers carry the greatest microbial risk."], "terms": [{"term": "Primary treatment", "def": "Settling to remove suspended solids."}, {"term": "Secondary treatment", "def": "Biological treatment such as activated sludge or filters."}, {"term": "Tertiary treatment", "def": "Advanced treatment: filtration, activated carbon, denitrification, ion exchange."}, {"term": "Coliforms", "def": "Indicator bacteria used to judge faecal contamination."}], "cards": [{"q": "WHO coliform criterion for wastewater irrigation?", "a": "No more than 100 coliforms per 100 mL in 80% of samples."}, {"q": "California coliform limit for raw-eaten vegetables (surface irrigation)?", "a": "2.2 per 100 mL."}, {"q": "Which treatment level suffices for crops not eaten directly by people?", "a": "Primary treatment."}, {"q": "Which irrigation method carries the greatest microbial risk with wastewater?", "a": "Sprinklers."}, {"q": "Why is wastewater reuse attractive in arid regions?", "a": "It saves fresh water and solves effluent disposal."}], "for_rush": "Treated sewage effluent is widely used for landscape and fodder irrigation in the UAE.", "priority": "skim"}, {"n": 8, "title": "Experiences Using Water of Various Qualities (incl. Bahrain and UAE)", "pdf_pages": "online", "minutes": 30, "summary": ["Bahrain: about 70 mm rain/year; groundwater 3.25-4.95 dS/m; dates, alfalfa and vegetables; better leaching and more frequent irrigation would raise yields; soil calcium (carbonates, gypsum) reduced sodium effects.", "UAE (FAO/UNDP programme from 1976): drip-irrigated tomatoes yielded 109,000 kg/ha vs 65,000 kg/ha furrow.", "UAE lemons: sprinklers caused leaf burn; drip gave the lowest leaf chloride (0.61% vs 1.43% under sprinklers).", "UAE night sprinkling raised potato yield 77% and saved 25% water vs day sprinkling; onions +25-50%.", "Arizona cotton on 6.2-11.1 dS/m water approached state yields; Broadview showed full drainage recycling degrades water over time."], "terms": [{"term": "Night sprinkling", "def": "Running sprinklers at night to reduce evaporation and leaf salt uptake."}, {"term": "Drainage recycling", "def": "Reusing drainage water within the same district."}, {"term": "Bubbler irrigation", "def": "Low-pressure localised flooding around each tree."}, {"term": "Case study", "def": "A documented field example illustrating principles in practice."}], "cards": [{"q": "Groundwater salinity on Bahrain farms surveyed?", "a": "About 3.25-4.95 dS/m."}, {"q": "Why was sodium less harmful than expected in Bahrain?", "a": "Abundant calcium from carbonates and gypsum in the soils."}, {"q": "UAE tomato yields under drip vs furrow?", "a": "About 109,000 vs 65,000 kg/ha."}, {"q": "UAE lemon leaf chloride under drip vs sprinkler?", "a": "0.61% vs 1.43% (dry weight)."}, {"q": "Effect of night vs day sprinkling on UAE potatoes?", "a": "77% higher yield and 25% water saving."}, {"q": "Lesson from Broadview Water District?", "a": "Recycling all drainage water steadily degrades supply quality; periodic discharge is needed."}, {"q": "What were the UAE's main constraints in the 1970s programme?", "a": "Scarce water, moderate to high salinity, lack of labour and poor practices."}], "for_rush": "Direct UAE evidence: drip and night irrigation beat sprinklers with brackish water - good interview material for UAE agri-tech roles.", "priority": "core"}]}, {"slug": "icba_datepalm", "short": "Date Palm Water Needs (ICBA)", "emoji": "🌴", "color": "#9c6b30", "warn": "", "title": "How Much Water Do Date Palms Need? Research on Irrigation Requirements in Arid and Saline Environments", "authors": "International Center for Biosaline Agriculture (ICBA)", "edition": "2023 (ICBA, Dubai)", "file": "", "url": "https://www.biosaline.org/sites/default/files/2023-11/date-palm-guideline.pdf", "licence": "CC BY-NC 4.0 (as stated in the document)", "overview": "A short ICBA guideline giving indicative daily water needs of date palms through the year, with advice on saline irrigation, efficient drip/bubbler systems, root distribution and sensor-based scheduling, based on research at ICBA's Dubai plantation.", "how": "A quick read: memorise the seasonal litres-per-tree figures and the irrigation principles.", "free": true, "chapters": [{"n": 1, "title": "Seasonal Water Needs o
