<style>
:root{--bg:#fdf6ee;--bg2:#f6e8da;--card:#fffdf9;--fg:#3b3040;--muted:#706573;--line:#efdccb;--trail:#e6c9a8;--leaf:#5cb85c;--sun:#ffc857;--pink:#ff8fab;--lilac:#a99bf0;--sky:#7ec8e3;--n1:#796abb;--n2:#bc5371;--n3:#028478;--on-btn:#fff;--shadow:0 6px 0 rgba(120,80,60,.07),0 12px 26px rgba(120,80,60,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1824;--bg2:#252133;--card:#2a2638;--fg:#f3ecf5;--muted:#a89fb4;--line:#3a3449;--trail:#5a4c6a;--leaf:#7bd389;--sun:#ffd27a;--pink:#ff9fb8;--lilac:#c0b2ff;--sky:#8fd3ea;--n1:#a99bf0;--n2:#ff8fab;--n3:#4fb6a8;--on-btn:#1b1824;--shadow:0 6px 0 rgba(0,0,0,.25),0 12px 26px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1824;--bg2:#252133;--card:#2a2638;--fg:#f3ecf5;--muted:#a89fb4;--line:#3a3449;--trail:#5a4c6a;--leaf:#7bd389;--sun:#ffd27a;--pink:#ff9fb8;--lilac:#c0b2ff;--sky:#8fd3ea;--n1:#a99bf0;--n2:#ff8fab;--n3:#4fb6a8;--on-btn:#1b1824;--shadow:0 6px 0 rgba(0,0,0,.25),0 12px 26px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 Nunito,ui-rounded,system-ui,sans-serif;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 60px}
h1,h2,h3,.fr{font-family:Fredoka,Nunito,sans-serif;text-wrap:balance}
h1{font-size:1.7rem;margin:0}
.muted{color:var(--muted)}
.top{display:flex;gap:10px;align-items:flex-start}.top .g{flex:1;min-width:0}
.ibtn{border:0;background:var(--bg2);color:var(--fg);border-radius:12px;width:38px;height:38px;font-size:1.05rem;cursor:pointer}
.seg{display:flex;background:var(--bg2);border-radius:999px;padding:4px;margin:14px 0;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;font:800 .82rem Nunito;color:var(--muted);cursor:pointer;transition:all .25s}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.breathe{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.breathe .dot{width:26px;height:26px;border-radius:50%;background:var(--sky);flex:none;animation:breathe 8s ease-in-out infinite}
/* trail */
.trail{position:relative;margin-top:10px}
.trail svg.path{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.trail svg.path path{fill:none;stroke:var(--trail);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 18}
.stop{position:relative;width:min(78%,440px);margin:0 0 34px;opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s cubic-bezier(.2,1.3,.4,1)}
.stop.in{opacity:1;transform:none}
.stop.l{margin-right:auto}.stop.r{margin-left:auto}
.bub{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .25s}
.bub:active{transform:scale(.98)}
.stop.past .em{opacity:.6}.stop.past h3{color:var(--muted)}
.stop.here .bub{border-color:var(--sun);box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 30%,transparent),var(--shadow)}
.stop .hd{display:flex;gap:10px;align-items:center}
.stop .em{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;flex:none;background:var(--c)}
.stop .hd .tx{flex:1;min-width:0}
.stop h3{margin:0;font-size:1.05rem}
.stop .dt{font-size:.78rem;color:var(--muted);font-weight:700}
.stop .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.stop.open .more{grid-template-rows:1fr}
.stop .more>div{overflow:hidden}
.stop ul{margin:10px 0 2px;padding-left:20px}.stop li{margin:3px 0}
.lbl{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.youare{position:absolute;top:-16px;font-size:1.8rem;animation:bob 2.2s ease-in-out infinite;z-index:2}
.stop.l .youare{right:-14px}.stop.r .youare{left:-14px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--sun);color:#3b3040;margin-left:6px;vertical-align:2px}
.finish{text-align:center;padding:10px 0 0}
.finish .f{font-size:3rem;display:inline-block;animation:bob 3s ease-in-out infinite}
/* focus view */
.focus{display:grid;gap:14px}
.fcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,1.2,.4,1)}
.fcard.now{border-color:var(--sun)}
.big3{display:grid;gap:10px;margin-top:10px}
.one{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--bg2)}
.one .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .95rem Fredoka;color:var(--on-btn);flex:none}
.one .tx{min-width:0}
.later{color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.links a{flex:1;min-width:140px;text-align:center;text-decoration:none;font-weight:800;padding:12px;border-radius:16px;background:var(--card);border:2px solid var(--line);color:var(--fg);box-shadow:var(--shadow)}
.tips{display:grid;gap:8px;margin-top:6px}
.tip{display:flex;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg2);font-size:.9rem}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:12px;font-weight:800;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
a.homebtn{display:inline-grid;place-items:center;text-decoration:none;flex:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes breathe{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:520px){.stop{width:88%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stop{opacity:1;transform:none}}
</style>

  box.append(h("div",{class:"tips",style:"margin-top:12px"},...tips.map(([e,t])=>h("div",{class:"tip"},h("span",{style:"font-size:1.3rem"},e),h("div",{},t)))));
  box.append(h("div",{class:"fcard",style:"margin-top:14px;text-align:center"},h("div",{class:"fr",style:"font-size:1.15rem;font-weight:700"},"Your only job right now:"),h("div",{style:"margin-top:6px"},"open Sprout → do your one step → tick it. That's it. 🌱")));
}

// ---------- modes ----------
const views={now:nowView,trail:trailView,calm:calmView}; const built={};
function mode(m){document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  for(const k in views){document.getElementById(k).hidden=k!==m;} if(!built[m]){views[m]();built[m]=1;}
  try{sessionStorage.setItem("path-mode",m)}catch(e){} }
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>mode(b.dataset.m)));
let m0="now";try{m0=sessionStorage.getItem("path-mode")||"now"}catch(e){} mode(m0);
const tb=document.getElementById("themeBtn");
function applyTheme(t){if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;tb.textContent=dark?"☀️":"🌙";}
let th=null;try{th=localStorage.getItem("path-theme")}catch(e){} applyTheme(th);
tb.addEventListener("click",()=>{const a=document.documentElement.getAttribute("data-theme");const dark=a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const n=dark?"light":"dark";applyTheme(n);try{localStorage.setItem("path-theme",n)}catch(e){}});
})();
</script>
